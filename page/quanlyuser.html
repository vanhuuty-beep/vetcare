<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Nhân Viên - VetCare Pro</title>
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/smart-search.js"></script>
    
    <!-- Gọi file CSS chung -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
    <link rel="stylesheet" href="../css/smart-search.css">

    <style>
        .search-box {
            padding: 8px 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus {
            border-color: #2563eb;
        }
        .card-header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Tùy chỉnh form thêm/sửa */
        .modal-container {
            width: 450px;
            padding: 20px 24px;
        }
        .modal-header {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group-modal {
            margin-bottom: 12px;
        }
        .form-group-modal label {
            font-size: 13px;
            margin-bottom: 4px;
            display: block;
            font-weight: 500;
        }
        .form-group-modal input, .form-group-modal select {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- THANH MENU BÊN TRÁI -->
    <div id="menu-container"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="card">
                <div class="card-header">
                    <h3>Quản Lý Tài Khoản Hệ Thống</h3>
                    <div class="card-header-actions">
                        <input type="text" id="searchInput" class="search-box" placeholder="Tìm tên, mã NV, email..." onkeyup="timKiemUser()">
                        <button class="btn-primary" onclick="moModalThem()" style="background-color: #0284c7;">+ Thêm Tài Khoản</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr style="background: #1e3a8a; color: white;">
                                <th>Mã NV / ID</th>
                                <th>Tên Đăng Nhập</th>
                                <th>Email</th>
                                <th>Vai Trò (Quyền)</th>
                                <th>Trạng Thái</th>
                                <th>Ngày Tạo</th>
                                <th style="text-align: center;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="data-table">
                            <!-- Dữ liệu nạp tự động từ Supabase -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP FORM THÊM / SỬA -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin:0; font-size: 16px;">Thêm tài khoản mới</h3>
                <button class="close-modal" onclick="dongModal()" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            
            <input type="hidden" id="editingId">
            
            <!-- Ô hiển thị Mã nhân viên / tài khoản tự động -->
            <div class="form-group-modal">
                <label>Mã nhân viên (Tự động):</label>
                <input type="text" id="manhanvien" readonly style="background-color: #f1f5f9; font-weight: bold; color: #0284c7;">
            </div>
            
            <div class="form-group-modal">
                <label>Tên đăng nhập (tentaikhoan) (*):</label>
                <input type="text" id="tentaikhoan" placeholder="Ví dụ: nhanvien01, bacsi01...">
            </div>

            <div class="form-group-modal">
                <label>Email:</label>
                <input type="email" id="email" placeholder="Nhập địa chỉ email...">
            </div>

            <div class="form-group-modal">
                <label>Mật khẩu (*):</label>
                <input type="password" id="matkhau" placeholder="Nhập mật khẩu...">
                <small style="color:#666; font-size:11px;">Mật khẩu sẽ được mã hóa an toàn khi lưu.</small>
            </div>

            <div class="form-group-modal">
                <label>Vai trò / Quyền hạn (vaitro):</label>
                <select id="vaitro">
                    <option value="Nhân viên">Nhân viên / Lễ tân</option>
                    <option value="Bác sĩ">Bác sĩ</option>
                </select>
            </div>

            <div class="form-group-modal">
                <label>Trạng thái (trangthai):</label>
                <select id="trangthai">
                    <option value="Hoạt động">Hoạt động</option>
                    <option value="Khóa">Khóa tài khoản</option>
                </select>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuUser()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <script>
        let danhSachUserGoc = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await taiDanhSachUser();
        });

        // Hàm lấy chính xác mã phòng khám hiện tại (tránh lặp chữ PK)
        function layMaPhongKhamChuan() {
            try {
                const userStr = sessionStorage.getItem('currentUser');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    if (user?.maphongkham) return user.maphongkham.replace('PK_', '').replace('PK', '').replace('_', '');
                }
                const sessionMpk = sessionStorage.getItem('maphongkham');
                if (sessionMpk) return sessionMpk.replace('PK_', '').replace('PK', '').replace('_', '');
            } catch (e) {}
            return '617723';
        }

        // Hàm mã hóa mật khẩu SHA-256
        async function maHoaMatKhau(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Tải dữ liệu từ bảng 'user'
        async function taiDanhSachUser() {
            const { data, error } = await db.from('user').select('*').order('id', { ascending: false });
            if (error) {
                console.error('Lỗi tải danh sách người dùng:', error);
                alert('Không thể tải dữ liệu. Lỗi: ' + error.message);
            } else {
                danhSachUserGoc = data || [];
                hienThiBang(danhSachUserGoc);
            }
        }

        function hienThiBang(data) {
            const tableBody = document.getElementById('data-table');
            tableBody.innerHTML = '';
            
            if(data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#777; padding: 20px;">Chưa có tài khoản nào</td></tr>`;
                return;
            }

            data.forEach(item => {
                const maNVFormatted = item.manhanvien || ('NVPK' + layMaPhongKhamChuan() + String(item.id).padStart(4, '0'));
                
                const vaiTroBadge = item.vaitro === 'Bác sĩ' 
                    ? `<span style="background: #e0f2fe; color: #0284c7; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px;">Bác sĩ</span>`
                    : `<span style="background: #f1f5f9; color: #334155; padding: 3px 8px; border-radius: 4px; font-size: 11px;">Nhân viên</span>`;
                
                const trangThaiBadge = item.trangthai === 'Khóa'
                    ? `<span style="color: #dc2626; font-weight: 500;">Khóa</span>`
                    : `<span style="color: #059669; font-weight: 500;">Hoạt động</span>`;

                const ngayTao = item.created_at ? new Date(item.created_at).toLocaleDateString('vi-VN') : '---';

                tableBody.innerHTML += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 10px;"><strong>${maNVFormatted}</strong></td>
                        <td style="padding: 10px; color: #2563eb; font-weight: bold;">${item.tentaikhoan || ''}</td>
                        <td style="padding: 10px; color: #475569;">${item.email || '---'}</td>
                        <td style="padding: 10px;">${vaiTroBadge}</td>
                        <td style="padding: 10px;">${trangThaiBadge}</td>
                        <td style="padding: 10px; font-size: 12px; color: #64748b;">${ngayTao}</td>
                        <td style="padding: 10px; text-align: center;">
                            <button class="btn-edit" onclick="moModalSua(${item.id})" style="background: #0284c7; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; margin-right: 4px;">Sửa</button>
                            <button class="btn-delete" onclick="xoaUser(${item.id})" style="background: #dc2626; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        function timKiemUser() {
            const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
            const ketQuaLoc = danhSachUserGoc.filter(item => {
                const username = (item.tentaikhoan || '').toLowerCase();
                const email = (item.email || '').toLowerCase();
                const vaitro = (item.vaitro || '').toLowerCase();
                const maNV = (item.manhanvien || ('nvpk' + layMaPhongKhamChuan() + String(item.id).padStart(4, '0'))).toLowerCase();
                return username.includes(tuKhoa) || email.includes(tuKhoa) || vaitro.includes(tuKhoa) || maNV.includes(tuKhoa);
            });
            hienThiBang(ketQuaLoc);
        }

        function moModalThem() {
            document.getElementById('editingId').value = '';
            
            // Tự động sinh mã nhân viên chuẩn phòng khám kèm 4 chữ số ngẫu nhiên
            const maPK = layMaPhongKhamChuan();
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('manhanvien').value = 'NVPK' + maPK + randomNum;

            document.getElementById('tentaikhoan').value = '';
            document.getElementById('email').value = '';
            document.getElementById('matkhau').value = '';
            document.getElementById('vaitro').value = 'Nhân viên';
            document.getElementById('trangthai').value = 'Hoạt động';
            
            document.getElementById('modalTitle').innerText = 'Thêm tài khoản mới';
            document.getElementById('userModal').style.display = 'flex';
        }

        function moModalSua(id) {
            const item = danhSachUserGoc.find(x => x.id === id);
            if (!item) return;

            const maNVFormatted = item.manhanvien || ('NVPK' + layMaPhongKhamChuan() + String(item.id).padStart(4, '0'));

            document.getElementById('editingId').value = item.id;
            document.getElementById('manhanvien').value = maNVFormatted;
            document.getElementById('tentaikhoan').value = item.tentaikhoan || '';
            document.getElementById('email').value = item.email || '';
            document.getElementById('matkhau').value = ''; 
            document.getElementById('vaitro').value = item.vaitro || 'Nhân viên';
            document.getElementById('trangthai').value = item.trangthai || 'Hoạt động';

            document.getElementById('modalTitle').innerText = 'Cập nhật tài khoản (Mã: ' + maNVFormatted + ')';
            document.getElementById('userModal').style.display = 'flex';
        }

        function dongModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        async function luuUser() {
            const id = document.getElementById('editingId').value;
            const manhanvien = document.getElementById('manhanvien').value.trim();
            const tentaikhoan = document.getElementById('tentaikhoan').value.trim();
            const email = document.getElementById('email').value.trim();
            const matKhauPlain = document.getElementById('matkhau').value.trim();
            const vaitro = document.getElementById('vaitro').value;
            const trangthai = document.getElementById('trangthai').value;

            if (!tentaikhoan) {
                alert('Vui lòng điền Tên đăng nhập!');
                return;
            }

            if (id === "" && !matKhauPlain) {
                alert('Vui lòng nhập mật khẩu cho tài khoản mới!');
                return;
            }

            const payload = {
                manhanvien: manhanvien,
                tentaikhoan: tentaikhoan,
                email: email,
                vaitro: vaitro,
                trangthai: trangthai
            };

            if (matKhauPlain) {
                payload.matkhau = await maHoaMatKhau(matKhauPlain);
            }

            if (id === "") {
                const { error } = await db.from('user').insert([payload]);
                if (error) {
                    alert('Lỗi thêm tài khoản: ' + error.message);
                } else {
                    alert('Thêm tài khoản thành công!');
                    dongModal();
                    taiDanhSachUser();
                }
            } else {
                const { error } = await db.from('user').update(payload).eq('id', id);
                if (error) {
                    alert('Lỗi cập nhật: ' + error.message);
                } else {
                    alert('Cập nhật tài khoản thành công!');
                    dongModal();
                    taiDanhSachUser();
                }
            }
        }

        async function xoaUser(id) {
            if (confirm('Bạn có chắc chắn muốn xóa tài khoản này không?')) {
                const { error } = await db.from('user').delete().eq('id', id);
                if (error) {
                    alert('Lỗi khi xóa: ' + error.message);
                } else {
                    alert('Xóa tài khoản thành công!');
                    taiDanhSachUser();
                }
            }
        }
    </script>
</body>
</html>
