<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Kho Vắc-xin - VetCare Pro</title>
    <!-- Thư viện Supabase JS -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
	<script src="../js/smart-search.js"></script>
    <!-- Gọi file CSS chung -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
	<link rel="stylesheet" href="../css/smart-search.css">

    <style>
        .search-box {
            padding: 8px 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus {
            border-color: #2563eb;
        }
        .card-header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Tối ưu modal gọn gàng */
        .modal-container {
            width: 500px;
            padding: 20px 24px;
        }
        .modal-header {
            margin-bottom: 12px;
            padding-bottom: 8px;
        }
        .form-group-modal {
            margin-bottom: 10px;
        }
        .form-group-modal label {
            font-size: 13px;
            margin-bottom: 3px;
            display: block;
            font-weight: 500;
        }
        .form-group-modal input, .form-group-modal select {
            width: 100%;
            padding: 7px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-row .form-group-modal {
            flex: 1;
            margin-bottom: 0;
        }
        .modal-footer {
            margin-top: 15px;
            padding-top: 10px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* CSS Phân trang */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            font-size: 13px;
        }
        .pagination-buttons {
            display: flex;
            gap: 5px;
        }
        .pagination-buttons button {
            padding: 5px 10px;
            border: 1px solid #cbd5e1;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .pagination-buttons button:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .pagination-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- THANH MENU BÊN TRÁI -->
    <div id="menu-container"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="card">
                <div class="card-header">
                    <h3>Quản lý Kho Vắc-xin</h3>
                    <div class="card-header-actions">
                        <input type="text" id="searchInput" class="search-box" placeholder="Tìm tên vắc-xin, số lô, loại..." onkeyup="timKiemVaccine()">
                        <button class="btn-primary" onclick="moModalThem()">+ Thêm vắc-xin mới</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã vắc-xin</th>
                                <th>Tên vắc-xin</th>
                                <th>Loại vắc-xin</th>
                                <th>Số lô (solo)</th>
                                <th>Hạn dùng</th>
                                <th>SL Nhập</th>
                                <th>Đã tiêm</th>
                                <th>Còn lại</th>
                                <th>Giá bán</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="data-table">
                            <!-- Dữ liệu được nạp tự động từ Supabase -->
                        </tbody>
                    </table>
                </div>

                <!-- Khu vực Phân trang -->
                <div class="pagination-container">
                    <div id="pagination-info">Hiển thị 0 - 0 của 0 bản ghi</div>
                    <div class="pagination-buttons">
                        <button id="prevBtn" onclick="doiTrang(-1)">Trang trước</button>
                        <span id="pageIndicator" style="padding: 5px 10px; align-self: center;">Trang 1 / 1</span>
                        <button id="nextBtn" onclick="doiTrang(1)">Trang sau</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP FORM THÊM / SỬA VẮC-XIN -->
    <div class="modal-overlay" id="vaccineModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm vắc-xin mới</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            
            <input type="hidden" id="editingId">
            
            <!-- Ô hiển thị/nhập Mã vắc-xin tự động -->
            <div class="form-group-modal">
                <label>Mã vắc-xin (Tự động):</label>
                <input type="text" id="mavaccine" readonly style="background-color: #f1f5f9; font-weight: bold; color: #0284c7;">
            </div>

            <div class="form-group-modal">
                <label>Tên vắc-xin (tenvaccine) (*):</label>
                <input type="text" id="tenvaccine" placeholder="Nhập tên vắc-xin...">
            </div>

            <div class="form-group-modal">
                <label>Loại vắc-xin (loaivaccine):</label>
                <input type="text" id="loaivaccine" placeholder="Ví dụ: Dại, 5 trong 1, 7 trong 1...">
            </div>

            <div class="form-row">
                <div class="form-group-modal">
                    <label>Số lô (solo):</label>
                    <input type="text" id="solo" placeholder="VD: VX12345...">
                </div>
                <div class="form-group-modal">
                    <label>Hạn dùng (handung):</label>
                    <input type="date" id="handung">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group-modal">
                    <label>Số lượng nhập (soluongnhap):</label>
                    <input type="number" id="soluongnhap" placeholder="VD: 50">
                </div>
                <div class="form-group-modal">
                    <label>Đã tiêm (datiem):</label>
                    <input type="number" id="datiem" value="0" placeholder="VD: 10">
                </div>
            </div>

            <div class="form-group-modal">
                <label>Giá bán (giaban - VNĐ):</label>
                <input type="number" step="1000" id="giaban" placeholder="VD: 120000">
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuVaccine()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <script>
        let danhSachVaccineGoc = [];
        let danhSachLoc = [];
        let trangHienTai = 1;
        const soDongMoiTrang = 10;

        window.addEventListener('DOMContentLoaded', () => {
            fetchDuLieuKhoVaccine();
        });

        // Hàm lấy chính xác mã phòng khám hiện tại từ sessionStorage
        function layMaPhongKhamChuan() {
            try {
                const userStr = sessionStorage.getItem('currentUser');
                if (userStr) {
                    const user = JSON.parse(userStr);
                    if (user?.maphongkham) return user.maphongkham.replace('_', '');
                }
                const sessionMpk = sessionStorage.getItem('maphongkham');
                if (sessionMpk) return sessionMpk.replace('_', '');
            } catch (e) {}
            return '617723'; // Mặc định nếu không tìm thấy
        }

        // Tải danh sách kho vắc-xin từ Supabase
        async function fetchDuLieuKhoVaccine() {
            const { data, error } = await db.from('khovaccine').select('*').order('id', { ascending: false });

            if (error) {
                console.error('Lỗi tải kho vắc-xin:', error);
            } else {
                danhSachVaccineGoc = data || [];
                danhSachLoc = [...danhSachVaccineGoc];
                trangHienTai = 1;
                hienThiPhanTrang();
            }
        }

        // Hiển thị ra bảng giao diện theo trang
        function hienThiPhanTrang() {
            const tableBody = document.getElementById('data-table');
            tableBody.innerHTML = '';
            
            if(danhSachLoc.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:#777;">Kho vắc-xin hiện chưa có dữ liệu</td></tr>`;
                document.getElementById('pagination-info').innerText = 'Hiển thị 0 - 0 của 0 bản ghi';
                document.getElementById('pageIndicator').innerText = 'Trang 1 / 1';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            const tongSoTrang = Math.ceil(danhSachLoc.length / soDongMoiTrang);
            if (trangHienTai > tongSoTrang) trangHienTai = tongSoTrang;
            if (trangHienTai < 1) trangHienTai = 1;

            const batDau = (trangHienTai - 1) * soDongMoiTrang;
            const ketThuc = Math.min(batDau + soDongMoiTrang, danhSachLoc.length);
            const duLieuTrang = danhSachLoc.slice(batDau, ketThuc);

            duLieuTrang.forEach(item => {
                const maVaccineFormatted = item.mavaccine || ('VX' + layMaPhongKhamChuan() + String(item.id).padStart(4, '0'));
                const slNhap = parseInt(item.soluongnhap) || 0;
                const daTiem = parseInt(item.datiem) || 0;
                const tonKho = slNhap - daTiem;
                const giaFormatted = item.giaban ? Number(item.giaban).toLocaleString('vi-VN') + ' đ' : '0 đ';

                tableBody.innerHTML += `<tr>
                    <td><strong>${maVaccineFormatted}</strong></td>
                    <td>${item.tenvaccine || ''}</td>
                    <td><span style="color: #0284c7; font-weight: 600;">${item.loaivaccine || 'Chưa phân loại'}</span></td>
                    <td>${item.solo || ''}</td>
                    <td>${item.handung || ''}</td>
                    <td>${slNhap}</td>
                    <td><strong style="color: #d97706;">${daTiem}</strong></td>
                    <td><strong style="color: #059669;">${tonKho >= 0 ? tonKho : 0}</strong></td>
                    <td><strong style="color: #059669;">${giaFormatted}</strong></td>
                    <td>
                        <button class="btn-edit" onclick="moModalSua(${item.id}, '${item.tenvaccine || ''}', '${item.loaivaccine || ''}', '${item.solo || ''}', '${item.handung || ''}', '${slNhap}', '${daTiem}', '${item.giaban !== null ? item.giaban : ''}', '${maVaccineFormatted}')">Sửa</button>
                        <button class="btn-delete" onclick="xoaVaccine(${item.id})">Xóa</button>
                    </td>
                </tr>`;
            });

            document.getElementById('pagination-info').innerText = `Hiển thị ${batDau + 1} - ${ketThuc} của ${danhSachLoc.length} bản ghi`;
            document.getElementById('pageIndicator').innerText = `Trang ${trangHienTai} / ${tongSoTrang}`;
            document.getElementById('prevBtn').disabled = (trangHienTai === 1);
            document.getElementById('nextBtn').disabled = (trangHienTai === tongSoTrang);
        }

        function doiTrang(huong) {
            trangHienTai += huong;
            hienThiPhanTrang();
        }

        function timKiemVaccine() {
            const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
            danhSachLoc = danhSachVaccineGoc.filter(item => {
                const ten = (item.tenvaccine || '').toLowerCase();
                const soLo = (item.solo || '').toLowerCase();
                const loai = (item.loaivaccine || '').toLowerCase();
                const ma = (item.mavaccine || ('VX' + layMaPhongKhamChuan() + String(item.id).padStart(4, '0'))).toLowerCase();
                
                return ten.includes(tuKhoa) || soLo.includes(tuKhoa) || loai.includes(tuKhoa) || ma.includes(tuKhoa);
            });
            trangHienTai = 1;
            hienThiPhanTrang();
        }

        // Mở Modal Thêm - Tự động gắn đúng mã phòng khám thực tế của tài khoản đăng nhập
        function moModalThem() {
    document.getElementById('editingId').value = '';
    
    // Tạo 4 số ngẫu nhiên từ 1000 đến 9999
    const maPK = layMaPhongKhamChuan();
    const randomNum = Math.floor(1000 + Math.random() * 9000); 
    document.getElementById('mavaccine').value = 'VX' + maPK + randomNum;

    document.getElementById('tenvaccine').value = '';
    document.getElementById('loaivaccine').value = '';
    document.getElementById('solo').value = '';
    document.getElementById('handung').value = '';
    document.getElementById('soluongnhap').value = '';
    document.getElementById('datiem').value = '0';
    document.getElementById('giaban').value = '';
    
    document.getElementById('modalTitle').innerText = 'Thêm vắc-xin mới vào kho';
    document.getElementById('vaccineModal').style.display = 'flex';
}

        function moModalSua(id, tenvaccine, loaivaccine, solo, handung, soluongnhap, datiem, giaban, mavaccine) {
            document.getElementById('editingId').value = id;
            document.getElementById('mavaccine').value = mavaccine;
            document.getElementById('tenvaccine').value = tenvaccine;
            document.getElementById('loaivaccine').value = loaivaccine;
            document.getElementById('solo').value = solo;
            document.getElementById('handung').value = handung;
            document.getElementById('soluongnhap').value = soluongnhap;
            document.getElementById('datiem').value = datiem;
            document.getElementById('giaban').value = giaban;
            
            document.getElementById('modalTitle').innerText = 'Cập nhật thông tin vắc-xin (Mã: ' + mavaccine + ')';
            document.getElementById('vaccineModal').style.display = 'flex';
        }

        function dongModal() {
            document.getElementById('vaccineModal').style.display = 'none';
        }

        async function luuVaccine() {
            const id = document.getElementById('editingId').value;
            const mavaccine = document.getElementById('mavaccine').value.trim();
            const tenvaccine = document.getElementById('tenvaccine').value.trim();
            const loaivaccine = document.getElementById('loaivaccine').value.trim();
            const solo = document.getElementById('solo').value.trim();
            const handung = document.getElementById('handung').value;
            const soluongnhapStr = document.getElementById('soluongnhap').value.trim();
            const datiemStr = document.getElementById('datiem').value.trim();
            const giabanStr = document.getElementById('giaban').value.trim();

            if (!tenvaccine) {
                alert('Vui lòng nhập tên vắc-xin!');
                return;
            }

            const payload = {
                mavaccine: mavaccine,
                tenvaccine: tenvaccine,
                loaivaccine: loaivaccine,
                solo: solo,
                handung: handung !== "" ? handung : null,
                soluongnhap: soluongnhapStr !== "" ? parseInt(soluongnhapStr) : 0,
                datiem: datiemStr !== "" ? parseInt(datiemStr) : 0,
                giaban: giabanStr !== "" ? parseFloat(giabanStr) : 0
            };

            if (id === "") {
                const { error } = await db.from('khovaccine').insert([payload]);
                if (error) {
                    alert('Lỗi thêm vắc-xin: ' + error.message);
                } else {
                    alert('Thêm vắc-xin thành công!');
                    dongModal();
                    fetchDuLieuKhoVaccine();
                }
            } else {
                const { error } = await db.from('khovaccine').update(payload).eq('id', id);
                if (error) {
                    alert('Lỗi cập nhật vắc-xin: ' + error.message);
                } else {
                    alert('Cập nhật thành công!');
                    dongModal();
                    fetchDuLieuKhoVaccine();
                }
            }
        }

        async function xoaVaccine(id) {
            if (confirm('Bạn có chắc chắn muốn xóa vắc-xin ID: ' + id + ' này không?')) {
                const { error } = await db.from('khovaccine').delete().eq('id', id);
                if (error) {
                    alert('Lỗi khi xóa: ' + error.message);
                } else {
                    alert('Xóa thành công!');
                    fetchDuLieuKhoVaccine();
                }
            }
        }
    </script>
</body>
</html>
