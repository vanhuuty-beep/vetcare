<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Kho Vắc-xin - VetCare Pro</title>
    <!-- Thư viện Supabase JS -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
	<script src="../js/smart-search.js"></script>
    <!-- Gọi file CSS chung -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
	<link rel="stylesheet" href="../css/smart-search.css">

    <style>
        .search-box {
            padding: 8px 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus {
            border-color: #2563eb;
        }
        .card-header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Tối ưu modal gọn gàng */
        .modal-container {
            width: 500px;
            padding: 20px 24px;
        }
        .modal-header {
            margin-bottom: 12px;
            padding-bottom: 8px;
        }
        .form-group-modal {
            margin-bottom: 10px;
        }
        .form-group-modal label {
            font-size: 13px;
            margin-bottom: 3px;
            display: block;
            font-weight: 500;
        }
        .form-group-modal input, .form-group-modal select {
            width: 100%;
            padding: 7px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-row .form-group-modal {
            flex: 1;
            margin-bottom: 0;
        }
        .modal-footer {
            margin-top: 15px;
            padding-top: 10px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- THANH MENU BÊN TRÁI -->
    <div id="menu-container"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="card">
                <div class="card-header">
                    <h3>Quản lý Kho Vắc-xin</h3>
                    <div class="card-header-actions">
                        <input type="text" id="searchInput" class="search-box" placeholder="Tìm tên vắc-xin, số lô, loại..." onkeyup="timKiemVaccine()">
                        <button class="btn-primary" onclick="moModalThem()">+ Thêm vắc-xin mới</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã vắc-xin</th>
                                <th>Tên vắc-xin</th>
                                <th>Loại vắc-xin</th>
                                <th>Số lô (solo)</th>
                                <th>Hạn dùng</th>
                                <th>SL Nhập</th>
                                <th>Đã tiêm</th>
                                <th>Còn lại</th>
                                <th>Giá bán</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="data-table">
                            <!-- Dữ liệu được nạp tự động từ Supabase -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP FORM THÊM / SỬA VẮC-XIN -->
    <div class="modal-overlay" id="vaccineModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm vắc-xin mới</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            
            <input type="hidden" id="editingId">
            
            <div class="form-group-modal">
                <label>Tên vắc-xin (tenvaccine) (*):</label>
                <input type="text" id="tenvaccine" placeholder="Nhập tên vắc-xin...">
            </div>

            <div class="form-group-modal">
                <label>Loại vắc-xin (loaivaccine):</label>
                <input type="text" id="loaivaccine" placeholder="Ví dụ: Dại, 5 trong 1, 7 trong 1...">
            </div>

            <div class="form-row">
                <div class="form-group-modal">
                    <label>Số lô (solo):</label>
                    <input type="text" id="solo" placeholder="VD: VX12345...">
                </div>
                <div class="form-group-modal">
                    <label>Hạn dùng (handung):</label>
                    <input type="date" id="handung">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group-modal">
                    <label>Số lượng nhập (soluongnhap):</label>
                    <input type="number" id="soluongnhap" placeholder="VD: 50">
                </div>
                <div class="form-group-modal">
                    <label>Đã tiêm (datiem):</label>
                    <input type="number" id="datiem" value="0" placeholder="VD: 10">
                </div>
            </div>

            <div class="form-group-modal">
                <label>Giá bán (giaban - VNĐ):</label>
                <input type="number" step="1000" id="giaban" placeholder="VD: 120000">
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuVaccine()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <script>
        let danhSachVaccineGoc = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchDuLieuKhoVaccine();
        });

        // Tải danh sách kho vắc-xin từ Supabase
        async function fetchDuLieuKhoVaccine() {
            const { data, error } = await db.from('khovaccine').select('*').order('id', { ascending: false });

            if (error) {
                console.error('Lỗi tải kho vắc-xin:', error);
            } else {
                danhSachVaccineGoc = data;
                hienThiBang(danhSachVaccineGoc);
            }
        }

        // Hiển thị ra bảng giao diện
        function hienThiBang(data) {
            const tableBody = document.getElementById('data-table');
            tableBody.innerHTML = '';
            
            if(data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:#777;">Kho vắc-xin hiện chưa có dữ liệu</td></tr>`;
                return;
            }

            data.forEach(item => {
                const maVaccineFormatted = 'VX' + String(item.id).padStart(4, '0');
                const slNhap = parseInt(item.soluongnhap) || 0;
                const daTiem = parseInt(item.datiem) || 0;
                const tonKho = slNhap - daTiem;
                const giaFormatted = item.giaban ? Number(item.giaban).toLocaleString('vi-VN') + ' đ' : '0 đ';

                tableBody.innerHTML += `<tr>
                    <td><strong>${maVaccineFormatted}</strong></td>
                    <td>${item.tenvaccine || ''}</td>
                    <td><span style="color: #0284c7; font-weight: 600;">${item.loaivaccine || 'Chưa phân loại'}</span></td>
                    <td>${item.solo || ''}</td>
                    <td>${item.handung || ''}</td>
                    <td>${slNhap}</td>
                    <td><strong style="color: #d97706;">${daTiem}</strong></td>
                    <td><strong style="color: #059669;">${tonKho >= 0 ? tonKho : 0}</strong></td>
                    <td><strong style="color: #059669;">${giaFormatted}</strong></td>
                    <td>
                        <button class="btn-edit" onclick="moModalSua(${item.id}, '${item.tenvaccine || ''}', '${item.loaivaccine || ''}', '${item.solo || ''}', '${item.handung || ''}', '${slNhap}', '${daTiem}', '${item.giaban !== null ? item.giaban : ''}')">Sửa</button>
                        <button class="btn-delete" onclick="xoaVaccine(${item.id})">Xóa</button>
                    </td>
                </tr>`;
            });
        }

        // Tìm kiếm vắc-xin
        function timKiemVaccine() {
            const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
            const ketQuaLoc = danhSachVaccineGoc.filter(item => {
                const ten = (item.tenvaccine || '').toLowerCase();
                const soLo = (item.solo || '').toLowerCase();
                const loai = (item.loaivaccine || '').toLowerCase();
                
                return ten.includes(tuKhoa) || soLo.includes(tuKhoa) || loai.includes(tuKhoa);
            });
            hienThiBang(ketQuaLoc);
        }

        // Mở Modal Thêm
        function moModalThem() {
            document.getElementById('editingId').value = '';
            document.getElementById('tenvaccine').value = '';
            document.getElementById('loaivaccine').value = '';
            document.getElementById('solo').value = '';
            document.getElementById('handung').value = '';
            document.getElementById('soluongnhap').value = '';
            document.getElementById('datiem').value = '0';
            document.getElementById('giaban').value = '';
            
            document.getElementById('modalTitle').innerText = 'Thêm vắc-xin mới vào kho';
            document.getElementById('vaccineModal').style.display = 'flex';
        }

        // Mở Modal Sửa
        function moModalSua(id, tenvaccine, loaivaccine, solo, handung, soluongnhap, datiem, giaban) {
            document.getElementById('editingId').value = id;
            document.getElementById('tenvaccine').value = tenvaccine;
            document.getElementById('loaivaccine').value = loaivaccine;
            document.getElementById('solo').value = solo;
            document.getElementById('handung').value = handung;
            document.getElementById('soluongnhap').value = soluongnhap;
            document.getElementById('datiem').value = datiem;
            document.getElementById('giaban').value = giaban;
            
            document.getElementById('modalTitle').innerText = 'Cập nhật thông tin vắc-xin (ID: ' + id + ')';
            document.getElementById('vaccineModal').style.display = 'flex';
        }

        // Đóng Modal
        function dongModal() {
            document.getElementById('vaccineModal').style.display = 'none';
        }

        // Lưu dữ liệu (Thêm hoặc Cập nhật)
        async function luuVaccine() {
            const id = document.getElementById('editingId').value;
            const tenvaccine = document.getElementById('tenvaccine').value.trim();
            const loaivaccine = document.getElementById('loaivaccine').value.trim();
            const solo = document.getElementById('solo').value.trim();
            const handung = document.getElementById('handung').value;
            const soluongnhapStr = document.getElementById('soluongnhap').value.trim();
            const datiemStr = document.getElementById('datiem').value.trim();
            const giabanStr = document.getElementById('giaban').value.trim();

            if (!tenvaccine) {
                alert('Vui lòng nhập tên vắc-xin!');
                return;
            }

            const payload = {
                tenvaccine: tenvaccine,
                loaivaccine: loaivaccine,
                solo: solo,
                handung: handung !== "" ? handung : null,
                soluongnhap: soluongnhapStr !== "" ? parseInt(soluongnhapStr) : 0,
                datiem: datiemStr !== "" ? parseInt(datiemStr) : 0,
                giaban: giabanStr !== "" ? parseFloat(giabanStr) : 0
            };

            if (id === "") {
                const { error } = await db.from('khovaccine').insert([payload]);
                if (error) {
                    alert('Lỗi thêm vắc-xin: ' + error.message);
                } else {
                    alert('Thêm vắc-xin thành công!');
                    dongModal();
                    fetchDuLieuKhoVaccine();
                }
            } else {
                const { error } = await db.from('khovaccine').update(payload).eq('id', id);
                if (error) {
                    alert('Lỗi cập nhật vắc-xin: ' + error.message);
                } else {
                    alert('Cập nhật thành công!');
                    dongModal();
                    fetchDuLieuKhoVaccine();
                }
            }
        }

        // Xóa vắc-xin
        async function xoaVaccine(id) {
            if (confirm('Bạn có chắc chắn muốn xóa vắc-xin ID: ' + id + ' này không?')) {
                const { error } = await db.from('khovaccine').delete().eq('id', id);
                if (error) {
                    alert('Lỗi khi xóa: ' + error.message);
                } else {
                    alert('Xóa thành công!');
                    fetchDuLieuKhoVaccine();
                }
            }
        }
    </script>
</body>
</html>
