<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thu Chi - VetCare Pro</title>
    
    <!-- Thư viện Supabase JS & Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/smart-search.js"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Hệ Thống -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
    <link rel="stylesheet" href="../css/smart-search.css">

    <style>
:root{--primary:#2563eb;--success:#059669;--warning:#d97706;--danger:#dc2626;--purple:#7c3aed;--cyan:#0891b2;--bg:#f1f5f9;--text:#172033;--muted:#94a3b8;--border:#e5eaf1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}
.tc-page{padding:16px}.tc-shell{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 6px 28px rgba(15,23,42,.055);overflow:hidden}
.tc-head{padding:17px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #edf1f5}
.tc-title{display:flex;align-items:center;gap:11px}.tc-title-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#059669;background:linear-gradient(135deg,#ecfdf5,#d1fae5);font-size:18px}.tc-title h2{margin:0;font-size:19px;font-weight:800}.tc-title p{margin:4px 0 0;color:#94a3b8;font-size:11px}
.tc-tools{display:flex;align-items:center;gap:9px}.tc-search{position:relative}.tc-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:13px}.tc-search input{width:240px;height:40px;padding:0 12px 0 35px;border:1px solid #dce3ed;border-radius:9px;outline:0;background:#f9fafc;font-size:13px}.tc-search input:focus{background:#fff;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.09)}
.tc-add{height:40px;padding:0 15px;border:0;border-radius:9px;color:#fff;background:linear-gradient(135deg,#059669,#047857);font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(5,150,105,.18)}
.tc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 20px 10px}.tc-stat{min-height:72px;display:flex;align-items:center;gap:12px;padding:12px 15px;border:1px solid #e9edf3;border-radius:12px;background:#fbfcfe}.tc-stat-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.tc-stat.thu .tc-stat-icon{color:#059669;background:#ecfdf5}.tc-stat.chi .tc-stat-icon{color:#dc2626;background:#fee2e2}.tc-stat.balance .tc-stat-icon{color:#2563eb;background:#eff6ff}
.tc-stat-number{font-size:18px;font-weight:800}.tc-stat-label{margin-top:3px;color:#94a3b8;font-size:11px}

.tc-filters{display:flex;gap:7px;padding:5px 20px 14px;flex-wrap:wrap;align-items:center}.tc-filter{height:32px;padding:0 12px;border:1px solid #dfe5ed;border-radius:8px;background:#fff;color:#64748b;font-size:11px;font-weight:700;cursor:pointer}.tc-filter.active{color:#fff;background:#2563eb;border-color:#2563eb}
.tc-count{margin-left:auto;color:#64748b;font-size:11px}

.table-responsive{padding:0 20px 20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf1f5}
th{background:#f8fafc;font-weight:700;color:#475569;font-size:12px}
tr:hover{background:#f9fafc}
.badge-thu{background:#dcfce7;color:#15803d;padding:4px 10px;border-radius:6px;font-weight:bold;font-size:11px;display:inline-block}
.badge-chi{background:#fee2e2;color:#b91c1c;padding:4px 10px;border-radius:6px;font-weight:bold;font-size:11px;display:inline-block}

/* Modal CSS */
.modal-overlay{background:rgba(15,23,42,.6)!important;backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center}
.modal-container{background:#fff;border-radius:16px!important;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)!important;width:520px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:18px 22px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:17px;font-weight:700;color:#1e293b}
.close-modal{background:none;border:none;font-size:20px;color:#64748b;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.close-modal:hover{background:#e2e8f0}
.modal-body-scroll{padding:20px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.form-group-modal{display:flex;flex-direction:column;gap:6px}
.form-group-modal label{font-size:12px;font-weight:600;color:#475569}
.form-group-modal input, .form-group-modal select, .form-group-modal textarea{height:40px;padding:0 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;color:#1e293b;background:#fff;outline:none}
.form-group-modal textarea{height:70px;padding:8px 12px;resize:vertical}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{padding:14px 22px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:10px}
.modal-footer button{height:38px;padding:0 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-secondary{background:#fff;border:1px solid #cbd5e1;color:#475569}
.btn-primary{background:#059669;border:none;color:#fff}
</style>
</head>
<body>

    <!-- THANH MENU -->
    <div id="menu-container"></div>

    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="tc-page">
                <div class="tc-shell">
                    <div class="tc-head">
                        <div class="tc-title">
                            <div class="tc-title-icon"><i class="fa-solid fa-wallet"></i></div>
                            <div><h2>Quản lý Thu Chi</h2><p>Kiểm soát dòng tiền, doanh thu và chi phí phòng khám</p></div>
                        </div>
                        <div class="tc-tools">
                            <div class="tc-search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="text" placeholder="Tìm kiếm nội dung, danh mục..." oninput="timKiemThuChi()"></div>
                            <button class="tc-add" onclick="moModalThem()"><i class="fa-solid fa-plus"></i> Lập Phiếu Mới</button>
                        </div>
                    </div>

                    <!-- THỐNG KÊ TỔNG QUAN -->
                    <div class="tc-stats">
                        <div class="tc-stat thu">
                            <div class="tc-stat-icon"><i class="fa-solid fa-arrow-trend-up"></i></div>
                            <div><div class="tc-stat-number" id="statTongThu" style="color: #059669;">0 đ</div><div class="tc-stat-label">Tổng Thu Nhập</div></div>
                        </div>
                        <div class="tc-stat chi">
                            <div class="tc-stat-icon"><i class="fa-solid fa-arrow-trend-down"></i></div>
                            <div><div class="tc-stat-number" id="statTongChi" style="color: #dc2626;">0 đ</div><div class="tc-stat-label">Tổng Chi Phí</div></div>
                        </div>
                        <div class="tc-stat balance">
                            <div class="tc-stat-icon"><i class="fa-solid fa-scale-balanced"></i></div>
                            <div><div class="tc-stat-number" id="statBalance" style="color: #2563eb;">0 đ</div><div class="tc-stat-label">Cân Đối (Lợi Nhuận)</div></div>
                        </div>
                    </div>

                    <!-- BỘ LỌC -->
                    <div class="tc-filters">
                        <button class="tc-filter active" onclick="locPhieu('all', this)">Tất cả</button>
                        <button class="tc-filter" onclick="locPhieu('Thu', this)">Phiếu Thu</button>
                        <button class="tc-filter" onclick="locPhieu('Chi', this)">Phiếu Chi</button>
                        <span class="tc-count" id="tcCount">Hiển thị 0 giao dịch</span>
                    </div>

                    <!-- BẢNG DANH SÁCH -->
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Mã Phiếu</th>
                                    <th>Loại</th>
                                    <th>Danh Mục</th>
                                    <th>Số Tiền</th>
                                    <th>Hình Thức</th>
                                    <th>Người Nộp / Nhận</th>
                                    <th>Ghi Chú</th>
                                    <th>Thời Gian</th>
                                    <th style="text-align: center;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="tableThuChiBody">
                                <!-- Dữ liệu nạp từ Supabase -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP THÊM / SỬA PHIẾU THU CHI -->
    <div class="modal-overlay" id="tcModal" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Lập Phiếu Thu / Chi</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            
            <div class="modal-body-scroll">
                <input type="hidden" id="editingId">

                <div class="form-row-2">
                    <div class="form-group-modal">
                        <label>Loại phiếu <span style="color:var(--danger)">*</span>:</label>
                        <select id="loaiphieu" onchange="doiDanhMucTheoLoai()">
                            <option value="Thu">Khoản Thu (+)</option>
                            <option value="Chi">Khoản Chi (-)</option>
                        </select>
                    </div>
                    <div class="form-group-modal">
                        <label>Hình thức thanh toán:</label>
                        <select id="hinhthuc">
                            <option value="Tiền mặt">Tiền mặt</option>
                            <option value="Chuyển khoản">Chuyển khoản</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group-modal">
                        <label>Danh mục:</label>
                        <select id="danhmuc">
                            <!-- Danh mục sẽ đổi động theo Thu/Chi -->
                        </select>
                    </div>
                    <div class="form-group-modal">
                        <label>Số tiền (VNĐ) <span style="color:var(--danger)">*</span>:</label>
                        <input type="number" id="sotien" placeholder="Ví dụ: 250000">
                    </div>
                </div>

                <div class="form-group-modal">
                    <label>Người nộp (nếu Thu) / Người nhận (nếu Chi):</label>
                    <input type="text" id="nguoinhan_nop" placeholder="Họ tên khách hàng hoặc nhà cung cấp...">
                </div>

                <div class="form-group-modal">
                    <label>Ghi chú chi tiết:</label>
                    <textarea id="ghichu" placeholder="Nhập nội dung chi tiết giao dịch..."></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuPhieuThuChi()">Lưu Phiếu</button>
            </div>
        </div>
    </div>

    <script>
        let danhSachGoc = [];
        let danhSachHienThi = [];

        const DANH_MUC_THU = [
            "Tiền khám chữa bệnh", "Bán thuốc / Vật tư", "Dịch vụ Spa / Grooming", "Lưu trú / Nội trú", "Thu nhập khác"
        ];
        const DANH_MUC_CHI = [
            "Mua thuốc / Vật tư y tế", "Nhập hàng hóa", "Lương nhân viên", "Điện nước / Internet", "Thuê mặt bằng", "Chi phí khác"
        ];

        window.addEventListener('DOMContentLoaded', () => {
            doiDanhMucTheoLoai();
            taiDuLieuThuChi();
        });

        // Hàm sinh mã phiếu chuẩn: TC + Mã phòng khám + 4 số cuối của ID
        function taoMaPhieu(id) {
            let maPK = sessionStorage.getItem('maphongkham') || 'PK00';
            maPK = maPK.replace(/[_]/g, '').toUpperCase();
            let bonSo = String(id || Date.now()).padStart(4, '0').slice(-4);
            return `TC${maPK}-${bonSo}`;
        }

        function doiDanhMucTheoLoai() {
            const loai = document.getElementById('loaiphieu').value;
            const selectDM = document.getElementById('danhmuc');
            const list = loai === 'Thu' ? DANH_MUC_THU : DANH_MUC_CHI;
            selectDM.innerHTML = list.map(item => `<option value="${item}">${item}</option>`).join('');
        }

        async function taiDuLieuThuChi() {
            try {
                const currentPK = (sessionStorage.getItem('maphongkham') || '').replace(/[_]/g,'').trim().toLowerCase();
                const { data, error } = await db.from('thuchi').select('*').order('id', { ascending: false });

                if (error) {
                    console.error('Lỗi tải thu chi:', error);
                    return;
                }

                const allData = data || [];
                danhSachGoc = currentPK ? allData.filter(item => {
                    const dbPK = item.maphongkham ? String(item.maphongkham).replace(/[_]/g,'').trim().toLowerCase() : '';
                    return dbPK === currentPK;
                }) : allData;

                danhSachHienThi = danhSachGoc;
                hienThiBangThuChi();
            } catch (err) {
                console.error("Lỗi kết nối thu chi:", err);
            }
        }

        function hienThiBangThuChi() {
            const tbody = document.getElementById('tableThuChiBody');
            tbody.innerHTML = '';
            tinhToanThongKe();

            if (!danhSachHienThi.length) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: var(--muted); padding: 40px;">Không có dữ liệu thu chi nào</td></tr>`;
                document.getElementById('tcCount').innerText = 'Hiển thị 0 giao dịch';
                return;
            }

            danhSachHienThi.forEach(item => {
                const isThu = item.loaiphieu === 'Thu';
                const badge = isThu ? `<span class="badge-thu">Thu (+)</span>` : `<span class="badge-chi">Chi (-)</span>`;
                const tienColor = isThu ? '#059669' : '#dc2626';
                const dauTien = isThu ? '+' : '-';
                const thoiGian = item.ngaygiaodich ? new Date(item.ngaygiaodich).toLocaleString('vi-VN') : '---';
                
                // Lấy mã phiếu có sẵn trong DB hoặc tự sinh nếu chưa có
                const maPhieuHienThi = item.maphieu || taoMaPhieu(item.id);

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold; color: var(--primary);">${maPhieuHienThi}</td>
                        <td>${badge}</td>
                        <td style="font-weight: 500;">${item.danhmuc || '---'}</td>
                        <td style="font-weight: bold; color: ${tienColor};">${dauTien}${Number(item.sotien || 0).toLocaleString('vi-VN')} đ</td>
                        <td><span style="font-size: 11px; background: #f1f5f9; padding: 3px 8px; border-radius: 4px;">${item.hinhthuc || 'Tiền mặt'}</span></td>
                        <td>${item.nguoinhan_nop || '---'}</td>
                        <td style="color: #64748b; font-size: 12px;">${item.ghichu || '---'}</td>
                        <td style="font-size: 11px; color: #64748b;">${thoiGian}</td>
                        <td style="text-align: center;">
                            <button onclick="moModalSua(${item.id})" style="background:none; border:none; color:#d97706; cursor:pointer; padding:4px;" title="Sửa"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="xoaPhieu(${item.id})" style="background:none; border:none; color:#dc2626; cursor:pointer; padding:4px; margin-left:6px;" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('tcCount').innerText = `Hiển thị ${danhSachHienThi.length} giao dịch`;
        }

        function tinhToanThongKe() {
            let tongThu = 0;
            let tongChi = 0;

            danhSachGoc.forEach(item => {
                const val = Number(item.sotien || 0);
                if (item.loaiphieu === 'Thu') tongThu += val;
                else if (item.loaiphieu === 'Chi') tongChi += val;
            });

            const balance = tongThu - tongChi;

            document.getElementById('statTongThu').innerText = tongThu.toLocaleString('vi-VN') + ' đ';
            document.getElementById('statTongChi').innerText = tongChi.toLocaleString('vi-VN') + ' đ';
            
            const balEl = document.getElementById('statBalance');
            balEl.innerText = balance.toLocaleString('vi-VN') + ' đ';
            balEl.style.color = balance >= 0 ? '#2563eb' : '#dc2626';
        }

        let loaiDangLoc = 'all';
        function locPhieu(loai, btn) {
            loaiDangLoc = loai;
            document.querySelectorAll('.tc-filter').forEach(x => x.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            danhSachHienThi = danhSachGoc.filter(item => {
                const matchLoai = (loai === 'all') || (item.loaiphieu === loai);
                const matchText = !q || (item.danhmuc || '').toLowerCase().includes(q) || (item.ghichu || '').toLowerCase().includes(q) || (item.nguoinhan_nop || '').toLowerCase().includes(q) || (item.maphieu || '').toLowerCase().includes(q);
                return matchLoai && matchText;
            });
            hienThiBangThuChi();
        }

        function timKiemThuChi() {
            locPhieu(loaiDangLoc, null);
        }

        function moModalThem() {
            document.getElementById('editingId').value = '';
            document.getElementById('loaiphieu').value = 'Thu';
            doiDanhMucTheoLoai();
            document.getElementById('hinhthuc').value = 'Tiền mặt';
            document.getElementById('sotien').value = '';
            document.getElementById('nguoinhan_nop').value = '';
            document.getElementById('ghichu').value = '';
            document.getElementById('modalTitle').innerText = 'Lập Phiếu Thu / Chi Mới';
            document.getElementById('tcModal').style.display = 'flex';
        }

        function moModalSua(id) {
            const item = danhSachGoc.find(x => Number(x.id) === Number(id));
            if (!item) return;

            document.getElementById('editingId').value = item.id;
            document.getElementById('loaiphieu').value = item.loaiphieu || 'Thu';
            doiDanhMucTheoLoai();
            document.getElementById('danhmuc').value = item.danhmuc || '';
            document.getElementById('hinhthuc').value = item.hinhthuc || 'Tiền mặt';
            document.getElementById('sotien').value = item.sotien || '';
            document.getElementById('nguoinhan_nop').value = item.nguoinhan_nop || '';
            document.getElementById('ghichu').value = item.ghichu || '';
            
            const maPhieuHienThuc = item.maphieu || taoMaPhieu(id);
            document.getElementById('modalTitle').innerText = `Cập Nhật Phiếu Thu Chi (${maPhieuHienThuc})`;
            document.getElementById('tcModal').style.display = 'flex';
        }

        function dongModal() {
            document.getElementById('tcModal').style.display = 'none';
        }

        async function luuPhieuThuChi() {
            const id = document.getElementById('editingId').value;
            const loaiphieu = document.getElementById('loaiphieu').value;
            const danhmuc = document.getElementById('danhmuc').value;
            const hinhthuc = document.getElementById('hinhthuc').value;
            const sotien = parseFloat(document.getElementById('sotien').value);
            const nguoinhan_nop = document.getElementById('nguoinhan_nop').value.trim();
            const ghichu = document.getElementById('ghichu').value.trim();
            const maphongkham = sessionStorage.getItem('maphongkham') || '';

            if (isNaN(sotien) || sotien <= 0) {
                alert('Vui lòng nhập số tiền hợp lệ lớn hơn 0!');
                return;
            }

            const payload = {
                loaiphieu,
                danhmuc,
                hinhthuc,
                sotien,
                nguoinhan_nop,
                ghichu,
                maphongkham
            };

            if (id === "") {
                // 1. Thêm mới bản ghi để lấy id tự tăng
                const { data, error } = await db.from('thuchi').insert([payload]).select().single();
                if (error) {
                    alert('Lỗi thêm phiếu: ' + error.message);
                    return;
                }
                
                // 2. Tạo mã phiếu chuẩn kết hợp mã phòng khám và update ngược lại vào database
                if (data && data.id) {
                    const maPhieuMoi = taoMaPhieu(data.id);
                    await db.from('thuchi').update({ maphieu: maPhieuMoi }).eq('id', data.id);
                }
            } else {
                // Nếu sửa, giữ nguyên mã cũ hoặc cập nhật lại theo id hiện tại nếu chưa có
                const existingItem = danhSachGoc.find(x => Number(x.id) === Number(id));
                if (existingItem && !existingItem.maphieu) {
                    payload.maphieu = taoMaPhieu(id);
                }

                const { error } = await db.from('thuchi').update(payload).eq('id', id);
                if (error) {
                    alert('Lỗi cập nhật phiếu: ' + error.message);
                    return;
                }
            }

            dongModal();
            taiDuLieuThuChi();
        }

        async function xoaPhieu(id) {
            if (confirm('Bạn có chắc chắn muốn xóa phiếu thu chi này?')) {
                const { error } = await db.from('thuchi').delete().eq('id', id);
                if (error) {
                    alert('Lỗi khi xóa: ' + error.message);
                } else {
                    taiDuLieuThuChi();
                }
            }
        }
    </script>
</body>
</html>
