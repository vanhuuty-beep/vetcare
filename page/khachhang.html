                    class="btn-secondary"
                    onclick="dongModal()"
                >
                    Hủy
                </button>

                <button
                    class="btn-primary"
                    onclick="luuKhachHang()"
                >
                    <i class="fa-solid fa-floppy-disk"></i>
                    Lưu dữ liệu
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        /* =========================================================
           BIẾN
        ========================================================= */

        let danhSachKhachHangGoc = [];

        let mapThuCung = {};

        let mapLichSuKham = {};

        let boLocHienTai = 'all';


        /* =========================================================
           LẤY SỐ ĐIỆN THOẠI
        ========================================================== */

        function chuanHoaSoDienThoai(sdt) {

            if (!sdt) return '';

            let value = String(sdt).trim();

            if (!value) return '';

            if (value.startsWith('0')) {
                return value;
            }

            return '0' + value;

        }


        /* =========================================================
           ESCAPE HTML
        ========================================================== */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        /* =========================================================
           LẤY CHỮ AVATAR
        ========================================================== */

        function layChuAvatar(ten) {

            if (!ten) return '?';

            const words = String(ten)
                .trim()
                .split(/\s+/)
                .filter(Boolean);

            if (words.length === 1) {

                return words[0]
                    .substring(0, 2)
                    .toUpperCase();

            }

            return (
                words[0].charAt(0) +
                words[words.length - 1].charAt(0)
            ).toUpperCase();

        }


        /* =========================================================
           FORMAT NGÀY
        ========================================================== */

        function formatNgay(ngay) {

            if (!ngay) {
                return '---';
            }

            const d = new Date(ngay);

            if (isNaN(d.getTime())) {
                return '---';
            }

            return d.toLocaleDateString(
                'vi-VN',
                {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }
            );

        }


        /* =========================================================
           FORMAT TIỀN
        ========================================================== */

        function formatTien(tien) {

            const value = Number(tien) || 0;

            return value.toLocaleString('vi-VN') + ' đ';

        }


        /* =========================================================
           LẤY THÔNG TIN KHÁCH HÀNG
        ========================================================== */

        function layThongTinKhachHang(item) {

            const dsPet =
                mapThuCung[item.id] || [];

            const lich =
                mapLichSuKham[item.id] ||
                {
                    tongTien: 0,
                    lanKhamGanNhat: null,
                    soLan: 0
                };

            const tongTien =
                Number(lich.tongTien) || 0;

            const diem =
                Math.floor(tongTien / 100000);

            let loai = 'new';

            if (lich.soLan > 0) {

                if (tongTien >= 5000000) {
                    loai = 'vip';
                }
                else {
                    loai = 'normal';
                }

            }

            return {

                pets: dsPet,

                soPet: dsPet.length,

                lich: lich,

                tongTien: tongTien,

                diem: diem,

                loai: loai

            };

        }


        /* =========================================================
           FETCH KHÁCH HÀNG
        ========================================================== */

        async function fetchKhachHang() {

            const tableBody =
                document.getElementById('data-table');

            tableBody.innerHTML = `
                <div class="customer-loading">
                    <i class="fa-solid fa-spinner"></i>
                    Đang tải dữ liệu khách hàng...
                </div>
            `;


            try {

                /* =================================================
                   RESET MAP
                ================================================= */

                mapThuCung = {};

                mapLichSuKham = {};


                /* =================================================
                   THÚ CƯNG
                ================================================= */

                const {
                    data: tcData,
                    error: tcError
                } = await db
                    .from('thucung')
                    .select('*');


                let petToKhach = {};


                if (!tcError && tcData) {

                    tcData.forEach(tc => {

                        const maKH =
                            tc.makhachhang ||
                            tc.makh ||
                            tc.khachhang_id ||
                            tc.id_khachhang;

                        if (!maKH) {
                            return;
                        }

                        if (!mapThuCung[maKH]) {
                            mapThuCung[maKH] = [];
                        }

                        mapThuCung[maKH].push(tc);

                        if (tc.id) {
                            petToKhach[tc.id] = maKH;
                        }

                    });

                }


                /* =================================================
                   GIÁ VACCINE
                ================================================= */

                let giaVaccineMap = {};


                const {
                    data: khoVcData
                } = await db
                    .from('khovaccine')
                    .select('*');


                if (khoVcData) {

                    khoVcData.forEach(v => {

                        if (v.tenvaccine) {

                            giaVaccineMap[
                                v.tenvaccine
                                    .trim()
                                    .toLowerCase()
                            ] =
                                parseFloat(v.giaban) || 0;

                        }

                    });

                }


                /* =================================================
                   THỐNG KÊ CHI TIÊU
                ================================================= */

                let thongKeChiTieu = {};


                function congTienTheoPetHoacKH(
                    row,
                    soTienTruyXuat,
                    ngayTruyXuat
                ) {

                    let maKH =
                        row.makhachhang ||
                        row.makh ||
                        row.khachhang_id;


                    /* Tìm qua thú cưng */

                    if (!maKH && row.mathucung) {

                        maKH =
                            petToKhach[row.mathucung];

                    }


                    /* Tìm qua khám bệnh */

                    if (
                        !maKH &&
                        row.makhambenh &&
                        window.khamToPet &&
                        window.khamToPet[row.makhambenh]
                    ) {

                        const petId =
                            window.khamToPet[
                                row.makhambenh
                            ];

                        maKH =
                            petToKhach[petId];

                    }


                    if (!maKH) {
                        return;
                    }


                    if (!thongKeChiTieu[maKH]) {

                        thongKeChiTieu[maKH] = {

                            tongTien: 0,

                            lanKhamGanNhat: null,

                            soLan: 0

                        };

                    }


                    const tien =
                        parseFloat(
                            soTienTruyXuat
                        ) || 0;


                    thongKeChiTieu[
                        maKH
                    ].tongTien += tien;


                    if (
                        tien > 0 ||
                        ngayTruyXuat
                    ) {

                        thongKeChiTieu[
                            maKH
                        ].soLan += 1;

                    }


                    if (ngayTruyXuat) {

                        if (
                            !thongKeChiTieu[
                                maKH
                            ].lanKhamGanNhat ||
                            new Date(
                                ngayTruyXuat
                            ) >
                            new Date(
                                thongKeChiTieu[
                                    maKH
                                ].lanKhamGanNhat
                            )
                        ) {

                            thongKeChiTieu[
                                maKH
                            ].lanKhamGanNhat =
                                ngayTruyXuat;

                        }

                    }

                }


                /* =================================================
                   KHÁM BỆNH
                ================================================= */

                window.khamToPet = {};


                const {
                    data: kbData
                } = await db
                    .from('khambenh')
                    .select('*');


                if (kbData) {

                    kbData.forEach(kb => {

                        if (kb.mathucung) {

                            window.khamToPet[
                                kb.id
                            ] =
                                kb.mathucung;

                        }


                        const chiPhi =
                            kb.tongchiphi ||
                            kb.thanhtien ||
                            kb.chiphi ||
                            0;


                        congTienTheoPetHoacKH(
                            kb,
                            chiPhi,
                            kb.ngaykham ||
                            kb.created_at
                        );

                    });

                }


                /* =================================================
                   VACCINE
                ================================================= */

                const {
                    data: vcData
                } = await db
                    .from('nhatkylamvaccine')
                    .select('*');


                if (vcData) {

                    vcData.forEach(vc => {

                        let chiPhi =
                            vc.giatien ||
                            vc.tongtien ||
                            vc.chiphi ||
                            vc.gia ||
                            0;


                        if (
                            chiPhi === 0 &&
                            vc.tenvaccine
                        ) {

                            const keyName =
                                vc.tenvaccine
                                    .trim()
                                    .toLowerCase();

                            chiPhi =
                                giaVaccineMap[
                                    keyName
                                ] || 0;

                        }


                        const ngay =
                            vc.ngaytiem ||
                            vc.created_at;


                        congTienTheoPetHoacKH(
                            vc,
                            chiPhi,
                            ngay
                        );

                    });

                }


                /* =================================================
                   ĐƠN HÀNG
                ================================================= */

                const {
                    data: dhData
                } = await db
                    .from('donhang')
                    .select('*');


                if (dhData) {

                    dhData.forEach(dh => {

                        const chiPhi =
                            dh.tongtien ||
                            dh.total ||
                            dh.thanhtien ||
                            0;


                        congTienTheoPetHoacKH(
                            dh,
                            chiPhi,
                            dh.ngaytao ||
                            dh.created_at
                        );

                    });

                }


                /* =================================================
                   NỘI TRÚ
                ================================================= */

                const {
                    data: ntData
                } = await db
                    .from('nhatkynoitru')
                    .select('*');


                if (ntData) {

                    ntData.forEach(nt => {

                        const chiPhi =
                            nt.thanhtien ||
                            nt.tongchiphi ||
                            nt.chiphi ||
                            0;


                        congTienTheoPetHoacKH(
                            nt,
                            chiPhi,
                            nt.ngayvao ||
                            nt.created_at
                        );

                    });

                }


                /* =================================================
                   HÓA ĐƠN THUỐC
                ================================================= */

                const {
                    data: dtData
                } = await db
                    .from('hoadonthuoc')
                    .select('*');


                if (dtData) {

                    dtData.forEach(dt => {

                        const chiPhi =
                            dt.thanhtien ||
                            dt.tongtien ||
                            dt.Gia ||
                            0;


                        congTienTheoPetHoacKH(
                            dt,
                            chiPhi,
                            dt.created_at
                        );

                    });

                }


                /* =================================================
                   PHIẾU CHỈ ĐỊNH
                ================================================= */

                const {
                    data: pcdData
                } = await db
                    .from('phieuchidinh')
                    .select('*');


                if (pcdData) {

                    pcdData.forEach(pcd => {

                        const chiPhi =
                            pcd.thanhtien ||
                            pcd.tongtien ||
                            0;


                        congTienTheoPetHoacKH(
                            pcd,
                            chiPhi,
                            pcd.ngaychidinh ||
                            pcd.created_at
                        );

                    });

                }


                /* =================================================
                   SPA
                ================================================= */

                const {
                    data: spaData
                } = await db
                    .from('nhatkyspa')
                    .select('*');


                if (spaData) {

                    spaData.forEach(sp => {

                        const chiPhi =
                            sp.tongtien ||
                            sp.giatien ||
                            0;


                        congTienTheoPetHoacKH(
                            sp,
                            chiPhi,
                            sp.created_at
                        );

                    });

                }


                mapLichSuKham =
                    thongKeChiTieu;


                /* =================================================
                   PHÒNG KHÁM
                ================================================= */

                const maphongkham =
                    sessionStorage.getItem(
                        'maphongkham'
                    ) || '';


                const cleanCurrentPK =
                    maphongkham
                        ? maphongkham
                            .replace(/_/g, '')
                            .trim()
                            .toLowerCase()
                        : '';


                /* =================================================
                   KHÁCH HÀNG
                ================================================= */

                const {
                    data,
                    error
                } = await db
                    .from('khachhang')
                    .select('*')
                    .order(
                        'id',
                        {
                            ascending: true
                        }
                    );


                if (error) {

                    console.error(
                        'Lỗi tải khách hàng:',
                        error
                    );

                    hienThiLoi(
                        'Không thể tải dữ liệu khách hàng'
                    );

                    return;

                }


                const danhSachTatCa =
                    data || [];


                /* =================================================
                   LỌC PHÒNG KHÁM
                ================================================= */

                if (cleanCurrentPK) {

                    danhSachKhachHangGoc =
                        danhSachTatCa.filter(item => {

                            const dbPK =
                                item.maphongkham
                                    ? item.maphongkham
                                        .toString()
                                        .replace(
                                            /_/g,
                                            ''
                                        )
                                        .trim()
                                        .toLowerCase()
                                    : '';

                            return (
                                dbPK ===
                                cleanCurrentPK
                            );

                        });

                }
                else {

                    danhSachKhachHangGoc = [];

                }


                hienThiBang(
                    danhSachKhachHangGoc
                );

            }
            catch (error) {

                console.error(error);

                hienThiLoi(
                    'Có lỗi xảy ra khi tải dữ liệu'
                );

            }

        }


        /* =========================================================
           HIỂN THỊ LỖI
        ========================================================== */

        function hienThiLoi(message) {

            document.getElementById(
                'data-table'
            ).innerHTML = `

                <div class="customer-empty">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <strong>
                        ${escapeHtml(message)}
                    </strong>

                    <span>
                        Vui lòng kiểm tra kết nối hoặc thử tải lại trang.
                    </span>

                </div>

            `;

        }


        /* =========================================================
           HIỂN THỊ CARD
        ========================================================== */

        function hienThiBang(data) {

            const grid =
                document.getElementById(
                    'data-table'
                );


            /* =====================================================
               THỐNG KÊ TOÀN BỘ
            ===================================================== */

            const tongKhach =
                danhSachKhachHangGoc.length;


            let tongPet = 0;

            let tongTienTatCa = 0;

            let tongDiemTatCa = 0;


            danhSachKhachHangGoc.forEach(
                kh => {

                    const info =
                        layThongTinKhachHang(
                            kh
                        );


                    tongPet +=
                        info.soPet;


                    tongTienTatCa +=
                        info.tongTien;


                    tongDiemTatCa +=
                        info.diem;

                }
            );


            document.getElementById(
                'statKhachHang'
            ).textContent =
                tongKhach.toLocaleString(
                    'vi-VN'
                );


            document.getElementById(
                'statThuCung'
            ).textContent =
                tongPet.toLocaleString(
                    'vi-VN'
                );


            document.getElementById(
                'statChiTieu'
            ).textContent =
                formatTien(
                    tongTienTatCa
                );


            document.getElementById(
                'statDiem'
            ).textContent =
                tongDiemTatCa.toLocaleString(
                    'vi-VN'
                );


            /* =====================================================
               RENDER
            ===================================================== */

            grid.innerHTML = '';


            if (!data || !data.length) {

                grid.innerHTML = `

                    <div class="customer-empty">

                        <i class="fa-solid fa-user-slash"></i>

                        <strong>
                            Không tìm thấy khách hàng
                        </strong>

                        <span>
                            Thử thay đổi từ khóa hoặc bộ lọc.
                        </span>

                    </div>

                `;


                capNhatFooter(0);

                return;

            }


            data.forEach(item => {

                grid.innerHTML += taoCardKhachHang(
                    item
                );

            });


            capNhatFooter(
                data.length
            );

        }


        /* =========================================================
           TẠO CARD KHÁCH HÀNG
        ========================================================== */

        function taoCardKhachHang(item) {

            const info =
                layThongTinKhachHang(
                    item
                );


            const maKhachHang =
                item.makhachhang ||
                (
                    typeof formatMaKhachHang ===
                    'function'
                        ? formatMaKhachHang(
                            item.id
                        )
                        : 'KH' +
                          item.id
                );


            const tenHienThi =
                item.hovaten ||
                item.ten ||
                'Chưa có tên';


            const sdt =
                item.sodienthoai ||
                item.sdt ||
                '';


            const displaySdt =
                chuanHoaSoDienThoai(
                    sdt
                );


            const diaChi =
                item.diachi ||
                'Chưa có địa chỉ';


            /* =====================================================
               QR
            ===================================================== */

            const qrData =
                encodeURIComponent(
                    `KH_${item.id}_${tenHienThi}_${displaySdt}`
                );


            const qrImageUrl =
                `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${qrData}`;


            /* =====================================================
               THÚ CƯNG
            ===================================================== */

            const dsPet =
                info.pets;


            const soLuongPet =
                info.soPet;


            const tenPetText =
                soLuongPet
                    ? dsPet
                        .map(
                            p =>
                                p.tenthucung ||
                                p.ten ||
                                'Không tên'
                        )
                        .join(', ')
                    : 'Chưa có thú cưng';


            /* =====================================================
               LỊCH SỬ
            ===================================================== */

            const lanKhamText =
                formatNgay(
                    info.lich.lanKhamGanNhat
                );


            const tongChiTieuText =
                formatTien(
                    info.tongTien
                );


            /* =====================================================
               LOẠI KHÁCH
            ===================================================== */

            let loaiKhachHtml = '';


            if (info.loai === 'vip') {

                loaiKhachHtml = `

                    <span class="customer-type type-vip">

                        <i class="fa-solid fa-crown"></i>

                        VIP

                    </span>

                `;

            }
            else if (
                info.loai === 'normal'
            ) {

                loaiKhachHtml = `

                    <span class="customer-type type-normal">

                        <i class="fa-solid fa-user-check"></i>

                        Thường

                    </span>

                `;

            }
            else {

                loaiKhachHtml = `

                    <span class="customer-type type-new">

                        <i class="fa-solid fa-user-plus"></i>

                        Mới

                    </span>

                `;

            }


            /* =====================================================
               PHONE
            ===================================================== */

            const phoneHtml =
                displaySdt
                    ? `

                        <a href="tel:${escapeHtml(displaySdt)}">

                            <i class="fa-solid fa-phone"></i>

                            ${escapeHtml(displaySdt)}

                        </a>

                    `
                    : `

                        <span style="color:#94a3b8">

                            Chưa có SĐT

                        </span>

                    `;


            /* =====================================================
               CARD
            ===================================================== */

            return `

                <div
                    class="customer-card"
                    data-id="${item.id}"
                    data-type="${info.loai}"
                    data-has-pet="${soLuongPet > 0 ? 'yes' : 'no'}"
                >

                    <!-- CARD TOP -->

                    <div class="customer-card-top">

                        <div class="customer-avatar">

                            ${escapeHtml(
                                layChuAvatar(
                                    tenHienThi
                                )
                            )}

                        </div>


                        <div class="customer-card-title">

                            <h3 class="customer-card-name"
                                title="${escapeHtml(tenHienThi)}">

                                ${escapeHtml(
                                    tenHienThi
                                )}

                            </h3>


                            <div class="customer-card-phone">

                                ${phoneHtml}

                            </div>


                            <span class="customer-code-mini">

                                ${escapeHtml(
                                    maKhachHang
                                )}

                            </span>

                        </div>


                        <img
                            class="customer-card-qr"
                            src="${qrImageUrl}"
                            alt="QR khách hàng"
                            title="Nhấn để xem QR"
                            onclick="moQR('${qrImageUrl}')"
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="customer-address-box">

                        <i class="fa-solid fa-location-dot"></i>

                        <div
                            class="customer-address-text"
                            title="${escapeHtml(diaChi)}"
                        >

                            ${escapeHtml(diaChi)}

                        </div>

                    </div>


                    <!-- PET -->

                    <div class="customer-pet-box">

                        <div class="pet-info-left">

                            <div class="pet-icon">

                                <i class="fa-solid fa-paw"></i>

                            </div>


                            <div>

                                <div class="pet-label">
                                    Thú cưng
                                </div>

                                <div class="pet-count-text">

                                    ${soLuongPet}
                                    thú cưng

                                </div>

                            </div>

                        </div>


                        <div
                            class="pet-names"
                            title="${escapeHtml(tenPetText)}"
                        >

                            ${escapeHtml(
                                tenPetText
                            )}

                        </div>

                    </div>


                    <!-- INFO -->

                    <div class="customer-info-grid">


                        <div class="customer-info-item">

                            <div class="customer-info-label">

                                Lần khám gần nhất

                            </div>

                            <div
                                class="customer-info-value"
                                title="${escapeHtml(lanKhamText)}"
                            >

                                ${escapeHtml(
                                    lanKhamText
                                )}

                            </div>

                        </div>


                        <div class="customer-info-item">

                            <div class="customer-info-label">

                                Tổng chi tiêu

                            </div>

                            <div
                                class="customer-info-value money"
                            >

                                ${escapeHtml(
                                    tongChiTieuText
                                )}

                            </div>

                        </div>


                        <div class="customer-info-item">

                            <div class="customer-info-label">

                                Điểm tích lũy

                            </div>

                            <div
                                class="customer-info-value points"
                            >

                                <i class="fa-solid fa-star"></i>

                                ${info.diem}
                                điểm

                            </div>

                        </div>


                        <div class="customer-info-item">

                            <div class="customer-info-label">

                                Số lần giao dịch

                            </div>

                            <div class="customer-info-value">

                                ${info.lich.soLan || 0}
                                lần

                            </div>

                        </div>


                    </div>


                    <!-- FOOTER -->

                    <div class="customer-card-footer">

                        ${loaiKhachHtml}


                        <div class="card-actions">


                            <button
                                class="card-action card-action-pet"
                                title="Quản lý thú cưng"
                                onclick="themThuCungChoKhach(${item.id})"
                            >

                                <i class="fa-solid fa-paw"></i>

                            </button>


                            <button
                                class="card-action card-action-edit"
                                title="Sửa khách hàng"
                                onclick="moModalSua(
                                    ${item.id},
                                    ${JSON.stringify(tenHienThi)},
                                    ${JSON.stringify(sdt)},
                                    ${JSON.stringify(diaChi)}
                                )"
                            >

                                <i class="fa-solid fa-pen"></i>

                            </button>


                            <button
                                class="card-action card-action-delete"
                                title="Xóa khách hàng"
                                onclick="xoaKhachHang(${item.id})"
                            >

                                <i class="fa-solid fa-trash"></i>

                            </button>

                        </div>

                    </div>

                </div>

            `;

        }


        /* =========================================================
           FOOTER
        ========================================================== */

        function capNhatFooter(total) {

            const countEl =
                document.getElementById(
                    'customerCount'
                );


            const resultEl =
                document.getElementById(
                    'customerResultCount'
                );


            if (countEl) {

                countEl.textContent =
                    `${total.toLocaleString('vi-VN')} khách hàng`;

            }


            if (resultEl) {

                resultEl.innerHTML =
                    `Hiển thị <strong>${total.toLocaleString('vi-VN')}</strong> khách hàng`;

            }


            taoPhanTrang(total);

        }


        /* =========================================================
           PHÂN TRANG
        ========================================================== */

        function taoPhanTrang(total) {

            const pagination =
                document.getElementById(
                    'customerPagination'
                );


            if (!pagination) {
                return;
            }


            pagination.innerHTML = '';


            /*
             * Hiện tại giao diện tải toàn bộ dữ liệu.
             * Phân trang để dành cho phiên bản dữ liệu lớn.
             */

            if (total <= 0) {
                return;
            }


            pagination.innerHTML = `

                <button
                    class="customer-page-btn active"
                    type="button"
                >
                    1
                </button>

            `;

        }


        /* =========================================================
           TÌM KIẾM
        ========================================================== */

        function timKiemKhachHang() {

            const input =
                document.getElementById(
                    'searchInput'
                );


            const tuKhoa =
                (
                    input?.value || ''
                )
                    .toLowerCase()
                    .trim();


            locVaHienThi(
                tuKhoa,
                boLocHienTai
            );

        }


        /* =========================================================
           BỘ LỌC
        ========================================================== */

        function doiBoLoc(
            filter,
            button
        ) {

            boLocHienTai =
                filter;


            document
                .querySelectorAll(
                    '.filter-btn'
                )
                .forEach(btn => {

                    btn.classList.remove(
                        'active'
                    );

                });


            if (button) {

                button.classList.add(
                    'active'
                );

            }


            timKiemKhachHang();

        }


        /* =========================================================
           LỌC + HIỂN THỊ
        ========================================================== */

        function locVaHienThi(
            tuKhoa,
            filter
        ) {

            let ketQua =
                danhSachKhachHangGoc.filter(
                    item => {

                        /* =============================
                           SEARCH
                        ============================== */

                        const ten =
                            String(
                                item.hovaten ||
                                item.ten ||
                                ''
                            )
                                .toLowerCase();


                        const sdt =
                            String(
                                item.sodienthoai ||
                                item.sdt ||
                                ''
                            )
                                .toLowerCase();


                        const ma =
                            String(
                                item.makhachhang ||
                                (
                                    typeof formatMaKhachHang ===
                                    'function'
                                        ? formatMaKhachHang(
                                            item.id
                                        )
                                        : 'KH' +
                                          item.id
                                )
                            )
                                .toLowerCase();


                        const petNames =
                            (
                                mapThuCung[
                                    item.id
                                ] || []
                            )
                                .map(
                                    p =>
                                        p.tenthucung ||
                                        p.ten ||
                                        ''
                                )
                                .join(' ')
                                .toLowerCase();


                        const matchSearch =
                            !tuKhoa ||
                            ten.includes(
                                tuKhoa
                            ) ||
                            sdt.includes(
                                tuKhoa
                            ) ||
                            ma.includes(
                                tuKhoa
                            ) ||
                            petNames.includes(
                                tuKhoa
                            );


                        if (!matchSearch) {
                            return false;
                        }


                        /* =============================
                           FILTER
                        ============================== */

                        const info =
                            layThongTinKhachHang(
                                item
                            );


                        if (
                            filter === 'pet'
                        ) {

                            return (
                                info.soPet >
                                0
                            );

                        }


                        if (
                            filter === 'nopet'
                        ) {

                            return (
                                info.soPet ===
                                0
                            );

                        }


                        if (
                            filter === 'vip'
                        ) {

                            return (
                                info.loai ===
                                'vip'
                            );

                        }


                        return true;

                    }
                );


            hienThiBang(
                ketQua
            );

        }


        /* =========================================================
           MỞ QR
        ========================================================== */

        function moQR(url) {

            window.open(
                url,
                '_blank'
            );

        }


        /* =========================================================
           THÚ CƯNG
        ========================================================== */

        function themThuCungChoKhach(
            makhachhang
        ) {

            window.location.href =
                `thucung.html?makhachhang=${encodeURIComponent(
                    makhachhang
                )}`;

        }


        /* =========================================================
           MODAL THÊM
        ========================================================== */

        function moModalThem() {

            document.getElementById(
                'editingId'
            ).value = '';


            document.getElementById(
                'hovaten'
            ).value = '';


            document.getElementById(
                'sodienthoai'
            ).value = '';


            document.getElementById(
                'diachi'
            ).value = '';


            document.getElementById(
                'modalTitle'
            ).innerText =
                'Thêm khách hàng mới';


            document.getElementById(
                'customerModal'
            ).style.display =
                'flex';


            setTimeout(() => {

                document.getElementById(
                    'hovaten'
                )?.focus();

            }, 100);

        }


        /* =========================================================
           MODAL SỬA
        ========================================================== */

        function moModalSua(
            id,
            hovaten,
            sodienthoai,
            diachi
        ) {

            document.getElementById(
                'editingId'
            ).value =
                id;


            document.getElementById(
                'hovaten'
            ).value =
                hovaten || '';


            document.getElementById(
                'sodienthoai'
            ).value =
                sodienthoai || '';


            document.getElementById(
                'diachi'
            ).value =
                diachi || '';


            document.getElementById(
                'modalTitle'
            ).innerText =
                'Cập nhật thông tin khách hàng';


            document.getElementById(
                'customerModal'
            ).style.display =
                'flex';


            setTimeout(() => {

                document.getElementById(
                    'hovaten'
                )?.focus();

            }, 100);

        }


        /* =========================================================
           ĐÓNG MODAL
        ========================================================== */

        function dongModal() {

            document.getElementById(
                'customerModal'
            ).style.display =
                'none';

        }


        /* =========================================================
           CLICK NGOÀI MODAL
        ========================================================== */

        document
            .getElementById(
                'customerModal'
            )
            .addEventListener(
                'click',
                function(e) {

                    if (
                        e.target === this
                    ) {

                        dongModal();

                    }

                }
            );


        /* =========================================================
           ESC ĐÓNG MODAL
        ========================================================== */

        document.addEventListener(
            'keydown',
            function(e) {

                if (
                    e.key === 'Escape'
                ) {

                    dongModal();

                }

            }
        );


        /* =========================================================
           LƯU KHÁCH HÀNG
        ========================================================== */

        async function luuKhachHang() {

            const id =
                document.getElementById(
                    'editingId'
                ).value;


            const hovaten =
                document.getElementById(
                    'hovaten'
                ).value.trim();


            const sodienthoai =
                document.getElementById(
                    'sodienthoai'
                ).value.trim();


            const diachi =
                document.getElementById(
                    'diachi'
                ).value.trim();


            if (!hovaten) {

                alert(
                    'Vui lòng nhập tên khách hàng!'
                );

                return;

            }


            const maphongkham =
                sessionStorage.getItem(
                    'maphongkham'
                ) || '';


            /* =====================================================
               THÊM
            ===================================================== */

            if (id === '') {

                const {
                    data,
                    error
                } = await db
                    .from('khachhang')
                    .insert([{

                        hovaten:
                            hovaten,

                        sodienthoai:
                            sodienthoai,

                        diachi:
                            diachi,

                        maphongkham:
                            maphongkham

                    }])
                    .select();


                if (error) {

                    alert(
                        'Lỗi thêm dữ liệu: ' +
                        error.message
                    );

                    return;

                }


                /* Tạo mã khách hàng */

                if (
                    data &&
                    data.length > 0
                ) {

                    const newId =
                        data[0].id;


                    let makhachhang =
                        'KH' +
                        newId;


                    if (
                        typeof formatMaKhachHang ===
                        'function'
                    ) {

                        makhachhang =
                            formatMaKhachHang(
                                newId
                            );

                    }


                    await db
                        .from('khachhang')
                        .update({

                            makhachhang:
                                makhachhang

                        })
                        .eq(
                            'id',
                            newId
                        );

                }


                alert(
                    'Thêm khách hàng thành công!'
                );


            }

            /* =====================================================
               SỬA
            ===================================================== */

            else {

                const {
                    error
                } = await db
                    .from('khachhang')
                    .update({

                        hovaten:
                            hovaten,

                        sodienthoai:
                            sodienthoai,

                        diachi:
                            diachi

                    })
                    .eq(
                        'id',
                        id
                    );


                if (error) {

                    alert(
                        'Lỗi cập nhật dữ liệu: ' +
                        error.message
                    );

                    return;

                }


                alert(
                    'Cập nhật thành công!'
                );

            }


            dongModal();


            await fetchKhachHang();

        }


        /* =========================================================
           XÓA KHÁCH HÀNG
        ========================================================== */

        async function xoaKhachHang(
            id
        ) {

            const khachHang =
                danhSachKhachHangGoc.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            const ten =
                khachHang?.hovaten ||
                khachHang?.ten ||
                'khách hàng';


            if (
                !confirm(
                    `Bạn có chắc chắn muốn xóa "${ten}" không?`
                )
            ) {

                return;

            }


            const {
                error
            } = await db
                .from('khachhang')
                .delete()
                .eq(
                    'id',
                    id
                );


            if (error) {

                alert(
                    'Lỗi khi xóa: ' +
                    error.message
                );

                return;

            }


            alert(
                'Xóa khách hàng thành công!'
            );


            await fetchKhachHang();

        }


        /* =========================================================
           KHỞI ĐỘNG
        ========================================================== */

        fetchKhachHang();

    </script>

</body>

</html>
