<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khách hàng - VetCare Pro</title>
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/smart-search.js"></script>
    <script src="../js/canhbao.js"></script>

    <!-- Gọi file CSS chung -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
    <link rel="stylesheet" href="../css/smart-search.css">

    <style>
        .search-box {
            padding: 8px 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .card-header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-add-pet {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .btn-add-pet:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <!-- THANH MENU -->
    <div id="menu-container"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="card">
                <div class="card-header">
                    <h3>Danh sách khách hàng</h3>
                    <div class="card-header-actions">
                        <input type="text" id="searchInput" class="search-box" placeholder="Tìm theo tên hoặc SĐT..." onkeyup="timKiemKhachHang()">
                        <button class="btn-primary" onclick="moModalThem()">+ Thêm khách hàng mới</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã KH</th>
                                <th>Mã QR</th>
                                <th>Khách hàng & SĐT</th>
                                <th>Địa chỉ</th>
                                <th>Thú cưng</th>
                                <th>Lần khám gần nhất</th>
                                <th>Tổng chi tiêu</th>
                                <th>Điểm tích lũy</th>
                                <th>Loại khách</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="data-table">
                            <!-- Dữ liệu được nạp tự động -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP FORM THÊM / SỬA KHÁCH HÀNG -->
    <div class="modal-overlay" id="customerModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm khách hàng mới</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            <input type="hidden" id="editingId">
            <div class="form-group-modal">
                <label>Họ và tên (*):</label>
                <input type="text" id="hovaten" placeholder="Nhập họ và tên...">
            </div>
            <div class="form-group-modal">
                <label>Số điện thoại:</label>
                <input type="text" id="sodienthoai" placeholder="Nhập số điện thoại...">
            </div>
            <div class="form-group-modal">
                <label>Địa chỉ:</label>
                <input type="text" id="diachi" placeholder="Nhập địa chỉ...">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuKhachHang()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <script>
        let danhSachKhachHangGoc = [];
        let mapThuCung = {};
        let mapLichSuKham = {};

        // Hiển thị số điện thoại trực tiếp (vẫn giữ tính năng bấm gọi)
        function hienThiSoDienThoai(sdt) {
            if (!sdt) return '---';
            let sdtStr = String(sdt).trim();
            let displaySdt = sdtStr.startsWith('0') ? sdtStr : '0' + sdtStr;
            return `<a href="tel:${displaySdt}" style="color: #2563eb; text-decoration: none; font-weight: bold;" title="Bấm để gọi">${displaySdt} 📞</a>`;
        }

        async function fetchKhachHang() {
            const { data: tcData } = await db.from('thucung').select('*');
            let petToKhach = {};
            if (tcData) {
                tcData.forEach(tc => {
                    let maKH = tc.makhachhang || tc.makh || tc.khachhang_id || tc.id_khachhang;
                    if (!mapThuCung[maKH]) mapThuCung[maKH] = [];
                    mapThuCung[maKH].push(tc);
                    petToKhach[tc.id] = maKH;
                });
            }

            let giaVaccineMap = {};
            const { data: khoVcData } = await db.from('khovaccine').select('*');
            if (khoVcData) {
                khoVcData.forEach(v => {
                    if (v.tenvaccine) {
                        giaVaccineMap[v.tenvaccine.trim().toLowerCase()] = parseFloat(v.giaban) || 0;
                    }
                });
            }

            let thongKeChiTieu = {};

            function congTienTheoPetHoacKH(row, soTienTruyXuat, ngayTruyXuat) {
                let maKH = row.makhachhang || row.makh || row.khachhang_id;
                
                if (!maKH && row.mathucung) {
                    maKH = petToKhach[row.mathucung];
                }
                if (!maKH && row.makhambenh && window.khamToPet && window.khamToPet[row.makhambenh]) {
                    let petId = window.khamToPet[row.makhambenh];
                    maKH = petToKhach[petId];
                }

                if (!maKH) return;

                if (!thongKeChiTieu[maKH]) {
                    thongKeChiTieu[maKH] = { tongTien: 0, lanKhamGanNhat: null, soLan: 0 };
                }

                let tien = parseFloat(soTienTruyXuat) || 0;
                thongKeChiTieu[maKH].tongTien += tien;
                if (tien > 0 || ngayTruyXuat) {
                    thongKeChiTieu[maKH].soLan += 1;
                }

                let ngay = ngayTruyXuat;
                if (ngay) {
                    if (!thongKeChiTieu[maKH].lanKhamGanNhat || new Date(ngay) > new Date(thongKeChiTieu[maKH].lanKhamGanNhat)) {
                        thongKeChiTieu[maKH].lanKhamGanNhat = ngay;
                    }
                }
            }

            window.khamToPet = {};
            const { data: kbData } = await db.from('khambenh').select('*');
            if (kbData) {
                kbData.forEach(kb => {
                    if (kb.mathucung) {
                        window.khamToPet[kb.id] = kb.mathucung;
                    }
                    let chiPhi = kb.tongchiphi || kb.thanhtien || kb.chiphi || 0;
                    congTienTheoPetHoacKH(kb, chiPhi, kb.ngaykham || kb.created_at);
                });
            }

            const { data: vcData } = await db.from('nhatkylamvaccine').select('*');
            if (vcData) {
                vcData.forEach(vc => {
                    let chiPhi = vc.giatien || vc.tongtien || vc.chiphi || vc.gia || 0;
                    if (chiPhi === 0 && vc.tenvaccine) {
                        let keyName = vc.tenvaccine.trim().toLowerCase();
                        chiPhi = giaVaccineMap[keyName] || 0;
                    }
                    let ngay = vc.ngaytiem || vc.created_at;
                    congTienTheoPetHoacKH(vc, chiPhi, ngay);
                });
            }

            const { data: dhData } = await db.from('donhang').select('*');
            if (dhData) {
                dhData.forEach(dh => {
                    let chiPhi = dh.tongtien || dh.total || dh.thanhtien || 0;
                    congTienTheoPetHoacKH(dh, chiPhi, dh.ngaytao || dh.created_at);
                });
            }

            const { data: ntData } = await db.from('nhatkynoitru').select('*');
            if (ntData) {
                ntData.forEach(nt => {
                    let chiPhi = nt.thanhtien || nt.tongchiphi || nt.chiphi || 0;
                    congTienTheoPetHoacKH(nt, chiPhi, nt.ngayvao || nt.created_at);
                });
            }

            const { data: dtData } = await db.from('hoadonthuoc').select('*');
            if (dtData) {
                dtData.forEach(dt => {
                    let chiPhi = dt.thanhtien || dt.tongtien || dt.Gia || 0;
                    congTienTheoPetHoacKH(dt, chiPhi, dt.created_at);
                });
            }

            const { data: pcdData } = await db.from('phieuchidinh').select('*');
            if (pcdData) {
                pcdData.forEach(pcd => {
                    let chiPhi = pcd.thanhtien || pcd.tongtien || 0;
                    let ngay = pcd.ngaychidinh || pcd.created_at;
                    congTienTheoPetHoacKH(pcd, chiPhi, ngay);
                });
            }

            const { data: spaData } = await db.from('nhatkyspa').select('*');
            if (spaData) {
                spaData.forEach(sp => {
                    let chiPhi = sp.tongtien || sp.giatien || 0;
                    congTienTheoPetHoacKH(sp, chiPhi, sp.created_at);
                });
            }

            mapLichSuKham = thongKeChiTieu;

            const { data, error } = await db.from('khachhang').select('*').order('id', { ascending: true });
            if (error) {
                console.error('Lỗi tải dữ liệu:', error);
            } else {
                danhSachKhachHangGoc = data || [];
                hienThiBang(danhSachKhachHangGoc);
            }
        }

        function hienThiBang(data) {
            const tableBody = document.getElementById('data-table');
            tableBody.innerHTML = '';
            
            if(data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:#777;">Không tìm thấy khách hàng phù hợp</td></tr>`;
                return;
            }

            data.forEach(item => {
                const maKhachHang = formatMaKhachHang(item.id);
                
                const tenHienThi = item.hovaten || item.ten || '';
                const sdt = item.sodienthoai || item.sdt || '';

                const soDienThoaiHtml = hienThiSoDienThoai(sdt);

                let rawSdt = String(sdt).trim();
                let displaySdt = rawSdt ? (rawSdt.startsWith('0') ? rawSdt : '0' + rawSdt) : '';
                const qrText = encodeURIComponent(`KH_${item.id}_${tenHienThi}_${displaySdt}`);
                const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=${qrText}`;

                const dsPet = mapThuCung[item.id] || [];
                const soLuongPet = dsPet.length;
                const tenPetText = soLuongPet > 0 ? dsPet.map(p => p.tenthucung).join(', ') : 'Chưa có thú cưng';

                const lichSu = mapLichSuKham[item.id] || { tongTien: 0, lanKhamGanNhat: null, soLan: 0 };
                const tongChiTieuText = Number(lichSu.tongTien).toLocaleString('vi-VN') + ' đ';
                const lanKhamText = lichSu.lanKhamGanNhat ? new Date(lichSu.lanKhamGanNhat).toLocaleDateString('vi-VN') : '---';

                const diemTichLuy = Math.floor(lichSu.tongTien / 100000);

                let loaiKhachHtml = `<span style="padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #e0f2fe; color: #0369a1; font-weight: 500;">Mới</span>`;
                if (lichSu.soLan > 0) {
                    if (lichSu.tongTien >= 5000000) {
                        loaiKhachHtml = `<span style="padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #fef3c7; color: #d97706; font-weight: bold;">VIP 👑</span>`;
                    } else {
                        loaiKhachHtml = `<span style="padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #dcfce7; color: #15803d; font-weight: 500;">Thường</span>`;
                    }
                }

                tableBody.innerHTML += `<tr>
                    <td><strong>${maKhachHang}</strong></td>
                    <td style="text-align: center;">
                        <img src="${qrImageUrl}" alt="Mã QR KH" style="width: 55px; height: 55px; border: 1px solid #cbd5e1; padding: 2px; border-radius: 4px; background: #fff;" title="Mã QR khách hàng #${item.id}">
                    </td>
                    <td>
                        <b>${tenHienThi}</b><br>
                        <span style="font-size: 12px;">${soDienThoaiHtml}</span>
                    </td>
                    <td>${item.diachi || '---'}</td>
                    <td><span style="color: #0284c7; font-weight: 600;">${soLuongPet} thú cưng</span><br><span style="font-size: 11px; color: #555;">(${tenPetText})</span></td>
                    <td style="font-size: 12px;">${lanKhamText}</td>
                    <td><b>${tongChiTieuText}</b></td>
                    <td><b style="color: #059669;">${diemTichLuy} điểm</b></td>
                    <td>${loaiKhachHtml}</td>
                    <td style="white-space: nowrap;">
                        <button class="btn-add-pet" onclick="themThuCungChoKhach(${item.id})" title="Thêm thú cưng">+ Thú cưng</button>
                        <button class="btn-edit" onclick="moModalSua(${item.id}, '${tenHienThi.replace(/'/g, "\\'")}', '${sdt}', '${item.diachi || ''}')">Sửa</button>
                        <button class="btn-delete" onclick="xoaKhachHang(${item.id})">Xóa</button>
                    </td>
                </tr>`;
            });
        }

        function themThuCungChoKhach(makhachhang) {
            window.location.href = `thucung.html?makhachhang=${makhachhang}`;
        }

        function timKiemKhachHang() {
            const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
            const ketQuaLoc = danhSachKhachHangGoc.filter(item => {
                const ten = (item.hovaten || item.ten || '').toLowerCase();
                const sdt = (item.sodienthoai || item.sdt || '').toLowerCase();
                const ma = formatMaKhachHang(item.id).toLowerCase();
                return ten.includes(tuKhoa) || sdt.includes(tuKhoa) || ma.includes(tuKhoa);
            });
            hienThiBang(ketQuaLoc);
        }

        function moModalThem() {
            document.getElementById('editingId').value = '';
            document.getElementById('hovaten').value = '';
            document.getElementById('sodienthoai').value = '';
            document.getElementById('diachi').value = '';
            document.getElementById('modalTitle').innerText = 'Thêm khách hàng mới';
            document.getElementById('customerModal').style.display = 'flex';
        }

        function moModalSua(id, hovaten, sodienthoai, diachi) {
            document.getElementById('editingId').value = id;
            document.getElementById('hovaten').value = hovaten;
            document.getElementById('sodienthoai').value = sodienthoai;
            document.getElementById('diachi').value = diachi;
            document.getElementById('modalTitle').innerText = 'Cập nhật thông tin khách hàng (ID: ' + id + ')';
            document.getElementById('customerModal').style.display = 'flex';
        }

        function dongModal() {
            document.getElementById('customerModal').style.display = 'none';
        }

        async function luuKhachHang() {
            const id = document.getElementById('editingId').value;
            const hovaten = document.getElementById('hovaten').value.trim();
            const sodienthoai = document.getElementById('sodienthoai').value.trim();
            const diachi = document.getElementById('diachi').value.trim();

            if (!hovaten) {
                alert('Vui lòng nhập tên khách hàng!');
                return;
            }

            // Lấy mã phòng khám hiện tại từ sessionStorage
            const maphongkham = sessionStorage.getItem('maphongkham') || '';

            if (id === "") {
                // Tự sinh mã khách hàng bằng hàm có sẵn trong utils.js
                const makhachhang = formatMaKhachHang();

                // Lưu trực tiếp makhachhang vào cột makhachhang
                const { error } = await db.from('khachhang').insert([{ 
                    makhachhang: makhachhang,
                    hovaten: hovaten, 
                    sodienthoai: sodienthoai, 
                    diachi: diachi, 
                    maphongkham: maphongkham 
                }]);
                
                if (error) {
                    alert('Lỗi thêm dữ liệu: ' + error.message);
                } else {
                    alert('Thêm khách hàng thành công!');
                    dongModal();
                    fetchKhachHang();
                }
            } else {
                // Cập nhật thông tin khách hàng (giữ nguyên mã cũ)
                const { error } = await db.from('khachhang').update({ 
                    hovaten: hovaten, 
                    sodienthoai: sodienthoai, 
                    diachi: diachi 
                }).eq('id', id);
                
                if (error) {
                    alert('Lỗi cập nhật dữ liệu: ' + error.message);
                } else {
                    alert('Cập nhật thành công!');
                    dongModal();
                    fetchKhachHang();
                }
            }
        }

        async function xoaKhachHang(id) {
            if (confirm('Bạn có chắc chắn muốn xóa khách hàng ID: ' + id + ' này không?')) {
                const { error } = await db.from('khachhang').delete().eq('id', id);
                if (error) {
                    alert('Lỗi khi xóa: ' + error.message);
                } else {
                    alert('Xóa thành công!');
                    fetchKhachHang();
                }
            }
        }

        fetchKhachHang();
    </script>
</body>
</html>
