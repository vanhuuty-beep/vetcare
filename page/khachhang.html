<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khách hàng - VetCare Pro</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- VetCare -->
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/smart-search.js"></script>
    <script src="../js/canhbao.js"></script>

    <!-- CSS chung -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
    <link rel="stylesheet" href="../css/smart-search.css">

    <style>

        /* =========================================================
           VETCARE PRO - KHÁCH HÀNG CARD UI
        ========================================================= */

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;

            --text: #172033;
            --text2: #475569;
            --muted: #94a3b8;

            --bg: #f4f7fb;
            --white: #ffffff;
            --border: #e5eaf1;

            --green: #059669;
            --green-bg: #ecfdf5;

            --orange: #d97706;
            --orange-bg: #fff7ed;

            --red: #dc2626;
            --red-bg: #fef2f2;

            --purple: #7c3aed;
            --purple-bg: #f5f3ff;

            --cyan: #0891b2;
            --cyan-bg: #ecfeff;

            --shadow:
                0 8px 30px rgba(15, 23, 42, .055);

            --shadow-hover:
                0 14px 35px rgba(37, 99, 235, .13);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        /* =========================================================
           CONTENT
        ========================================================= */

        .content-body {
            background: var(--bg) !important;
            padding: 18px !important;
            min-height: calc(100vh - 60px);
        }

        .customer-page {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .customer-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;

            padding: 18px 20px;

            box-shadow: var(--shadow);

            margin-bottom: 14px;
        }

        .customer-heading {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .customer-heading-icon {
            width: 46px;
            height: 46px;

            flex: 0 0 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            color: var(--primary);

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe
                );

            font-size: 19px;
        }

        .customer-heading h2 {
            margin: 0;

            font-size: 19px;
            font-weight: 800;

            color: var(--text);
        }

        .customer-heading p {
            margin: 4px 0 0;

            color: var(--muted);

            font-size: 11px;
        }

        /* =========================================================
           HEADER ACTION
        ========================================================= */

        .customer-header-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .customer-search {
            position: relative;
        }

        .customer-search i {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 13px;
        }

        .customer-search input {
            width: 285px;
            height: 42px;

            padding:
                0 14px 0 38px;

            border:
                1px solid #dce3ed;

            border-radius: 10px;

            background: #f9fafc;

            outline: none;

            color: var(--text);

            font-size: 12px;

            transition: .2s;
        }

        .customer-search input::placeholder {
            color: #a0aec0;
        }

        .customer-search input:focus {
            background: #fff;

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, .08);
        }

        .customer-add {
            height: 42px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 0 16px;

            border: 0;
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            color: #fff;

            font-size: 11px;
            font-weight: 750;

            cursor: pointer;

            box-shadow:
                0 6px 16px rgba(37, 99, 235, .22);

            transition: .2s;
        }

        .customer-add:hover {
            transform: translateY(-1px);

            box-shadow:
                0 9px 20px rgba(37, 99, 235, .28);
        }

        /* =========================================================
           STATISTICS
        ========================================================= */

        .customer-stats {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 12px;

            margin-bottom: 14px;
        }

        .customer-stat {
            display: flex;
            align-items: center;

            gap: 12px;

            min-height: 76px;

            padding: 12px 14px;

            background: var(--white);

            border:
                1px solid var(--border);

            border-radius: 13px;

            box-shadow: var(--shadow);
        }

        .customer-stat-icon {
            width: 38px;
            height: 38px;

            flex: 0 0 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            color: var(--primary);

            background: var(--primary-light);

            font-size: 16px;
        }

        .customer-stat:nth-child(2)
        .customer-stat-icon {
            color: #0891b2;
            background: #ecfeff;
        }

        .customer-stat:nth-child(3)
        .customer-stat-icon {
            color: #059669;
            background: #ecfdf5;
        }

        .customer-stat:nth-child(4)
        .customer-stat-icon {
            color: #d97706;
            background: #fff7ed;
        }

        .customer-stat-number {
            color: var(--text);

            font-size: 18px;
            font-weight: 800;

            line-height: 1.1;
        }

        .customer-stat-label {
            margin-top: 4px;

            color: var(--muted);

            font-size: 10px;
        }

        /* =========================================================
           FILTER
        ========================================================= */

        .customer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 14px;

            background: transparent;
        }

        .customer-filter {
            display: flex;
            align-items: center;

            gap: 7px;

            flex-wrap: wrap;
        }

        .filter-btn {
            height: 34px;

            padding: 0 13px;

            border:
                1px solid #e1e7ef;

            border-radius: 9px;

            background: #fff;

            color: #64748b;

            font-size: 10px;
            font-weight: 700;

            cursor: pointer;

            transition: .18s;
        }

        .filter-btn:hover {
            border-color: #bfdbfe;

            color: var(--primary);

            background: #f8fbff;
        }

        .filter-btn.active {
            color: #fff;

            border-color: var(--primary);

            background: var(--primary);

            box-shadow:
                0 5px 13px rgba(37, 99, 235, .18);
        }

        .customer-result-count {
            color: #64748b;

            font-size: 10px;
        }

        .customer-result-count strong {
            color: var(--text);
        }

        /* =========================================================
           CUSTOMER GRID
        ========================================================= */

        .customer-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 14px;

            align-items: stretch;
        }

        /* =========================================================
           CUSTOMER CARD
        ========================================================= */

        .customer-card {
            position: relative;

            display: flex;
            flex-direction: column;

            min-width: 0;

            background: #fff;

            border:
                1px solid var(--border);

            border-radius: 15px;

            padding: 15px;

            box-shadow: var(--shadow);

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                border-color .18s ease;

            overflow: hidden;
        }

        .customer-card:hover {
            transform: translateY(-3px);

            border-color: #d6e3f7;

            box-shadow: var(--shadow-hover);
        }

        .customer-card-top {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 13px;
        }

        /* =========================================================
           AVATAR
        ========================================================= */

        .customer-avatar {
            width: 45px;
            height: 45px;

            flex: 0 0 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            font-size: 17px;
            font-weight: 800;

            text-transform: uppercase;

            box-shadow:
                0 6px 14px rgba(37, 99, 235, .2);
        }

        .customer-card:nth-child(3n)
        .customer-avatar {
            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #0891b2
                );
        }

        .customer-card:nth-child(4n)
        .customer-avatar {
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #7c3aed
                );
        }

        .customer-card:nth-child(5n)
        .customer-avatar {
            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #059669
                );
        }

        .customer-card-title {
            flex: 1;

            min-width: 0;
        }

        .customer-card-name {
            margin: 0;

            color: var(--text);

            font-size: 14px;
            font-weight: 800;

            line-height: 1.25;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .customer-card-phone {
            margin-top: 5px;

            font-size: 10px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .customer-card-phone a {
            color: var(--primary);

            text-decoration: none;

            font-weight: 700;
        }

        .customer-card-phone a:hover {
            text-decoration: underline;
        }

        .customer-code-mini {
            display: inline-flex;

            padding: 4px 6px;

            margin-top: 5px;

            border-radius: 5px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 8px;
            font-weight: 700;
        }

        /* =========================================================
           QR
        ========================================================= */

        .customer-card-qr {
            position: relative;

            width: 50px;
            height: 50px;

            flex: 0 0 50px;

            border:
                1px solid #e2e8f0;

            border-radius: 8px;

            padding: 2px;

            background: #fff;

            cursor: pointer;

            transition: .18s;
        }

        .customer-card-qr:hover {
            transform: scale(1.04);

            border-color: #bfdbfe;
        }

        /* =========================================================
           ADDRESS
        ========================================================= */

        .customer-address-box {
            display: flex;
            align-items: flex-start;

            gap: 7px;

            min-height: 35px;

            padding: 8px 9px;

            border-radius: 8px;

            background: #f8fafc;

            margin-bottom: 12px;
        }

        .customer-address-box i {
            margin-top: 2px;

            color: #94a3b8;

            font-size: 10px;
        }

        .customer-address-text {
            color: #64748b;

            font-size: 9px;

            line-height: 1.4;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        /* =========================================================
           PET
        ========================================================= */

        .customer-pet-box {
            display: flex;
            align-items: center;

            justify-content: space-between;

            gap: 8px;

            margin-bottom: 12px;

            padding-bottom: 11px;

            border-bottom:
                1px solid #edf1f5;
        }

        .pet-info-left {
            display: flex;
            align-items: center;

            gap: 8px;

            min-width: 0;
        }

        .pet-icon {
            width: 32px;
            height: 32px;

            flex: 0 0 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            color: #0891b2;

            background: #ecfeff;

            font-size: 13px;
        }

        .pet-label {
            color: #94a3b8;

            font-size: 8px;

            margin-bottom: 2px;
        }

        .pet-count-text {
            color: var(--text);

            font-size: 10px;

            font-weight: 750;
        }

        .pet-names {
            max-width: 125px;

            color: #94a3b8;

            font-size: 8px;

            text-align: right;

            line-height: 1.35;

            overflow: hidden;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* =========================================================
           CUSTOMER INFO
        ========================================================= */

        .customer-info-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 8px;

            margin-bottom: 12px;
        }

        .customer-info-item {
            padding: 9px;

            border-radius: 9px;

            background: #fafbfc;

            border:
                1px solid #eef1f5;
        }

        .customer-info-label {
            color: #94a3b8;

            font-size: 8px;

            margin-bottom: 4px;
        }

        .customer-info-value {
            color: var(--text);

            font-size: 10px;

            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .customer-info-value.money {
            color: #0f172a;
        }

        .customer-info-value.points {
            color: var(--green);
        }

        /* =========================================================
           CARD FOOTER
        ========================================================= */

        .customer-card-footer {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 8px;

            margin-top: auto;

            padding-top: 11px;

            border-top:
                1px solid #edf1f5;
        }

        .customer-type {
            display: inline-flex;

            align-items: center;

            gap: 4px;

            height: 25px;

            padding: 0 8px;

            border-radius: 7px;

            font-size: 8px;
            font-weight: 800;
        }

        .type-new {
            color: #0369a1;
            background: #e0f2fe;
        }

        .type-normal {
            color: #15803d;
            background: #dcfce7;
        }

        .type-vip {
            color: #b45309;
            background: #fef3c7;
        }

        .card-actions {
            display: flex;

            gap: 4px;
        }

        .card-action {
            width: 29px;
            height: 27px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            border-radius: 7px;

            cursor: pointer;

            font-size: 10px;

            transition: .15s;
        }

        .card-action:hover {
            transform: translateY(-1px);
        }

        .card-action-pet {
            color: #047857;
            background: #d1fae5;
        }

        .card-action-edit {
            color: #b45309;
            background: #ffedd5;
        }

        .card-action-delete {
            color: #b91c1c;
            background: #fee2e2;
        }

        /* =========================================================
           EMPTY
        ========================================================= */

        .customer-empty {
            grid-column: 1 / -1;

            min-height: 280px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background: #fff;

            border:
                1px dashed #dbe3ee;

            border-radius: 15px;

            color: #94a3b8;

            text-align: center;
        }

        .customer-empty i {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 12px;

            border-radius: 16px;

            color: #94a3b8;

            background: #f1f5f9;

            font-size: 23px;
        }

        .customer-empty strong {
            color: #64748b;

            font-size: 13px;
        }

        .customer-empty span {
            margin-top: 5px;

            font-size: 10px;
        }

        /* =========================================================
           PAGINATION
        ========================================================= */

        .customer-footer {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding: 14px 2px 2px;

            color: #94a3b8;

            font-size: 10px;
        }

        .customer-pagination {
            display: flex;

            align-items: center;

            gap: 4px;
        }

        .customer-page-btn {
            min-width: 29px;
            height: 29px;

            padding: 0 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid #e1e7ef;

            border-radius: 7px;

            color: #64748b;

            background: #fff;

            font-size: 9px;

            cursor: pointer;

            transition: .15s;
        }

        .customer-page-btn:hover {
            border-color: #bfdbfe;
            color: var(--primary);
        }

        .customer-page-btn.active {
            color: #fff;

            background: var(--primary);

            border-color: var(--primary);
        }

        /* =========================================================
           MODAL
        ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(15, 23, 42, .45);

            backdrop-filter: blur(3px);
        }

        .modal-container {
            width: 100%;

            max-width: 480px;

            background: #fff;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(15, 23, 42, .25);

            animation:
                modalShow .18s ease;
        }

        @keyframes modalShow {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 17px 18px;

            border-bottom:
                1px solid #edf1f5;
        }

        .modal-header h3 {
            margin: 0;

            color: var(--text);

            font-size: 16px;
            font-weight: 800;
        }

        .close-modal {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            border-radius: 8px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 20px;

            cursor: pointer;
        }

        .close-modal:hover {
            color: #dc2626;
            background: #fee2e2;
        }

        .modal-body {
            padding: 18px;
        }

        .form-group-modal {
            margin-bottom: 14px;
        }

        .form-group-modal label {
            display: block;

            margin-bottom: 6px;

            color: #475569;

            font-size: 11px;

            font-weight: 700;
        }

        .form-group-modal input {
            width: 100%;

            height: 42px;

            padding: 0 12px;

            border:
                1px solid #dce3ed;

            border-radius: 9px;

            background: #f9fafc;

            outline: none;

            color: #172033;

            font-size: 12px;

            transition: .18s;
        }

        .form-group-modal input:focus {
            background: #fff;

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, .08);
        }

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding: 14px 18px;

            border-top:
                1px solid #edf1f5;

            background: #fafbfc;
        }

        .btn-secondary,
        .btn-primary {
            height: 38px;

            padding: 0 15px;

            border: 0;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 750;

            cursor: pointer;
        }

        .btn-secondary {
            color: #64748b;

            background: #e2e8f0;
        }

        .btn-primary {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );
        }

        /* =========================================================
           LOADING
        ========================================================= */

        .customer-loading {
            grid-column: 1 / -1;

            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 260px;

            background: #fff;

            border-radius: 15px;

            color: #94a3b8;

            font-size: 11px;
        }

        .customer-loading i {
            margin-right: 8px;

            color: var(--primary);

            animation:
                spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1250px) {

            .customer-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }

        @media (max-width: 1050px) {

            .customer-stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .customer-top {
                flex-direction: column;

                align-items: stretch;
            }

            .customer-header-actions {
                width: 100%;
            }

            .customer-search {
                flex: 1;
            }

            .customer-search input {
                width: 100%;
            }

        }

        @media (max-width: 850px) {

            .customer-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 600px) {

            .content-body {
                padding: 9px !important;
            }

            .customer-top {
                padding: 14px;
            }

            .customer-heading h2 {
                font-size: 17px;
            }

            .customer-heading p {
                font-size: 9px;
            }

            .customer-header-actions {
                flex-direction: column;
            }

            .customer-search {
                width: 100%;
            }

            .customer-add {
                width: 100%;
            }

            .customer-stats {
                grid-template-columns: 1fr;
            }

            .customer-toolbar {
                align-items: flex-start;

                flex-direction: column;
            }

            .customer-filter {
                width: 100%;
            }

            .customer-grid {
                grid-template-columns: 1fr;
            }

            .customer-footer {
                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>

         MENU
    ========================================================== -->

    <!-- =========================================================

    ========================================================== -->

    <div class="main-content">

                <!-- =================================================

                ================================================== -->

                <div class="customer-top">

                    <div class="customer-stat">

                        <div class="customer-stat-icon">

                        </div>

                        <div>

                            <div
                                class="customer-stat-number"
                                id="statThuCung"
                            >
                                0
                            </div>

                            <div class="customer-stat-label">
                                Tổng thú cưng
                            </div>

                        </div>

                    </div>


                    <div class="customer-stat">

                        <div class="customer-stat-icon">

                        <div>

                <!-- =================================================

    <!-- =========================================================
         MODAL
    ========================================================== -->

    <div
        class="modal-overlay"
        id="customerModal"
    >

        <div class="modal-container">


            <div class="modal-header">

                <h3 id="modalTitle">
                    Thêm khách hàng mới
                </h3>

                </button>

            </div>


            <div class="modal-body">

                <input
                    type="hidden"
                    id="editingId"
                >


                <div class="form-group-modal">

                        Họ và tên *
                    </label>

                    <input
                        type="text"
                        id="hovaten"
                        placeholder="Nhập họ và tên..."
                    >

                <div class="form-group-modal">

                        Số điện thoại
                    </label>

                    <input
                        type="text"

                    >

                <div class="form-group-modal">

                    </label>

                        type="text"
                        id="diachi"

                    >
