<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khách hàng - VetCare Pro</title>

    <!-- Favicon logo phòng khám -->
    <link rel="icon" type="image/png" href="../logo/logo.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- VetCare -->
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/smart-search.js"></script>
    <script src="../js/canhbao.js"></script>

    <!-- CSS chung -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
    <link rel="stylesheet" href="../css/smart-search.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --text: #172033;
            --text2: #475569;
            --muted: #94a3b8;
            --bg: #f4f7fb;
            --white: #ffffff;
            --border: #e5eaf1;
            --green: #059669;
            --green-bg: #ecfdf5;
            --orange: #d97706;
            --orange-bg: #fff7ed;
            --red: #dc2626;
            --red-bg: #fef2f2;
            --purple: #7c3aed;
            --purple-bg: #f5f3ff;
            --cyan: #0891b2;
            --cyan-bg: #ecfeff;
            --shadow: 0 8px 30px rgba(15, 23, 42, .055);
            --shadow-hover: 0 14px 35px rgba(37, 99, 235, .13);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body { background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; }

        .content-body { background: var(--bg) !important; padding: 18px !important; min-height: calc(100vh - 60px); }
        .customer-page { width: 100%; max-width: 1600px; margin: 0 auto; }

        .customer-top {
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            background: var(--white); border: 1px solid var(--border); border-radius: 16px;
            padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px;
        }
        .customer-heading { display: flex; align-items: center; gap: 13px; min-width: 0; }
        .customer-heading-icon {
            width: 46px; height: 46px; flex: 0 0 46px; display: flex; align-items: center; justify-content: center;
            border-radius: 13px; color: var(--primary); background: linear-gradient(135deg, #eff6ff, #dbeafe); font-size: 19px;
        }
        .customer-heading h2 { margin: 0; font-size: 19px; font-weight: 800; color: var(--text); }
        .customer-heading p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

        .customer-header-actions { display: flex; align-items: center; gap: 9px; }
        .customer-search { position: relative; }
        .customer-search i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 13px; }
        .customer-search input {
            width: 285px; height: 42px; padding: 0 14px 0 38px; border: 1px solid #dce3ed; border-radius: 10px;
            background: #f9fafc; outline: none; color: var(--text); font-size: 12px; transition: .2s;
        }
        .customer-search input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .08); }

        .customer-add {
            height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 16px;
            border: 0; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff;
            font-size: 11px; font-weight: 750; cursor: pointer; box-shadow: 0 6px 16px rgba(37, 99, 235, .22); transition: .2s;
        }
        .customer-add:hover { transform: translateY(-1px); box-shadow: 0 9px 20px rgba(37, 99, 235, .28); }

        .customer-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
        .customer-stat { display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px 14px; background: var(--white); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow); }
        .customer-stat-icon { width: 38px; height: 38px; flex: 0 0 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--primary); background: var(--primary-light); font-size: 16px; }
        .customer-stat:nth-child(2) .customer-stat-icon { color: #0891b2; background: #ecfeff; }
        .customer-stat:nth-child(3) .customer-stat-icon { color: #059669; background: #ecfdf5; }
        .customer-stat:nth-child(4) .customer-stat-icon { color: #d97706; background: #fff7ed; }
        .customer-stat-number { color: var(--text); font-size: 18px; font-weight: 800; line-height: 1.1; }
        .customer-stat-label { margin-top: 4px; color: var(--muted); font-size: 10px; }

        .customer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 14px; }
        .customer-filter { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
        .filter-btn {
            height: 34px; padding: 0 13px; border: 1px solid #e1e7ef; border-radius: 9px; background: #fff;
            color: #64748b; font-size: 10px; font-weight: 700; cursor: pointer; transition: .18s;
        }
        .filter-btn:hover { border-color: #bfdbfe; color: var(--primary); background: #f8fbff; }
        .filter-btn.active { color: #fff; border-color: var(--primary); background: var(--primary); box-shadow: 0 5px 13px rgba(37, 99, 235, .18); }
        .customer-result-count { color: #64748b; font-size: 10px; }
        .customer-result-count strong { color: var(--text); }

        .customer-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: stretch; }

        .customer-card {
            position: relative; display: flex; flex-direction: column; min-width: 0; background: #fff;
            border: 1px solid var(--border); border-radius: 15px; padding: 15px; box-shadow: var(--shadow);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; overflow: hidden;
        }
        .customer-card:hover { transform: translateY(-3px); border-color: #d6e3f7; box-shadow: var(--shadow-hover); }
        .customer-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 13px; }

        .customer-avatar {
            width: 45px; height: 45px; flex: 0 0 45px; display: flex; align-items: center; justify-content: center;
            border-radius: 13px; color: #fff; background: linear-gradient(135deg, #3b82f6, #2563eb); font-size: 17px; font-weight: 800; text-transform: uppercase; box-shadow: 0 6px 14px rgba(37, 99, 235, .2);
        }
        .customer-card-title { flex: 1; min-width: 0; }
        .customer-card-name { margin: 0; color: var(--text); font-size: 14px; font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .customer-card-phone { margin-top: 5px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .customer-card-phone a { color: var(--primary); text-decoration: none; font-weight: 700; }
        .customer-code-mini { display: inline-flex; padding: 4px 6px; margin-top: 5px; border-radius: 5px; background: #f1f5f9; color: #64748b; font-size: 8px; font-weight: 700; }

        .customer-card-qr { width: 50px; height: 50px; flex: 0 0 50px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2px; background: #fff; cursor: pointer; transition: .18s; }
        .customer-card-qr:hover { transform: scale(1.04); border-color: #bfdbfe; }

        .customer-address-box { display: flex; align-items: flex-start; gap: 7px; min-height: 35px; padding: 8px 9px; border-radius: 8px; background: #f8fafc; margin-bottom: 12px; }
        .customer-address-box i { margin-top: 2px; color: #94a3b8; font-size: 10px; }
        .customer-address-text { color: #64748b; font-size: 9px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .customer-pet-box { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding-bottom: 11px; border-bottom: 1px solid #edf1f5; }
        .pet-info-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .pet-icon { width: 32px; height: 32px; flex: 0 0 32px; display: flex; align-items: center; justify-content: center; border-radius: 9px; color: #0891b2; background: #ecfeff; font-size: 13px; }
        .pet-label { color: #94a3b8; font-size: 8px; margin-bottom: 2px; }
        .pet-count-text { color: var(--text); font-size: 10px; font-weight: 750; }
        .pet-names { max-width: 125px; color: #94a3b8; font-size: 8px; text-align: right; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .customer-info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
        .customer-info-item { padding: 9px; border-radius: 9px; background: #fafbfc; border: 1px solid #eef1f5; }
        .customer-info-label { color: #94a3b8; font-size: 8px; margin-bottom: 4px; }
        .customer-info-value { color: var(--text); font-size: 10px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .customer-info-value.money { color: #0f172a; }
        .customer-info-value.points { color: var(--green); }

        .customer-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 11px; border-top: 1px solid #edf1f5; }
        .customer-type { display: inline-flex; align-items: center; gap: 4px; height: 25px; padding: 0 8px; border-radius: 7px; font-size: 8px; font-weight: 800; }
        .type-new { color: #0369a1; background: #e0f2fe; }
        .type-normal { color: #15803d; background: #dcfce7; }
        .type-vip { color: #b45309; background: #fef3c7; }

        .card-actions { display: flex; gap: 4px; }
        .card-action { width: 29px; height: 27px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 7px; cursor: pointer; font-size: 10px; transition: .15s; }
        .card-action:hover { transform: translateY(-1px); }
        .card-action-pet { color: #047857; background: #d1fae5; }
        .card-action-edit { color: #b45309; background: #ffedd5; }
        .card-action-delete { color: #b91c1c; background: #fee2e2; }

        .customer-empty { grid-column: 1 / -1; min-height: 280px; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #fff; border: 1px dashed #dbe3ee; border-radius: 15px; color: #94a3b8; text-align: center; }
        .customer-empty i { width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; border-radius: 16px; color: #94a3b8; background: #f1f5f9; font-size: 23px; }
        .customer-empty strong { color: #64748b; font-size: 13px; }
        .customer-empty span { margin-top: 5px; font-size: 10px; }

        .customer-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 2px 2px; color: #94a3b8; font-size: 10px; }
        .customer-pagination { display: flex; align-items: center; gap: 4px; }
        .customer-page-btn { min-width: 29px; height: 29px; padding: 0 8px; display: flex; align-items: center; justify-content: center; border: 1px solid #e1e7ef; border-radius: 7px; color: #64748b; background: #fff; font-size: 9px; cursor: pointer; transition: .15s; }
        .customer-page-btn:hover { border-color: #bfdbfe; color: var(--primary); }
        .customer-page-btn.active { color: #fff; background: var(--primary); border-color: var(--primary); }

        .modal-overlay { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(15, 23, 42, .45); backdrop-filter: blur(3px); }
        .modal-container { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 25px 70px rgba(15, 23, 42, .25); animation: modalShow .18s ease; }
        @keyframes modalShow { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 17px 18px; border-bottom: 1px solid #edf1f5; }
        .modal-header h3 { margin: 0; color: var(--text); font-size: 16px; font-weight: 800; }
        .close-modal { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: #f1f5f9; color: #64748b; font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: #dc2626; background: #fee2e2; }
        .modal-body { padding: 18px; }
        .form-group-modal { margin-bottom: 14px; }
        .form-group-modal label { display: block; margin-bottom: 6px; color: #475569; font-size: 11px; font-weight: 700; }
        .form-group-modal input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #dce3ed; border-radius: 9px; background: #f9fafc; outline: none; color: #172033; font-size: 12px; transition: .18s; }
        .form-group-modal input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .08); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid #edf1f5; background: #fafbfc; }
        .btn-secondary, .btn-primary { height: 38px; padding: 0 15px; border: 0; border-radius: 8px; font-size: 11px; font-weight: 750; cursor: pointer; }
        .btn-secondary { color: #64748b; background: #e2e8f0; }
        .btn-primary { color: #fff; background: linear-gradient(135deg, #3b82f6, #2563eb); }

        .customer-loading { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; min-height: 260px; background: #fff; border-radius: 15px; color: #94a3b8; font-size: 11px; }
        .customer-loading i { margin-right: 8px; color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1250px) { .customer-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 1050px) { .customer-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .customer-top { flex-direction: column; align-items: stretch; } }
        @media (max-width: 850px) { .customer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 600px) { .customer-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <div id="menu-container"></div>

    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="customer-page">
                <div class="customer-top">
                    <div class="customer-heading">
                        <div class="customer-heading-icon"><i class="fa-solid fa-users"></i></div>
                        <div>
                            <h2>Danh sách khách hàng</h2>
                            <p>Quản lý khách hàng, thú cưng và lịch sử giao dịch</p>
                        </div>
                    </div>
                    <div class="customer-header-actions">
                        <div class="customer-search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchInput" placeholder="Tìm tên, SĐT hoặc mã khách hàng..." oninput="timKiemKhachHang()">
                        </div>
                        <button class="customer-add" onclick="moModalThem()"><i class="fa-solid fa-plus"></i> Thêm khách hàng</button>
                    </div>
                </div>

                <div class="customer-stats">
                    <div class="customer-stat">
                        <div class="customer-stat-icon"><i class="fa-solid fa-users"></i></div>
                        <div>
                            <div class="customer-stat-number" id="statKhachHang">0</div>
                            <div class="customer-stat-label">Tổng khách hàng</div>
                        </div>
                    </div>
                    <div class="customer-stat">
                        <div class="customer-stat-icon"><i class="fa-solid fa-paw"></i></div>
                        <div>
                            <div class="customer-stat-number" id="statThuCung">0</div>
                            <div class="customer-stat-label">Tổng thú cưng</div>
                        </div>
                    </div>
                    <div class="customer-stat">
                        <div class="customer-stat-icon"><i class="fa-solid fa-wallet"></i></div>
                        <div>
                            <div class="customer-stat-number" id="statChiTieu">0 đ</div>
                            <div class="customer-stat-label">Tổng chi tiêu</div>
                        </div>
                    </div>
                    <div class="customer-stat">
                        <div class="customer-stat-icon"><i class="fa-solid fa-star"></i></div>
                        <div>
                            <div class="customer-stat-number" id="statDiem">0</div>
                            <div class="customer-stat-label">Điểm tích lũy</div>
                        </div>
                    </div>
                </div>

                <div class="customer-toolbar">
                    <div class="customer-filter">
                        <button class="filter-btn active" data-filter="all" onclick="doiBoLoc('all', this)"><i class="fa-solid fa-layer-group"></i> Tất cả</button>
                        <button class="filter-btn" data-filter="pet" onclick="doiBoLoc('pet', this)"><i class="fa-solid fa-paw"></i> Có thú cưng</button>
                        <button class="filter-btn" data-filter="nopet" onclick="doiBoLoc('nopet', this)"><i class="fa-solid fa-user"></i> Chưa có thú cưng</button>
                        <button class="filter-btn" data-filter="vip" onclick="doiBoLoc('vip', this)"><i class="fa-solid fa-crown"></i> VIP</button>
                    </div>
                    <div class="customer-result-count" id="customerResultCount">Hiển thị <strong>0</strong> khách hàng</div>
                </div>

                <div class="customer-grid" id="data-table">
                    <div class="customer-loading">
                        <i class="fa-solid fa-spinner"></i> Đang tải dữ liệu khách hàng...
                    </div>
                </div>

                <div class="customer-footer">
                    <div id="customerCount">0 khách hàng</div>
                    <div class="customer-pagination" id="customerPagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="customerModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm khách hàng mới</h3>
                <button class="close-modal" onclick="dongModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editingId">
                <div class="form-group-modal">
                    <label>Họ và tên *</label>
                    <input type="text" id="hovaten" placeholder="Nhập họ và tên...">
                </div>
                <div class="form-group-modal">
                    <label>Số điện thoại</label>
                    <input type="text" id="sodienthoai" placeholder="Nhập số điện thoại...">
                </div>
                <div class="form-group-modal">
                    <label>Địa chỉ</label>
                    <input type="text" id="diachi" placeholder="Nhập địa chỉ...">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuKhachHang()"><i class="fa-solid fa-floppy-disk"></i> Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <script>
        let danhSachKhachHangGoc = [];
        let mapThuCung = {};
        let mapLichSuKham = {};
        let boLocHienTai = 'all';

        function chuanHoaSoDienThoai(sdt) {
            if (!sdt) return '';
            let value = String(sdt).trim();
            if (!value) return '';
            if (value.startsWith('0')) return value;
            return '0' + value;
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function layChuAvatar(ten) {
            if (!ten) return '?';
            const words = String(ten).trim().split(/\s+/).filter(Boolean);
            if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
            return (words[0].charAt(0) + words[words.length - 1].charAt(0)).toUpperCase();
        }

        function formatNgay(ngay) {
            if (!ngay) return '---';
            const d = new Date(ngay);
            if (isNaN(d.getTime())) return '---';
            return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function formatTien(tien) {
            const value = Number(tien) || 0;
            return value.toLocaleString('vi-VN') + ' đ';
        }

        function layThongTinKhachHang(item) {
            const dsPet = mapThuCung[item.id] || [];
            const lich = mapLichSuKham[item.id] || { tongTien: 0, lanKhamGanNhat: null, soLan: 0 };
            const tongTien = Number(lich.tongTien) || 0;
            const diem = Math.floor(tongTien / 100000);
            let loai = 'new';
            if (lich.soLan > 0) {
                if (tongTien >= 5000000) loai = 'vip';
                else loai = 'normal';
            }
            return { pets: dsPet, soPet: dsPet.length, lich: lich, tongTien: tongTien, diem: diem, loai: loai };
        }

        async function fetchKhachHang() {
            const tableBody = document.getElementById('data-table');
            tableBody.innerHTML = `
                <div class="customer-loading">
                    <i class="fa-solid fa-spinner"></i> Đang tải dữ liệu khách hàng...
                </div>
            `;

            try {
                mapThuCung = {};
                mapLichSuKham = {};

                const { data: tcData, error: tcError } = await db.from('thucung').select('*');
                let petToKhach = {};
                if (!tcError && tcData) {
                    tcData.forEach(tc => {
                        const maKH = tc.makhachhang || tc.makh || tc.khachhang_id || tc.id_khachhang;
                        if (!maKH) return;
                        if (!mapThuCung[maKH]) mapThuCung[maKH] = [];
                        mapThuCung[maKH].push(tc);
                        if (tc.id) petToKhach[tc.id] = maKH;
                    });
                }

                let thongKeChiTieu = {};

                function congTien(row, soTien, ngay) {
                    let maKH = row.makhachhang || row.makh || row.khachhang_id || row.id_khachhang;
                    if (!maKH && row.mathucung) maKH = petToKhach[row.mathucung];
                    if (!maKH && row.makhambenh && window.khamToPet && window.khamToPet[row.makhambenh]) {
                        const petId = window.khamToPet[row.makhambenh];
                        maKH = petToKhach[petId];
                    }
                    if (!maKH) return;

                    if (!thongKeChiTieu[maKH]) {
                        thongKeChiTieu[maKH] = { tongTien: 0, lanKhamGanNhat: null, soLan: 0 };
                    }
                    const tien = parseFloat(soTien) || 0;
                    thongKeChiTieu[maKH].tongTien += tien;
                    if (tien > 0 || ngay) thongKeChiTieu[maKH].soLan += 1;
                    if (ngay) {
                        if (!thongKeChiTieu[maKH].lanKhamGanNhat || new Date(ngay) > new Date(thongKeChiTieu[maKH].lanKhamGanNhat)) {
                            thongKeChiTieu[maKH].lanKhamGanNhat = ngay;
                        }
                    }
                }

                window.khamToPet = {};
                const { data: kbData } = await db.from('khambenh').select('*');
                if (kbData) {
                    kbData.forEach(kb => {
                        if (kb.mathucung) window.khamToPet[kb.id] = kb.mathucung;
                        const chiPhi = kb.tongchiphi || kb.thanhtien || kb.chiphi || 0;
                        congTien(kb, chiPhi, kb.ngaykham || kb.created_at);
                    });
                }

                const { data: hddvData } = await db.from('hoadondichvu').select('*');
                if (hddvData) {
                    hddvData.forEach(hddv => {
                        let chiPhi = hddv.thanhtien || hddv.tongtien || ((parseFloat(hddv.soluong) || 1) * (parseFloat(hddv.gia) || 0));
                        congTien(hddv, chiPhi, hddv.created_at);
                    });
                }

                const { data: vcData } = await db.from('nhatkylamvaccine').select('*');
                if (vcData) {
                    vcData.forEach(vc => {
                        let chiPhi = vc.giatien || vc.tongtien || vc.chiphi || vc.gia || 0;
                        congTien(vc, chiPhi, vc.ngaytiem || vc.created_at);
                    });
                }

                const { data: dhData } = await db.from('donhang').select('*');
                if (dhData) {
                    dhData.forEach(dh => {
                        let chiPhi = dh.tongtien || dh.total || dh.thanhtien || 0;
                        congTien(dh, chiPhi, dh.ngaytao || dh.created_at);
                    });
                }

                const { data: ntData } = await db.from('nhatkynoitru').select('*');
                if (ntData) {
                    ntData.forEach(nt => {
                        let chiPhi = nt.thanhtien || nt.tongchiphi || nt.chiphi || 0;
                        congTien(nt, chiPhi, nt.ngayvao || nt.created_at);
                    });
                }

                const { data: dtData } = await db.from('hoadonthuoc').select('*');
                if (dtData) {
                    dtData.forEach(dt => {
                        let soLuong = parseFloat(dt.soluong) || 1;
                        let donGia = parseFloat(dt.gia) || parseFloat(dt.Gia) || 0;
                        let chiPhi = (soLuong * donGia) > 0 ? (soLuong * donGia) : (dt.thanhtien || dt.tongtien || 0);
                        congTien(dt, chiPhi, dt.created_at);
                    });
                }

                const { data: pcdData } = await db.from('phieuchidinh').select('*');
                if (pcdData) {
                    pcdData.forEach(pcd => {
                        let chiPhi = pcd.thanhtien || pcd.tongtien || 0;
                        congTien(pcd, chiPhi, pcd.ngaychidinh || pcd.created_at);
                    });
                }

                const { data: spaData } = await db.from('nhatkyspa').select('*');
                if (spaData) {
                    spaData.forEach(sp => {
                        let chiPhi = sp.tongtien || sp.giatien || 0;
                        congTien(sp, chiPhi, sp.created_at);
                    });
                }

                mapLichSuKham = thongKeChiTieu;

                const maphongkham = sessionStorage.getItem('maphongkham') || '';
                const cleanCurrentPK = maphongkham ? maphongkham.replace(/_/g, '').trim().toLowerCase() : '';

                const { data, error } = await db.from('khachhang').select('*').order('id', { ascending: true });
                if (error) {
                    hienThiLoi('Không thể tải dữ liệu khách hàng');
                    return;
                }

                const danhSachTatCa = data || [];
                if (cleanCurrentPK) {
                    danhSachKhachHangGoc = danhSachTatCa.filter(item => {
                        const dbPK = item.maphongkham ? item.maphongkham.toString().replace(/_/g, '').trim().toLowerCase() : '';
                        return dbPK === cleanCurrentPK;
                    });
                } else {
                    danhSachKhachHangGoc = [];
                }

                hienThiBang(danhSachKhachHangGoc);
            } catch (error) {
                hienThiLoi('Có lỗi xảy ra khi tải dữ liệu');
            }
        }

        function hienThiLoi(message) {
            document.getElementById('data-table').innerHTML = `
                <div class="customer-empty">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <strong>${escapeHtml(message)}</strong>
                    <span>Vui lòng kiểm tra kết nối hoặc thử tải lại trang.</span>
                </div>
            `;
        }

        function hienThiBang(data) {
            const grid = document.getElementById('data-table');
            const tongKhach = danhSachKhachHangGoc.length;
            let tongPet = 0, tongTienTatCa = 0, tongDiemTatCa = 0;

            danhSachKhachHangGoc.forEach(kh => {
                const info = layThongTinKhachHang(kh);
                tongPet += info.soPet;
                tongTienTatCa += info.tongTien;
                tongDiemTatCa += info.diem;
            });

            document.getElementById('statKhachHang').textContent = tongKhach.toLocaleString('vi-VN');
            document.getElementById('statThuCung').textContent = tongPet.toLocaleString('vi-VN');
            document.getElementById('statChiTieu').textContent = formatTien(tongTienTatCa);
            document.getElementById('statDiem').textContent = tongDiemTatCa.toLocaleString('vi-VN');

            grid.innerHTML = '';
            if (!data || !data.length) {
                grid.innerHTML = `
                    <div class="customer-empty">
                        <i class="fa-solid fa-user-slash"></i>
                        <strong>Không tìm thấy khách hàng</strong>
                        <span>Thử thay đổi từ khóa hoặc bộ lọc.</span>
                    </div>
                `;
                capNhatFooter(0);
                return;
            }

            data.forEach(item => {
                grid.innerHTML += taoCardKhachHang(item);
            });

            capNhatFooter(data.length);
        }

        function taoCardKhachHang(item) {
            const info = layThongTinKhachHang(item);
            const maKhachHang = item.makhachhang || (typeof formatMaKhachHang === 'function' ? formatMaKhachHang(item.id) : 'KH' + item.id);
            const tenHienThi = item.hovaten || item.ten || 'Chưa có tên';
            const sdt = item.sodienthoai || item.sdt || '';
            const displaySdt = chuanHoaSoDienThoai(sdt);
            const diaChi = item.diachi || 'Chưa có địa chỉ';

            const qrData = encodeURIComponent(`KH_${item.id}_${tenHienThi}_${displaySdt}`);
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${qrData}`;

            const dsPet = info.pets;
            const soLuongPet = info.soPet;
            const tenPetText = soLuongPet ? dsPet.map(p => p.tenthucung || p.ten || 'Không tên').join(', ') : 'Chưa có thú cưng';

            const lanKhamText = formatNgay(info.lich.lanKhamGanNhat);
            const tongChiTieuText = formatTien(info.tongTien);

            let loaiKhachHtml = '';
            if (info.loai === 'vip') {
                loaiKhachHtml = `<span class="customer-type type-vip"><i class="fa-solid fa-crown"></i> VIP</span>`;
            } else if (info.loai === 'normal') {
                loaiKhachHtml = `<span class="customer-type type-normal"><i class="fa-solid fa-user-check"></i> Thường</span>`;
            } else {
                loaiKhachHtml = `<span class="customer-type type-new"><i class="fa-solid fa-user-plus"></i> Mới</span>`;
            }

            const phoneHtml = displaySdt ? `<a href="tel:${escapeHtml(displaySdt)}"><i class="fa-solid fa-phone"></i> ${escapeHtml(displaySdt)}</a>` : `<span style="color:#94a3b8">Chưa có SĐT</span>`;

            return `
                <div class="customer-card" data-id="${item.id}" data-type="${info.loai}" data-has-pet="${soLuongPet > 0 ? 'yes' : 'no'}">
                    <div class="customer-card-top">
                        <div class="customer-avatar">${escapeHtml(layChuAvatar(tenHienThi))}</div>
                        <div class="customer-card-title">
                            <h3 class="customer-card-name" title="${escapeHtml(tenHienThi)}">${escapeHtml(tenHienThi)}</h3>
                            <div class="customer-card-phone">${phoneHtml}</div>
                            <span class="customer-code-mini">${escapeHtml(maKhachHang)}</span>
                        </div>
                        <img class="customer-card-qr" src="${qrImageUrl}" alt="QR khách hàng" title="Nhấn để xem QR" onclick="moQR('${qrImageUrl}')">
                    </div>
                    <div class="customer-address-box">
                        <i class="fa-solid fa-location-dot"></i>
                        <div class="customer-address-text" title="${escapeHtml(diaChi)}">${escapeHtml(diaChi)}</div>
                    </div>
                    <div class="customer-pet-box">
                        <div class="pet-info-left">
                            <div class="pet-icon"><i class="fa-solid fa-paw"></i></div>
                            <div>
                                <div class="pet-label">Thú cưng</div>
                                <div class="pet-count-text">${soLuongPet} thú cưng</div>
                            </div>
                        </div>
                        <div class="pet-names" title="${escapeHtml(tenPetText)}">${escapeHtml(tenPetText)}</div>
                    </div>
                    <div class="customer-info-grid">
                        <div class="customer-info-item">
                            <div class="customer-info-label">Lần khám gần nhất</div>
                            <div class="customer-info-value" title="${escapeHtml(lanKhamText)}">${escapeHtml(lanKhamText)}</div>
                        </div>
                        <div class="customer-info-item">
                            <div class="customer-info-label">Tổng chi tiêu</div>
                            <div class="customer-info-value money">${escapeHtml(tongChiTieuText)}</div>
                        </div>
                        <div class="customer-info-item">
                            <div class="customer-info-label">Điểm tích lũy</div>
                            <div class="customer-info-value points"><i class="fa-solid fa-star"></i> ${info.diem} điểm</div>
                        </div>
                        <div class="customer-info-item">
                            <div class="customer-info-label">Số lần giao dịch</div>
                            <div class="customer-info-value">${info.lich.soLan || 0} lần</div>
                        </div>
                    </div>
                    <div class="customer-card-footer">
                        ${loaiKhachHtml}
                        <div class="card-actions">
                            <button class="card-action card-action-pet" title="Quản lý thú cưng" onclick="themThuCungChoKhach(${item.id})"><i class="fa-solid fa-paw"></i></button>
                            <button class="card-action card-action-edit" title="Sửa khách hàng" onclick="moModalSua(${item.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="card-action card-action-delete" title="Xóa khách hàng" onclick="xoaKhachHang(${item.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        function capNhatFooter(total) {
            document.getElementById('customerCount').textContent = `${total.toLocaleString('vi-VN')} khách hàng`;
            document.getElementById('customerResultCount').innerHTML = `Hiển thị <strong>${total.toLocaleString('vi-VN')}</strong> khách hàng`;
            document.getElementById('customerPagination').innerHTML = total > 0 ? `<button class="customer-page-btn active" type="button">1</button>` : '';
        }

        function timKiemKhachHang() {
            const tuKhoa = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            locVaHienThi(tuKhoa, boLocHienTai);
        }

        function doiBoLoc(filter, button) {
            boLocHienTai = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (button) button.classList.add('active');
            timKiemKhachHang();
        }

        function locVaHienThi(tuKhoa, filter) {
            let ketQua = danhSachKhachHangGoc.filter(item => {
                const ten = String(item.hovaten || item.ten || '').toLowerCase();
                const sdt = String(item.sodienthoai || item.sdt || '').toLowerCase();
                const ma = String(item.makhachhang || (typeof formatMaKhachHang === 'function' ? formatMaKhachHang(item.id) : 'KH' + item.id)).toLowerCase();
                const petNames = (mapThuCung[item.id] || []).map(p => p.tenthucung || p.ten || '').join(' ').toLowerCase();

                const matchSearch = !tuKhoa || ten.includes(tuKhoa) || sdt.includes(tuKhoa) || ma.includes(tuKhoa) || petNames.includes(tuKhoa);
                if (!matchSearch) return false;

                const info = layThongTinKhachHang(item);
                if (filter === 'pet') return info.soPet > 0;
                if (filter === 'nopet') return info.soPet === 0;
                if (filter === 'vip') return info.loai === 'vip';
                return true;
            });
            hienThiBang(ketQua);
        }

        function moQR(url) { window.open(url, '_blank'); }
        function themThuCungChoKhach(makhachhang) { window.location.href = `thucung.html?makhachhang=${encodeURIComponent(makhachhang)}`; }

        function moModalThem() {
            document.getElementById('editingId').value = '';
            document.getElementById('hovaten').value = '';
            document.getElementById('sodienthoai').value = '';
            document.getElementById('diachi').value = '';
            document.getElementById('modalTitle').innerText = 'Thêm khách hàng mới';
            document.getElementById('customerModal').style.display = 'flex';
            setTimeout(() => document.getElementById('hovaten')?.focus(), 100);
        }

        function moModalSua(id) {
            const item = danhSachKhachHangGoc.find(x => String(x.id) === String(id));
            if (!item) return;

            document.getElementById('editingId').value = item.id;
            document.getElementById('hovaten').value = item.hovaten || item.ten || '';
            document.getElementById('sodienthoai').value = item.sodienthoai || item.sdt || '';
            document.getElementById('diachi').value = item.diachi || '';
            document.getElementById('modalTitle').innerText = 'Cập nhật thông tin khách hàng';
            document.getElementById('customerModal').style.display = 'flex';
            setTimeout(() => document.getElementById('hovaten')?.focus(), 100);
        }

        function dongModal() { document.getElementById('customerModal').style.display = 'none'; }

        document.getElementById('customerModal').addEventListener('click', function(e) {
            if (e.target === this) dongModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') dongModal();
        });

        async function luuKhachHang() {
            const id = document.getElementById('editingId').value;
            const hovaten = document.getElementById('hovaten').value.trim();
            const sodienthoai = document.getElementById('sodienthoai').value.trim();
            const diachi = document.getElementById('diachi').value.trim();

            if (!hovaten) {
                alert('Vui lòng nhập tên khách hàng!');
                return;
            }

            const maphongkham = sessionStorage.getItem('maphongkham') || '';

            if (id === '') {
                const { data, error } = await db.from('khachhang').insert([{ hovaten, sodienthoai, diachi, maphongkham }]).select();
                if (error) {
                    alert('Lỗi thêm dữ liệu: ' + error.message);
                    return;
                }
                if (data && data.length > 0) {
                    const newId = data[0].id;
                    let makhachhang = 'KH' + newId;
                    if (typeof formatMaKhachHang === 'function') makhachhang = formatMaKhachHang(newId);
                    await db.from('khachhang').update({ makhachhang }).eq('id', newId);
                }
                alert('Thêm khách hàng thành công!');
            } else {
                const { error } = await db.from('khachhang').update({ hovaten, sodienthoai, diachi }).eq('id', id);
                if (error) {
                    alert('Lỗi cập nhật dữ liệu: ' + error.message);
                    return;
                }
                alert('Cập nhật thành công!');
            }

            dongModal();
            await fetchKhachHang();
        }

        async function xoaKhachHang(id) {
            const khachHang = danhSachKhachHangGoc.find(item => String(item.id) === String(id));
            const ten = khachHang?.hovaten || khachHang?.ten || 'khách hàng';

            if (!confirm(`Bạn có chắc chắn muốn xóa "${ten}" không?`)) return;

            const { error } = await db.from('khachhang').delete().eq('id', id);
            if (error) {
                alert('Lỗi khi xóa: ' + error.message);
                return;
            }
            alert('Xóa khách hàng thành công!');
            await fetchKhachHang();
        }

        fetchKhachHang();
    </script>
</body>
</html>
