<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thông tin Phòng khám - VetCare Pro</title>
    
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/smart-search.js"></script>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Gọi file CSS chung hệ thống -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
    <link rel="stylesheet" href="../css/smart-search.css">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* Bố cục trang quản trị */
        .content-body {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-subtle);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        /* Tiêu đề form */
        .form-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .form-card-header .icon-wrapper {
            width: 50px;
            height: 50px;
            background: #eff6ff;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 22px;
        }

        .form-card h2 {
            margin: 0;
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
        }

        .form-card p {
            margin: 4px 0 0 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Nhóm form hiện đại */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group-full {
            grid-column: span 2;
        }

        .form-group-modal {
            margin-bottom: 22px;
        }

        .form-group-modal label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group-modal label i {
            margin-right: 6px;
            color: var(--primary-color);
        }

        .form-group-modal input, 
        .form-group-modal textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fff;
            color: var(--text-main);
        }

        .form-group-modal input:focus, 
        .form-group-modal textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-group-modal input[readonly] {
            background-color: #f1f5f9;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        /* Khu vực Logo Upload */
        .logo-upload-card {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: border-color 0.2s;
        }

        .logo-upload-card:hover {
            border-color: var(--primary-color);
        }

        .logo-preview {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            object-fit: cover;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo-upload-info {
            flex: 1;
        }

        .logo-upload-info input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .custom-file-upload:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .logo-hint {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Hành động nút bấm */
        .form-actions {
            margin-top: 35px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #f1f5f9;
            padding-top: 25px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Responsive cho thiết bị di động */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group-full {
                grid-column: span 1;
            }
            .form-card {
                padding: 20px;
            }
            .logo-upload-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- THANH MENU BÊN TRÁI -->
    <div id="menu-container"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="form-card">
                <div class="form-card-header">
                    <div class="icon-wrapper">
                        <i class="fa-solid fa-hospital"></i>
                    </div>
                    <div>
                        <h2>Cấu Hình Thông Tin Phòng Khám</h2>
                        <p>Quản lý thông tin chung và định danh cơ sở thú y của bạn</p>
                    </div>
                </div>
                
                <form id="formThongTinPK" onsubmit="capNhatThongTinPhongKham(event)">
                    
                    <div class="form-grid">
                        <div class="form-group-modal">
                            <label><i class="fa-solid fa-id-badge"></i>Mã Phòng Khám:</label>
                            <input type="text" id="maphongkham" readonly>
                        </div>

                        <div class="form-group-modal">
                            <label><i class="fa-solid fa-phone"></i>Số Điện Thoại Liên Hệ:</label>
                            <input type="text" id="sodienthoai" placeholder="Nhập số điện thoại...">
                        </div>

                        <div class="form-group-modal form-group-full">
                            <label><i class="fa-solid fa-signature"></i>Tên Phòng Khám:</label>
                            <input type="text" id="tenphongkham" placeholder="Nhập tên phòng khám thú y..." required>
                        </div>

                        <div class="form-group-modal form-group-full">
                            <label><i class="fa-solid fa-user-doctor"></i>Chủ Phòng Khám / Người Đại Diện:</label>
                            <input type="text" id="chuphongkham" placeholder="Họ tên chủ phòng khám...">
                        </div>

                        <div class="form-group-modal form-group-full">
                            <label><i class="fa-solid fa-location-dot"></i>Địa Chỉ Phòng Khám:</label>
                            <textarea id="diachi" rows="2" placeholder="Địa chỉ cơ sở khám bệnh..."></textarea>
                        </div>

                        <div class="form-group-modal form-group-full">
                            <label><i class="fa-solid fa-image"></i>Logo Phòng Khám:</label>
                            
                            <!-- Input ẩn lưu trữ đường dẫn URL thực tế sau khi upload -->
                            <input type="hidden" id="logoUrlHidden">

                            <div class="logo-upload-card">
                                <img id="imgPreview" class="logo-preview" src="" alt="Logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
                                <div class="logo-upload-info">
                                    <!-- Label tùy biến nút chọn file cho đẹp -->
                                    <label for="logoFile" class="custom-file-upload">
                                        <i class="fa-solid fa-cloud-arrow-up"></i> Chọn ảnh logo từ máy
                                    </label>
                                    <input type="file" id="logoFile" accept="image/*" onchange="xuLyChonFileLogo(this)">
                                    <span class="logo-hint">Hỗ trợ định dạng JPG, PNG. Hệ thống sẽ tự động đồng bộ hóa lên đám mây.</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ UPLOAD VÀ LƯU DỮ LIỆU -->
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const maphongkham = sessionStorage.getItem('maphongkham');
            if (!maphongkham) {
                alert('Không tìm thấy mã phòng khám trong phiên đăng nhập!');
                return;
            }

            document.getElementById('maphongkham').value = maphongkham;

            // Tải thông tin phòng khám hiện tại từ bảng chupk
            let { data, error } = await db
                .from('chupk')
                .select('*')
                .eq('maphongkham', maphongkham)
                .single();

            if (error) {
                console.error('Lỗi tải thông tin phòng khám:', error);
                return;
            }

            if (data) {
                document.getElementById('tenphongkham').value = data.tenphongkham || data.ten || '';
                document.getElementById('chuphongkham').value = data.chuphongkham || data.chupk || '';
                document.getElementById('sodienthoai').value = data.sodienthoai || data.sdt || '';
                document.getElementById('diachi').value = data.diachi || '';
                
                // Xử lý nạp logo linh hoạt (hỗ trợ cả URL đầy đủ và tên file)
                let rawLogo = data.logo || '';
                let logoUrl = '';

                if (rawLogo) {
                    if (rawLogo.startsWith('http')) {
                        logoUrl = rawLogo;
                    } else {
                        const { data: publicURLData } = db.storage.from('logo').getPublicUrl(rawLogo);
                        logoUrl = publicURLData ? publicURLData.publicUrl : '';
                    }
                }

                document.getElementById('logoUrlHidden').value = logoUrl;
                if (logoUrl) {
                    document.getElementById('imgPreview').src = logoUrl;
                }
            }
        });

        // Hàm tự động upload ảnh lên Supabase Storage khi người dùng chọn file
        async function xuLyChonFileLogo(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const maphongkham = sessionStorage.getItem('maphongkham');

            const fileExt = file.name.split('.').pop();
            const fileName = `logo_${maphongkham}_${Date.now()}.${fileExt}`;
            const filePath = `${fileName}`;

            alert('⏳ Đang tải ảnh lên hệ thống, vui lòng chờ giây lát...');

            // Tiến hành upload lên bucket có tên là 'logo' trên Supabase Storage
            let { data, error } = await db.storage
                .from('logo')
                .upload(filePath, file, { upsert: true });

            if (error) {
                alert('❌ Lỗi tải ảnh lên: ' + error.message);
                return;
            }

            // Lấy public URL của ảnh vừa upload
            const { data: publicURLData } = db.storage
                .from('logo')
                .getPublicUrl(filePath);

            const publicUrl = publicURLData.publicUrl;

            // Gán vào input ẩn và hiển thị xem trước
            document.getElementById('logoUrlHidden').value = publicUrl;
            document.getElementById('imgPreview').src = publicUrl;
            
            alert('✅ Tải ảnh logo lên thành công!');
        }

        async function capNhatThongTinPhongKham(event) {
            event.preventDefault();
            const maphongkham = sessionStorage.getItem('maphongkham');

            const payload = {
                tenphongkham: document.getElementById('tenphongkham').value.trim(),
                chuphongkham: document.getElementById('chuphongkham').value.trim(),
                sodienthoai: document.getElementById('sodienthoai').value.trim(),
                diachi: document.getElementById('diachi').value.trim(),
                logo: document.getElementById('logoUrlHidden').value.trim()
            };

            let { error } = await db
                .from('chupk')
                .update(payload)
                .eq('maphongkham', maphongkham);

            if (error) {
                alert('❌ Lỗi cập nhật: ' + error.message);
            } else {
                alert('✅ Đã cập nhật thông tin phòng khám thành công!');
                location.reload();
            }
        }
    </script>
</body>
</html>
