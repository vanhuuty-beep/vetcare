<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ với chúng tôi - Hệ thống VetCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; color: #1e293b; }
        .container { max-width: 1100px; margin: 50px auto; padding: 20px; }
        
        .contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; }
        
        /* Card Liên hệ */
        .contact-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { color: #008080; margin-bottom: 20px; }
        .info-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .info-item i { font-size: 20px; color: #008080; width: 30px; }

        /* Form Gửi tin */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .btn-submit { background: #008080; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #006666; }

        /* Bản đồ */
        .map-container { margin-top: 30px; height: 300px; border-radius: 16px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; color: #008080;">Liên Hệ Với Chúng Tôi</h1>
    <p style="text-align: center; margin-bottom: 40px;">Chúng tôi luôn sẵn sàng lắng nghe và hỗ trợ chăm sóc thú cưng của bạn.</p>

    <div class="contact-grid">
        <!-- Thông tin liên hệ -->
        <div class="contact-card">
            <h2>Thông tin</h2>
            <div class="info-item"><i class="fa-solid fa-location-dot"></i> <span>Đường An Ngãi Đông, Hòa Sơn, Hòa Vang, Đà Nẵng</span></div>
            <div class="info-item"><i class="fa-solid fa-phone"></i> <span>Hotline: 0905 XXX XXX</span></div>
            <div class="info-item"><i class="fa-solid fa-envelope"></i> <span>Email: contact@vetcare.vn</span></div>
            <div class="info-item"><i class="fa-solid fa-clock"></i> <span>Giờ làm việc: 08:00 - 20:00</span></div>
        </div>

        <!-- Form liên hệ -->
        <div class="contact-card">
            <h2>Gửi tin nhắn cho chúng tôi</h2>
            <form onsubmit="alert('Cảm ơn bạn đã gửi tin nhắn!'); return false;">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" placeholder="Nhập tên của bạn" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" placeholder="Nhập số điện thoại" required>
                </div>
                <div class="form-group">
                    <label>Nội dung cần hỗ trợ</label>
                    <textarea rows="4" placeholder="Bạn cần tư vấn vấn đề gì cho thú cưng?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Gửi Tin Nhắn</button>
            </form>
        </div>
    </div>

    <!-- Bản đồ -->
    <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3833.805562767073!2d108.17565437508316!3d16.07548038461755!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x314218c53842c943%3A0x6b772c914e1a052c!2zQW4gTmfDo2kgxJDDtG5nLCBIw7JhIFPGoW4sIEjDsmEgVmFuZywgxJDDoCBO4bq1bmcsIFZp4buHdCBOYW0!5e0!3m2!1svi!2s!4v1690000000000!5m2!1svi!2s" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

</body>
</html>
