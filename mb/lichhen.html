<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lịch hẹn - VetCare Mobile</title>
    
    <!-- Thư viện Supabase JS và các cấu hình chung -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>

    <!-- Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Khung giả lập màn hình mobile */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        @media (min-width: 415px) {
            .mobile-container {
                border-radius: 40px;
                border: 10px solid #222;
            }
        }
        
        /* App Header */
        .app-header {
            background: linear-gradient(135deg, #008080, #20b2aa);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .app-header a, .app-header button {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Nội dung cuộn */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        /* Thanh tìm kiếm */
        .search-box-container {
            margin-bottom: 14px;
        }
        .search-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
        }
        .search-input:focus {
            border-color: #008080;
            background: #fff;
        }

        /* Nút mở form thêm */
        .btn-open-form {
            background: #008080;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-open-form:hover {
            background: #006666;
        }

        /* Modal Form Thêm/Sửa dạng popup đè */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 12px;
        }
        .modal-container {
            background: #fff;
            width: 100%;
            max-width: 380px;
            max-height: 90vh;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow-y: auto;
            animation: fadeIn 0.2s ease-in-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .modal-header h3 {
            font-size: 15px;
            color: #008080;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #777;
        }
        .form-group-modal {
            margin-bottom: 10px;
        }
        .form-group-modal label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }
        .form-group-modal input, .form-group-modal select, .form-group-modal textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #fff;
            box-sizing: border-box;
        }
        .form-group-modal input:focus, .form-group-modal select:focus {
            border-color: #008080;
        }
        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .form-row .form-group-modal {
            flex: 1;
            margin-bottom: 0;
        }
        .modal-footer {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }
        .btn-primary {
            background: #008080;
            color: white;
            border: none;
            flex: 1;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* Danh sách Card hiển thị tối ưu mobile */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lichhen-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .lichhen-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .lichhen-info h4 {
            font-size: 14px;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .lichhen-info p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lichhen-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .lichhen-actions button {
            background: #f1f5f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-edit { color: #d97706; }
        .btn-delete { color: #dc2626; }

        /* Bottom Nav cố định dưới đáy chuẩn Mobile app */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #888;
            font-size: 10px;
            flex: 1;
        }
        .nav-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 2px;
        }
        .nav-item.active {
            color: #008080;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <!-- HEADER -->
    <div class="app-header">
        <a href="trangchu.html"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Quản lý Lịch hẹn</h2>
        <div style="width: 18px;"></div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="app-content">
        
        <!-- Ô TÌM KIẾM -->
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm tên chủ nuôi, SĐT, nội dung..." onkeyup="timKiemLichHen()">
        </div>

        <!-- NÚT MỞ FORM THÊM -->
        <button class="btn-open-form" onclick="moModalThem()">
            <i class="fa-solid fa-calendar-plus"></i> Thêm lịch hẹn mới
        </button>

        <!-- DANH SÁCH HIỂN THỊ -->
        <div class="section-title">
            <span>Danh sách lịch hẹn</span>
            <span id="totalCount" style="font-size: 12px; color: #64748b; font-weight: normal;">(0)</span>
        </div>
        
        <div class="lichhen-list" id="data-table">
            <!-- Dữ liệu được nạp tự động từ Supabase -->
        </div>

    </div>

    <!-- POPUP FORM THÊM / SỬA LỊCH HẸN -->
    <div class="modal-overlay" id="lichHenModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Tạo lịch hẹn mới</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            
            <input type="hidden" id="editingId">
            
            <div class="form-row">
                <div class="form-group-modal">
                    <label>Tên chủ nuôi (*):</label>
                    <input type="text" id="tenchunuoi" placeholder="Nhập tên chủ nuôi...">
                </div>
                <div class="form-group-modal">
                    <label>Số điện thoại:</label>
                    <input type="text" id="sdt" placeholder="Nhập SĐT...">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group-modal">
                    <label>Ngày hẹn (*):</label>
                    <input type="date" id="ngayhen">
                </div>
                <div class="form-group-modal">
                    <label>Trạng thái:</label>
                    <select id="trangthai">
                        <option value="Chờ khám">Chờ khám</option>
                        <option value="Đã hoàn thành">Đã hoàn thành</option>
                        <option value="Đã hủy">Đã hủy</option>
                    </select>
                </div>
            </div>

            <div class="form-group-modal">
                <label>Địa chỉ:</label>
                <input type="text" id="diachi" placeholder="Nhập địa chỉ khách hàng...">
            </div>

            <div class="form-group-modal">
                <label>Nội dung hẹn:</label>
                <textarea id="noidung" rows="2" placeholder="Nhập nội dung khám, tiêm phòng, spa..."></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuLichHen()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a href="trangchu.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            Trang chủ
        </a>
        <a href="lichhen.html" class="nav-item active">
            <i class="fa-solid fa-calendar-days"></i>
            Lịch hẹn
        </a>
        <a href="thucung.html" class="nav-item">
            <i class="fa-solid fa-paw"></i>
            Thú cưng
        </a>
        <a href="thongke.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            Báo cáo
        </a>
        <a href="khachhang.html" class="nav-item">
            <i class="fa-solid fa-users"></i>
            Khách hàng
        </a>
    </div>

</div>

<script>
    let danhSachLichHenGoc = [];

    window.addEventListener('DOMContentLoaded', async () => {
        await taiDanhSachLichHen();

        if (typeof db !== 'undefined' && db) {
            db.channel('realtime-lichhen-mobile')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'lichhen' }, async () => {
                  await taiDanhSachLichHen();
              })
              .subscribe();
        }
    });

    async function taiDanhSachLichHen() {
        const { data, error } = await db.from('lichhen').select('*').order('ngayhen', { ascending: true });
        if (error) {
            console.error('Lỗi tải lịch hẹn:', error);
        } else {
            danhSachLichHenGoc = data || [];
            hienThiBang(danhSachLichHenGoc);
        }
    }

    function hienThiBang(data) {
        const container = document.getElementById('data-table');
        document.getElementById('totalCount').innerText = `(${data.length})`;
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#64748b; font-size:13px; padding:20px;">Chưa có lịch hẹn nào</p>';
            return;
        }

        data.forEach(item => {
            let ngayHenFormatted = '---';
            if (item.ngayhen) {
                const parts = item.ngayhen.split('T')[0].split('-');
                if (parts.length === 3) {
                    ngayHenFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
                } else {
                    ngayHenFormatted = item.ngayhen;
                }
            }
            
            const trangThaiHienTai = item.trangthai || 'Chờ khám';
            let badgeColor = '#d97706'; 
            let bgBadge = '#fef3c7';
            let nextStatus = 'Đã hoàn thành';

            if(trangThaiHienTai === 'Đã hoàn thành') {
                badgeColor = '#059669'; 
                bgBadge = '#d1fae5';
                nextStatus = 'Đã hủy';
            } else if(trangThaiHienTai === 'Đã hủy') {
                badgeColor = '#dc2626'; 
                bgBadge = '#fee2e2';
                nextStatus = 'Chờ khám';
            }

            let rawSdt = String(item.sdt || '').trim();
            let displaySdt = rawSdt ? (rawSdt.startsWith('0') ? rawSdt : '0' + rawSdt) : '';

            container.innerHTML += `
                <div class="lichhen-card">
                    <div class="lichhen-info">
                        <h4>🐾 #${item.id} - ${item.tenchunuoi || '---'}</h4>
                        <p><i class="fa-solid fa-calendar-days" style="color:#008080;"></i> <b>${ngayHenFormatted}</b></p>
                        <p><i class="fa-solid fa-phone"></i> ${displaySdt ? `<a href="tel:${displaySdt}" style="color: #0284c7; text-decoration: none; font-weight: bold;">${displaySdt}</a>` : 'Không có SĐT'}</p>
                        <p><i class="fa-solid fa-note-sticky"></i> ${item.noidung || 'Không có nội dung'}</p>
                        <p>
                            <span onclick="capNhatTrangThaiLichHen(${item.id}, '${nextStatus}')" 
                                style="padding: 2px 8px; border-radius: 12px; font-size: 11px; background: ${bgBadge}; color: ${badgeColor}; font-weight: bold; cursor: pointer; display: inline-block;" 
                                title="Bấm để đổi trạng thái">
                                ${trangThaiHienTai} 🔄
                            </span>
                        </p>
                    </div>
                    <div class="lichhen-actions">
                        <button class="btn-edit" onclick="moModalSua(${item.id})" title="Sửa"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-delete" onclick="xoaLichHen(${item.id})" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
    }

    async function capNhatTrangThaiLichHen(id, trangThaiMoi) {
        if (typeof db === 'undefined' || !db) return;

        const { error } = await db
            .from('lichhen')
            .update({ trangthai: trangThaiMoi })
            .eq('id', id);

        if (error) {
            alert('Lỗi cập nhật trạng thái: ' + error.message);
        } else {
            await taiDanhSachLichHen();
        }
    }

    function timKiemLichHen() {
        const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
        const ketQuaLoc = danhSachLichHenGoc.filter(item => {
            const ten = (item.tenchunuoi || '').toLowerCase();
            const sdt = (item.sdt || '').toLowerCase();
            const noidung = (item.noidung || '').toLowerCase();
            return ten.includes(tuKhoa) || sdt.includes(tuKhoa) || noidung.includes(tuKhoa);
        });
        hienThiBang(ketQuaLoc);
    }

    function moModalThem() {
        document.getElementById('editingId').value = '';
        document.getElementById('tenchunuoi').value = '';
        document.getElementById('sdt').value = '';
        document.getElementById('diachi').value = '';
        document.getElementById('noidung').value = '';
        document.getElementById('trangthai').value = 'Chờ khám';
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('ngayhen').value = today;
        
        document.getElementById('modalTitle').innerText = 'Tạo lịch hẹn mới';
        document.getElementById('lichHenModal').style.display = 'flex';
    }

    function moModalSua(id) {
        const item = danhSachLichHenGoc.find(x => x.id === id);
        if (!item) return;

        document.getElementById('editingId').value = item.id;
        document.getElementById('tenchunuoi').value = item.tenchunuoi || '';
        document.getElementById('sdt').value = item.sdt || '';
        document.getElementById('diachi').value = item.diachi || '';
        document.getElementById('noidung').value = item.noidung || '';
        document.getElementById('trangthai').value = item.trangthai || 'Chờ khám';
        
        document.getElementById('ngayhen').value = item.ngayhen ? item.ngayhen.split('T')[0] : '';

        document.getElementById('modalTitle').innerText = 'Cập nhật lịch hẹn (ID: ' + id + ')';
        document.getElementById('lichHenModal').style.display = 'flex';
    }

    function dongModal() {
        document.getElementById('lichHenModal').style.display = 'none';
    }

    async function luuLichHen() {
        const id = document.getElementById('editingId').value;
        const tenchunuoi = document.getElementById('tenchunuoi').value.trim();
        const sdt = document.getElementById('sdt').value.trim();
        const ngayhen = document.getElementById('ngayhen').value;
        const diachi = document.getElementById('diachi').value.trim();
        const noidung = document.getElementById('noidung').value.trim();
        const trangthai = document.getElementById('trangthai').value;

        if (!tenchunuoi || !ngayhen) {
            alert('Vui lòng nhập Tên chủ nuôi và Ngày hẹn!');
            return;
        }

        const payload = {
            tenchunuoi: tenchunuoi,
            sdt: sdt,
            ngayhen: ngayhen,
            diachi: diachi,
            noidung: noidung,
            trangthai: trangthai
        };

        if (id === "") {
            const { error } = await db.from('lichhen').insert([payload]);
            if (error) {
                alert('Lỗi tạo lịch hẹn: ' + error.message);
            } else {
                alert('Tạo lịch hẹn thành công!');
                dongModal();
                await taiDanhSachLichHen();
            }
        } else {
            const { error } = await db.from('lichhen').update(payload).eq('id', id);
            if (error) {
                alert('Lỗi cập nhật lịch hẹn: ' + error.message);
            } else {
                alert('Cập nhật lịch hẹn thành công!');
                dongModal();
                await taiDanhSachLichHen();
            }
        }
    }

    async function xoaLichHen(id) {
        if (confirm('Bạn có chắc chắn muốn xóa lịch hẹn này không?')) {
            const { error } = await db.from('lichhen').delete().eq('id', id);
            if (error) {
                alert('Lỗi khi xóa: ' + error.message);
            } else {
                alert('Xóa lịch hẹn thành công!');
                await taiDanhSachLichHen();
            }
        }
    }
</script>

</body>
</html>
