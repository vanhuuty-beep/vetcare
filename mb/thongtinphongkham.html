<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin Phòng khám - VetCare Mobile</title>
    
    <!-- Nhận diện Font và Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Khung hiển thị giả lập màn hình điện thoại chuẩn mobile */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        @media (min-width: 415px) {
            .mobile-container {
                border-radius: 40px;
                border: 10px solid #222;
            }
        }
        
        /* App Header */
        .app-header {
            background: linear-gradient(135deg, #008080, #20b2aa);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-header h2 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        /* Nội dung chính cuộn được */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .form-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .form-group-modal {
            margin-bottom: 12px;
        }
        .form-group-modal label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }
        .form-group-modal input, .form-group-modal textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group-modal input:focus, .form-group-modal textarea:focus {
            border-color: #008080;
            box-shadow: 0 0 0 2px rgba(0, 128, 128, 0.1);
        }
        
        .logo-preview-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .logo-preview {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            border: 2px dashed #cbd5e1;
            object-fit: cover;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 10px;
            text-align: center;
        }
        .form-actions {
            margin-top: 16px;
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
        }
        .btn-primary {
            background-color: #008080;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #006666;
        }

        /* Thanh điều hướng dưới đáy (Bottom Nav) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #888;
            font-size: 10px;
            flex: 1;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 16px;
            display: block;
            margin-bottom: 2px;
        }
        .nav-item.active {
            color: #008080;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <!-- HEADER MOBILE -->
    <div class="app-header">
        <a href="trangchu.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>🏥 Thông Tin Phòng Khám</h2>
        <div style="width: 20px;"></div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="app-content">
        <div class="form-card">
            <form id="formThongTinPK" onsubmit="capNhatThongTinPhongKham(event)">
                
                <div class="form-group-modal">
                    <label>Mã Phòng Khám:</label>
                    <input type="text" id="maphongkham" readonly style="background-color: #f8fafc; color: #64748b; font-weight: bold; cursor: not-allowed;">
                </div>

                <div class="form-group-modal">
                    <label>Tên Phòng Khám:</label>
                    <input type="text" id="tenphongkham" placeholder="Nhập tên phòng khám..." required>
                </div>

                <div class="form-group-modal">
                    <label>Chủ Phòng Khám / Đại Diện:</label>
                    <input type="text" id="chuphongkham" placeholder="Họ tên chủ phòng khám...">
                </div>

                <div class="form-group-modal">
                    <label>Số Điện Thoại:</label>
                    <input type="text" id="sodienthoai" placeholder="Số điện thoại...">
                </div>

                <div class="form-group-modal">
                    <label>Địa Chỉ:</label>
                    <textarea id="diachi" rows="2" placeholder="Địa chỉ cơ sở khám..."></textarea>
                </div>

                <div class="form-group-modal">
                    <label>Logo Phòng Khám:</label>
                    <input type="file" id="logoFile" accept="image/*" onchange="xuLyChonFileLogo(this)" style="padding: 5px; background: #f8fafc; cursor: pointer; font-size: 11px;">
                    <input type="hidden" id="logoUrlHidden">

                    <div class="logo-preview-container">
                        <img id="imgPreview" class="logo-preview" src="" alt="Logo" onerror="this.style.display='flex'; this.src='';">
                        <span style="font-size: 11px; color: #64748b;">Chọn ảnh logo từ điện thoại.</span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">💾 Lưu Thay Đổi</button>
                </div>

            </form>
        </div>
    </div>

    <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG -->
    <div class="bottom-nav">
        <a href="trangchu.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            Trang chủ
        </a>
        <a href="lichhen.html" class="nav-item">
            <i class="fa-solid fa-calendar-days"></i>
            Lịch hẹn
        </a>
        <a href="thucung.html" class="nav-item">
            <i class="fa-solid fa-paw"></i>
            Thú cưng
        </a>
        <a href="thongke.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            Báo cáo
        </a>
        <a href="trangchu.html" class="nav-item active">
            <i class="fa-solid fa-user-gear"></i>
            Cài đặt
        </a>
    </div>

</div>

<!-- SCRIPT XỬ LÝ DỮ LIỆU -->
<script>
    window.addEventListener('DOMContentLoaded', async () => {
        let currentUser = null;
        try {
            currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        } catch (e) {
            currentUser = null;
        }

        const maphongkham = sessionStorage.getItem('maphongkham') || (currentUser ? currentUser.maphongkham : null);
        
        if (!maphongkham) {
            alert('Không tìm thấy mã phòng khám trong phiên đăng nhập!');
            window.location.replace('../index.html');
            return;
        }

        document.getElementById('maphongkham').value = maphongkham;

        let { data, error } = await db
            .from('chupk')
            .select('*')
            .eq('maphongkham', maphongkham)
            .maybeSingle();

        if (error) {
            console.error('Lỗi tải thông tin phòng khám:', error);
            return;
        }

        if (data) {
            document.getElementById('tenphongkham').value = data.tenphongkham || data.ten || '';
            document.getElementById('chuphongkham').value = data.chuphongkham || data.chupk || '';
            document.getElementById('sodienthoai').value = data.sodienthoai || data.sdt || '';
            document.getElementById('diachi').value = data.diachi || '';
            
            const logoUrl = data.logo || '';
            document.getElementById('logoUrlHidden').value = logoUrl;
            if (logoUrl) {
                document.getElementById('imgPreview').src = logoUrl;
            }
        }
    });

    async function xuLyChonFileLogo(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const maphongkham = sessionStorage.getItem('maphongkham');

        const fileExt = file.name.split('.').pop();
        const fileName = `logo_${maphongkham}_${Date.now()}.${fileExt}`;
        const filePath = `${fileName}`;

        alert('⏳ Đang tải ảnh lên hệ thống, vui lòng chờ giây lát...');

        let { data, error } = await db.storage
            .from('logo')
            .upload(filePath, file, { upsert: true });

        if (error) {
            alert('❌ Lỗi tải ảnh lên: ' + error.message);
            return;
        }

        const { data: publicURLData } = db.storage
            .from('logo')
            .getPublicUrl(filePath);

        const publicUrl = publicURLData.publicUrl;

        document.getElementById('logoUrlHidden').value = publicUrl;
        document.getElementById('imgPreview').src = publicUrl;
        
        alert('✅ Tải ảnh logo lên thành công!');
    }

    async function capNhatThongTinPhongKham(event) {
        event.preventDefault();
        const maphongkham = sessionStorage.getItem('maphongkham');

        const payload = {
            tenphongkham: document.getElementById('tenphongkham').value.trim(),
            chuphongkham: document.getElementById('chuphongkham').value.trim(),
            sodienthoai: document.getElementById('sodienthoai').value.trim(),
            diachi: document.getElementById('diachi').value.trim(),
            logo: document.getElementById('logoUrlHidden').value.trim()
        };

        let { error } = await db
            .from('chupk')
            .update(payload)
            .eq('maphongkham', maphongkham);

        if (error) {
            alert('❌ Lỗi cập nhật: ' + error.message);
        } else {
            alert('✅ Đã cập nhật thông tin phòng khám thành công!');
            window.location.href = 'trangchu.html';
        }
    }
</script>

</body>
</html>
