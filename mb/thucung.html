<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thú cưng - VetCare Mobile</title>
    
    <!-- Thư viện Supabase JS và các cấu hình chung -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>

    <!-- Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Khung giả lập màn hình mobile */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        @media (min-width: 415px) {
            .mobile-container {
                border-radius: 40px;
                border: 10px solid #222;
            }
        }
        
        /* App Header */
        .app-header {
            background: linear-gradient(135deg, #008080, #20b2aa);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .app-header a, .app-header button {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Nội dung cuộn */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        /* Thanh tìm kiếm */
        .search-box-container {
            margin-bottom: 14px;
        }
        .search-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
        }
        .search-input:focus {
            border-color: #008080;
            background: #fff;
        }

        /* Nút mở form thêm */
        .btn-open-form {
            background: #008080;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-open-form:hover {
            background: #006666;
        }

        /* Modal Form Thêm/Sửa */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-container {
            background: #fff;
            width: 100%;
            max-width: 380px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .modal-header h3 {
            font-size: 15px;
            color: #008080;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #777;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #008080;
        }
        .form-row {
            display: flex;
            gap: 8px;
        }
        .form-row .input-group {
            flex: 1;
        }
        .modal-footer {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }
        .btn-submit {
            background: #008080;
            color: white;
            border: none;
            flex: 1;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* Danh sách thú cưng card-style tối ưu mobile */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pet-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pet-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pet-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            flex-shrink: 0;
        }
        .pet-info {
            flex: 1;
            min-width: 0;
        }
        .pet-info h4 {
            font-size: 14px;
            color: #1e293b;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pet-info p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Nhóm nút thao tác nằm gọn bên phải */
        .pet-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            max-width: 110px;
            justify-content: flex-end;
            flex-shrink: 0;
        }
        .pet-actions button {
            background: #f1f5f9;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .pet-actions button:hover {
            filter: brightness(0.9);
        }
        .btn-medical { color: #0284c7; background: #e0f2fe; }   /* Khám bệnh */
        .btn-vaccine { color: #16a34a; background: #dcfce7; }   /* Tiêm vaccine */
        .btn-boarding { color: #ea580c; background: #ffedd5; }  /* Lưu trú */
        .btn-edit { color: #d97706; background: #fef3c7; }        /* Sửa */
        .btn-delete { color: #dc2626; background: #fee2e2; }      /* Xóa */

        /* Bottom Nav cố định dưới đáy */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #888;
            font-size: 10px;
            flex: 1;
        }
        .nav-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 2px;
        }
        .nav-item.active {
            color: #008080;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <!-- HEADER -->
    <div class="app-header">
        <a href="trangchu.html"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Quản lý Thú cưng</h2>
        <div style="width: 18px;"></div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="app-content">
        
        <!-- Ô TÌM KIẾM -->
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm tên pet, loài, giống..." onkeyup="timKiemThuCung()" autocomplete="off">
        </div>

        <!-- NÚT MỞ FORM THÊM -->
        <button class="btn-open-form" onclick="moModalThem()">
            <i class="fa-solid fa-paw"></i> Thêm thú cưng mới
        </button>

        <!-- DANH SÁCH HIỂN THỊ -->
        <div class="section-title">
            <span>Danh sách thú cưng</span>
            <span id="totalCount" style="font-size: 12px; color: #64748b; font-weight: normal;">(0)</span>
        </div>
        
        <div class="pet-list" id="pet-table-body">
            <!-- Dữ liệu được nạp tự động từ Supabase -->
        </div>

    </div>

    <!-- MODAL THÊM / SỬA THÚ CƯNG -->
    <div class="modal-overlay" id="petModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm thú cưng</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            
            <input type="hidden" id="editingId">
            
            <!-- Ô CHỤP ẢNH TRỰC TIẾP TỪ CAMERA ĐIỆN THOẠI -->
            <div class="input-group">
                <label>Hình ảnh thú cưng (Chụp từ Camera)</label>
                <input type="file" id="pet_anhFile" accept="image/*" capture="environment" onchange="xuLyChonFileAnhThuCung(this)" style="padding: 5px; background: #f8fafc; font-size: 11px; cursor: pointer;">
                <input type="hidden" id="pet_anhUrlHidden">
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 6px;">
                    <img id="pet_imgPreview" src="" alt="Ảnh thú cưng" style="width: 50px; height: 50px; border-radius: 6px; border: 2px dashed #cbd5e1; object-fit: cover; background: #f8fafc; display: none;">
                    <span style="font-size: 11px; color: #64748b;">Chạm để mở camera chụp ảnh trực tiếp.</span>
                </div>
            </div>

            <div class="input-group">
                <label>Tên thú cưng (*)</label>
                <input type="text" id="tenthucung" placeholder="Nhập tên pet...">
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>Loài</label>
                    <input type="text" id="loai" placeholder="VD: Chó, Mèo...">
                </div>
                <div class="input-group">
                    <label>Giới tính</label>
                    <select id="gioitinh">
                        <option value="">-- Chọn --</option>
                        <option value="Đực">Đực</option>
                        <option value="Cái">Cái</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>Giống</label>
                    <input type="text" id="giong" placeholder="VD: Poodle...">
                </div>
                <div class="input-group">
                    <label>Màu lông</label>
                    <input type="text" id="maulong" placeholder="VD: Vàng...">
                </div>
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>Tuổi</label>
                    <input type="number" id="tuoi" placeholder="Số tuổi">
                </div>
                <div class="input-group">
                    <label>Cân nặng (kg)</label>
                    <input type="number" step="0.1" id="cannang" placeholder="VD: 4.5">
                </div>
            </div>
            <div class="input-group">
                <label>Chủ nuôi</label>
                <select id="makhachhang">
                    <option value="">-- Chọn chủ nuôi --</option>
                </select>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-submit" onclick="luuThuCung()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a href="trangchu.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            Trang chủ
        </a>
        <a href="lichhen.html" class="nav-item">
            <i class="fa-solid fa-calendar-days"></i>
            Lịch hẹn
        </a>
        <a href="thucung.html" class="nav-item active">
            <i class="fa-solid fa-paw"></i>
            Thú cưng
        </a>
        <a href="thongke.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            Báo cáo
        </a>
        <a href="khachhang.html" class="nav-item">
            <i class="fa-solid fa-users"></i>
            Khách hàng
        </a>
    </div>

</div>

<script>
    let danhSachThuCungGoc = [];
    let mapKhachHang = {};

    window.addEventListener('DOMContentLoaded', async () => {
        await taiDuLieuKhachHangVaThuCung();

        if (typeof db !== 'undefined' && db) {
            db.channel('realtime-thucung-mobile')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'thucung' }, async () => {
                  await taiDuLieuKhachHangVaThuCung();
              })
              .subscribe();
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('action') === 'mo_modal') {
            const maKH = urlParams.get('makhachhang');
            setTimeout(() => {
                if (typeof moModalThem === 'function') moModalThem();
                const select = document.getElementById('makhachhang'); 
                if (select) select.value = maKH;
            }, 500);
        }
    });

    async function taiDuLieuKhachHangVaThuCung() {
        if (typeof db === 'undefined' || !db) return;

        const { data: khData } = await db.from('khachhang').select('*');
        const selectChuNuoi = document.getElementById('makhachhang');
        selectChuNuoi.innerHTML = `<option value="">-- Chọn chủ nuôi --</option>`;
        
        if (khData) {
            khData.forEach(kh => {
                mapKhachHang[kh.id] = kh.hovaten || kh.ten || 'Không tên';
                selectChuNuoi.innerHTML += `<option value="${kh.id}">${kh.hovaten || kh.ten} (${kh.sodienthoai || kh.sdt || '---'})</option>`;
            });
        }

        const { data, error } = await db
            .from('thucung')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error('Lỗi tải danh sách thú cưng:', error);
        } else {
            danhSachThuCungGoc = data || [];
            renderDanhSach(danhSachThuCungGoc);
        }
    }

    function renderDanhSach(dataList) {
        const container = document.getElementById('pet-table-body');
        document.getElementById('totalCount').innerText = `(${dataList.length})`;
        container.innerHTML = '';

        if (dataList.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #777; padding: 20px; font-size: 13px;">Chưa có dữ liệu thú cưng nào</div>`;
            return;
        }

        dataList.forEach(item => {
            const ten = item.tenthucung || 'Chưa đặt tên';
            const loai = item.loai || 'Chó/Mèo';
            const gioitinh = item.gioitinh || '---';
            const giong = item.giong || '---';
            const cannang = item.cannang ? `${item.cannang} kg` : '---';
            const maKH = item.makhachhang || item.khachhang_id;
            const tenChu = (maKH && mapKhachHang[maKH]) ? mapKhachHang[maKH] : 'Chưa rõ chủ';
            
            // Xử lý chuẩn hóa link ảnh, loại bỏ khoảng trắng và ký tự lạ nếu có
            let anhPet = item.hinhanh ? item.hinhanh.trim() : '';
            if (!anhPet || anhPet === 'null' || anhPet === 'undefined') {
                anhPet = 'https://cdn-icons-png.flaticon.com/512/616/616408.png';
            }

            container.innerHTML += `
                <div class="pet-card">
                    <img src="${anhPet}" class="pet-avatar" alt="Avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/616/616408.png'">
                    <div class="pet-info">
                        <h4>${ten} <span style="font-size: 11px; font-weight: normal; color: #008080;">(${loai} - ${gioitinh} - ${giong})</span></h4>
                        <p><i class="fa-solid fa-user" style="color: #008080;"></i> Chủ: <b>${tenChu}</b></p>
                        <p><i class="fa-solid fa-weight-scale" style="color: #e74c3c;"></i> Cân nặng: ${cannang} | Tuổi: ${item.tuoi !== null ? item.tuoi : '---'}</p>
                    </div>
                    <div class="pet-actions">
                        <button class="btn-medical" onclick="window.location.href='khambenh.html?mathucung=${item.id}&action=mokham'" title="Khám bệnh">
                            <i class="fa-solid fa-stethoscope"></i>
                        </button>
                        <button class="btn-vaccine" onclick="window.location.href='nhatkyvaccine.html?mathucung=${item.id}&makhachhang=${maKH || ''}'" title="Tiêm vaccine">
                            <i class="fa-solid fa-syringe"></i>
                        </button>
                        <button class="btn-boarding" onclick="window.location.href='nhatkynoitru.html?mathucung=${item.id}&makhachhang=${maKH || ''}'" title="Lưu trú">
                            <i class="fa-solid fa-hotel"></i>
                        </button>
                        <button class="btn-edit" onclick="moModalSua(${item.id})" title="Sửa">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn-delete" onclick="xoaThuCung(${item.id})" title="Xóa">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        });
    }

    // --- HÀM NÉN VÀ TẢI ẢNH CHỤP AN TOÀN (ĐÃ LOẠI BỎ KÝ TỰ XUỐNG DÒNG LỖI) ---
    async function xuLyChonFileAnhThuCung(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        
        // Làm sạch mã phòng khám, loại bỏ hoàn toàn khoảng trắng và ký tự xuống dòng
        let maphongkham = sessionStorage.getItem('maphongkham') || 'chung';
        maphongkham = String(maphongkham).replace(/[\r\n]+/g, "").trim();

        alert('⏳ Đang nén và tải ảnh lên hệ thống...');

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; // Giới hạn kích thước tối ưu cho mobile
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(async (blob) => {
                    // Tạo tên file chuẩn không chứa khoảng trắng hay ký tự xuống dòng
                    const fileName = `pet_cam_${maphongkham}_${Date.now()}.jpg`.replace(/[\r\n]+/g, "").trim();

                    let { data, error } = await db.storage
                        .from('images')
                        .upload(fileName, blob, { contentType: 'image/jpeg', upsert: true });

                    if (error) {
                        alert('❌ Lỗi tải ảnh: ' + error.message);
                        return;
                    }

                    const { data: publicURLData } = db.storage
                        .from('images')
                        .getPublicUrl(fileName);

                    const publicUrl = publicURLData.publicUrl.trim();

                    document.getElementById('pet_anhUrlHidden').value = publicUrl;
                    const preview = document.getElementById('pet_imgPreview');
                    if (preview) {
                        preview.src = publicUrl;
                        preview.style.display = 'block';
                    }
                    
                    alert('✅ Tải ảnh thành công!');
                }, 'image/jpeg', 0.7);
            };
        };
    }

    function timKiemThuCung() {
        const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = danhSachThuCungGoc.filter(item => {
            const ten = (item.tenthucung || '').toLowerCase();
            const loai = (item.loai || '').toLowerCase();
            const giong = (item.giong || '').toLowerCase();
            return ten.includes(tuKhoa) || loai.includes(tuKhoa) || giong.includes(tuKhoa);
        });
        renderDanhSach(filtered);
    }

    function moModalThem() {
        document.getElementById('editingId').value = '';
        document.getElementById('tenthucung').value = '';
        document.getElementById('loai').value = '';
        document.getElementById('gioitinh').value = '';
        document.getElementById('giong').value = '';
        document.getElementById('maulong').value = '';
        document.getElementById('tuoi').value = '';
        document.getElementById('cannang').value = '';
        document.getElementById('makhachhang').value = '';
        document.getElementById('pet_anhUrlHidden').value = '';
        document.getElementById('pet_anhFile').value = '';
        
        const preview = document.getElementById('pet_imgPreview');
        if (preview) {
            preview.src = '';
            preview.style.display = 'none';
        }

        document.getElementById('modalTitle').innerText = 'Thêm thú cưng mới';
        document.getElementById('petModal').style.display = 'flex';
    }

    function moModalSua(id) {
        const item = danhSachThuCungGoc.find(x => x.id === id);
        if (!item) return;

        document.getElementById('editingId').value = item.id;
        document.getElementById('tenthucung').value = item.tenthucung || '';
        document.getElementById('loai').value = item.loai || '';
        document.getElementById('gioitinh').value = item.gioitinh || '';
        document.getElementById('giong').value = item.giong || '';
        document.getElementById('maulong').value = item.maulong || '';
        document.getElementById('tuoi').value = item.tuoi !== null ? item.tuoi : '';
        document.getElementById('cannang').value = item.cannang !== null ? item.cannang : '';
        document.getElementById('makhachhang').value = item.makhachhang || item.khachhang_id || '';
        
        const hinhanh = item.hinhanh ? item.hinhanh.trim() : '';
        document.getElementById('pet_anhUrlHidden').value = hinhanh;
        document.getElementById('pet_anhFile').value = '';
        
        const preview = document.getElementById('pet_imgPreview');
        if (preview) {
            if (hinhanh && hinhanh !== '') {
                preview.src = hinhanh;
                preview.style.display = 'block';
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        }
        
        document.getElementById('modalTitle').innerText = 'Cập nhật thông tin pet';
        document.getElementById('petModal').style.display = 'flex';
    }

    function dongModal() {
        document.getElementById('petModal').style.display = 'none';
    }

    async function luuThuCung() {
        const id = document.getElementById('editingId').value;
        const tenthucung = document.getElementById('tenthucung').value.trim();
        const loai = document.getElementById('loai').value.trim();
        const gioitinh = document.getElementById('gioitinh').value;
        const giong = document.getElementById('giong').value.trim();
        const maulong = document.getElementById('maulong').value.trim();
        const tuoi = document.getElementById('tuoi').value.trim();
        const cannang = document.getElementById('cannang').value.trim();
        const makhachhang = document.getElementById('makhachhang').value;
        const hinhanh = document.getElementById('pet_anhUrlHidden').value.trim();

        if (!tenthucung) {
            alert('Vui lòng nhập tên thú cưng!');
            return;
        }

        const payload = {
            tenthucung: tenthucung,
            loai: loai,
            gioitinh: gioitinh,
            giong: giong,
            maulong: maulong,
            tuoi: tuoi !== "" ? parseInt(tuoi) : null,
            cannang: cannang !== "" ? parseFloat(cannang) : null,
            makhachhang: makhachhang !== "" ? parseInt(makhachhang) : null,
            hinhanh: hinhanh
        };

        if (id === "") {
            const { error } = await db.from('thucung').insert([payload]);
            if (error) {
                alert('Lỗi thêm thú cưng: ' + error.message);
                return;
            }
        } else {
            const { error } = await db.from('thucung').update(payload).eq('id', id);
            if (error) {
                alert('Lỗi cập nhật thú cưng: ' + error.message);
                return;
            }
        }

        alert('Lưu dữ liệu thành công!');
        dongModal();
        taiDuLieuKhachHangVaThuCung();
    }

    async function xoaThuCung(id) {
        if (confirm('Bạn có chắc chắn muốn xóa thú cưng này không?')) {
            const { error } = await db.from('thucung').delete().eq('id', id);
            if (error) {
                alert('Lỗi khi xóa: ' + error.message);
            } else {
                alert('Xóa thành công!');
                taiDuLieuKhachHangVaThuCung();
            }
        }
    }
</script>
