<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khách hàng - VetCare Mobile</title>
    
    <!-- Thư viện Supabase JS và các cấu hình chung -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>

    <!-- Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Khung giả lập màn hình mobile */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        @media (min-width: 415px) {
            .mobile-container {
                border-radius: 40px;
                border: 10px solid #222;
            }
        }
        
        /* App Header */
        .app-header {
            background: linear-gradient(135deg, #008080, #20b2aa);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-header h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .app-header a, .app-header button {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Nội dung cuộn */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        /* Thanh tìm kiếm */
        .search-box-container {
            margin-bottom: 14px;
        }
        .search-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
        }
        .search-input:focus {
            border-color: #008080;
            background: #fff;
        }

        /* Nút mở form thêm */
        .btn-open-form {
            background: #008080;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-open-form:hover {
            background: #006666;
        }

        /* Modal Form Thêm/Sửa dạng trượt hoặc popup đè */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-container {
            background: #fff;
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .modal-header h3 {
            font-size: 15px;
            color: #008080;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #777;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #008080;
        }
        .modal-footer {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }
        .btn-submit {
            background: #008080;
            color: white;
            border: none;
            flex: 1;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* Danh sách khách hàng card-style tối ưu mobile */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .customer-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .customer-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .customer-info h4 {
            font-size: 14px;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .customer-info p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .customer-actions {
            display: flex;
            gap: 6px;
        }
        .customer-actions button {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-edit { color: #d97706; }
        .btn-delete { color: #dc2626; }
        .btn-add-pet { color: #059669; }

        /* Bottom Nav cố định dưới đáy */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #888;
            font-size: 10px;
            flex: 1;
        }
        .nav-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 2px;
        }
        .nav-item.active {
            color: #008080;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <!-- HEADER -->
    <div class="app-header">
        <a href="trangchu.html"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Quản lý Khách hàng</h2>
        <div style="width: 18px;"></div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="app-content">
        
        <!-- Ô TÌM KIẾM -->
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm theo tên chủ nuôi, số điện thoại..." onkeyup="timKiemKhachHang()">
        </div>

        <!-- NÚT MỞ FORM THÊM -->
        <button class="btn-open-form" onclick="moModalThem()">
            <i class="fa-solid fa-user-plus"></i> Thêm chủ thú cưng mới
        </button>

        <!-- DANH SÁCH HIỂN THỊ -->
        <div class="section-title">
            <span>Danh sách chủ nuôi</span>
            <span id="totalCount" style="font-size: 12px; color: #64748b; font-weight: normal;">(0)</span>
        </div>
        
        <div class="customer-list" id="customer-table-body">
            <!-- Dữ liệu được nạp tự động từ Supabase -->
        </div>

    </div>

    <!-- MODAL THÊM / SỬA KHÁCH HÀNG -->
    <div class="modal-overlay" id="khachHangModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm khách hàng</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            
            <input type="hidden" id="editingId">
            
            <div class="input-group">
                <label>Họ và tên chủ nuôi (*)</label>
                <input type="text" id="hovaten" placeholder="Nhập họ tên...">
            </div>
            <div class="input-group">
                <label>Số điện thoại (*)</label>
                <input type="text" id="sodienthoai" placeholder="Nhập số điện thoại...">
            </div>
            <div class="input-group">
                <label>Địa chỉ</label>
                <textarea id="diachi" rows="2" placeholder="Nhập địa chỉ..."></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-submit" onclick="luuKhachHang()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a href="trangchu.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            Trang chủ
        </a>
        <a href="lichhen.html" class="nav-item">
            <i class="fa-solid fa-calendar-days"></i>
            Lịch hẹn
        </a>
        <a href="thucung.html" class="nav-item">
            <i class="fa-solid fa-paw"></i>
            Thú cưng
        </a>
        <a href="thongke.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            Báo cáo
        </a>
        <a href="khachhang.html" class="nav-item active">
            <i class="fa-solid fa-users"></i>
            Khách hàng
        </a>
    </div>

</div>

<script>
    let danhSachKhachHangGoc = [];

    window.addEventListener('DOMContentLoaded', async () => {
        await fetchKhachHang();

        // Lắng nghe realtime từ Supabase nếu có
        if (typeof db !== 'undefined' && db) {
            db.channel('realtime-khachhang-mobile')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'khachhang' }, async () => {
                  await fetchKhachHang();
              })
              .subscribe();
        }
    });

    async function fetchKhachHang() {
        if (typeof db === 'undefined' || !db) {
            console.error("Chưa kết nối được Supabase!");
            return;
        }

        const { data, error } = await db
            .from('khachhang')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error('Lỗi tải danh sách khách hàng:', error);
        } else {
            danhSachKhachHangGoc = data || [];
            renderDanhSach(danhSachKhachHangGoc);
        }
    }

    function renderDanhSach(dataList) {
        const container = document.getElementById('customer-table-body');
        document.getElementById('totalCount').innerText = `(${dataList.length})`;
        container.innerHTML = '';

        dataList.forEach(item => {
            const ten = item.hovaten || item.ten || 'Chưa cập nhật';
            const sdt = item.sodienthoai || item.sdt || 'Chưa có SĐT';
            
            // Đây là cấu trúc giao diện cũ của bạn
            container.innerHTML += `
                <div class="customer-card">
                    <div class="customer-info">
                        <h4>${ten}</h4>
                        <p><i class="fa-solid fa-phone"></i> ${sdt}</p>
                    </div>
                    <div class="customer-actions">
                        <!-- Nút 🐾 mới: Giữ nguyên phong cách, thêm tính năng -->
                        <button onclick="window.location.href='thucung.html?makhachhang=${item.id}&action=mo_modal'" title="Thêm thú cưng">
                            <i class="fa-solid fa-paw" style="color: #008080;"></i>
                        </button>
                        <button onclick="moModalSua(${item.id})" title="Sửa"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="xoaKhachHang(${item.id})" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function timKiemKhachHang() {
        const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = danhSachKhachHangGoc.filter(item => {
            const ten = (item.hovaten || item.ten || '').toLowerCase();
            const sdt = (item.sodienthoai || item.sodienthoai || '').toLowerCase();
            return ten.includes(tuKhoa) || sdt.includes(tuKhoa);
        });
        renderDanhSach(filtered);
    }

    function moModalThem() {
        document.getElementById('editingId').value = '';
        document.getElementById('hovaten').value = '';
        document.getElementById('sodienthoai').value = '';
        document.getElementById('diachi').value = '';
        document.getElementById('modalTitle').innerText = 'Thêm chủ thú cưng mới';
        document.getElementById('khachHangModal').style.display = 'flex';
    }

    function moModalSua(id) {
        const item = danhSachKhachHangGoc.find(x => x.id === id);
        if (!item) return;

        document.getElementById('editingId').value = item.id;
        document.getElementById('hovaten').value = item.hovaten || item.ten || '';
        document.getElementById('sodienthoai').value = item.sodienthoai || item.sdt || '';
        document.getElementById('diachi').value = item.diachi || '';
        document.getElementById('modalTitle').innerText = 'Cập nhật thông tin';
        document.getElementById('khachHangModal').style.display = 'flex';
    }

    function dongModal() {
        document.getElementById('khachHangModal').style.display = 'none';
    }

    async function luuKhachHang() {
        const id = document.getElementById('editingId').value;
        const hovaten = document.getElementById('hovaten').value.trim();
        const sodienthoai = document.getElementById('sodienthoai').value.trim();
        const diachi = document.getElementById('diachi').value.trim();

        if (!hovaten || !sodienthoai) {
            alert('Vui lòng nhập Họ tên và Số điện thoại!');
            return;
        }

        const payload = {
            hovaten: hovaten,
            sodienthoai: sodienthoai,
            diachi: diachi
        };

        if (id === "") {
            const { error } = await db.from('khachhang').insert([payload]);
            if (error) {
                alert('Lỗi thêm khách hàng: ' + error.message);
                return;
            }
        } else {
            const { error } = await db.from('khachhang').update(payload).eq('id', id);
            if (error) {
                alert('Lỗi cập nhật khách hàng: ' + error.message);
                return;
            }
        }

        alert('Lưu dữ liệu thành công!');
        dongModal();
        fetchKhachHang();
    }

    async function xoaKhachHang(id) {
        if (confirm('Bạn có chắc chắn muốn xóa khách hàng này không?')) {
            const { error } = await db.from('khachhang').delete().eq('id', id);
            if (error) {
                alert('Lỗi khi xóa: ' + error.message);
            } else {
                alert('Xóa thành công!');
                fetchKhachHang();
            }
        }
    }
</script>

</body>
</html>
