<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Chủ Phòng Khám - VetCare Pro</title>
    <!-- Thư viện Supabase JS và CryptoJS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="../js/env.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/smart-search.js"></script>
    <!-- Gọi file CSS chung -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/style1.css">
    <link rel="stylesheet" href="../css/smart-search.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
            --bg-page: #f1f5f9;
        }

        body {
            background: var(--bg-page);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
        }

        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
            max-height: 95vh;
            overflow-y: auto;
        }

        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-header h2 {
            margin: 0 0 6px 0;
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
        }

        .register-header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input[type="file"].form-control {
            padding: 8px 12px;
            background: #f8fafc;
            cursor: pointer;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-register:hover {
            background: var(--primary-dark);
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .back-login a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="register-header">
            <h2>🏥 VETCARE PRO</h2>
            <p>Đăng ký tài khoản Chủ Phòng Khám mới</p>
        </div>

        <form onsubmit="xuLyDangKyChuPK(event)">
            <div class="form-group">
                <label>Tên Phòng Khám (*):</label>
                <input type="text" id="tenphongkham" class="form-control" placeholder="Ví dụ: Phòng Khám Thú Y An Khang" required>
            </div>

            <div class="form-group">
                <label>Họ và Tên Chủ Phòng Khám (*):</label>
                <input type="text" id="hovaten" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <div class="form-group">
                <label>Số Điện Thoại (Đăng nhập) (*):</label>
                <input type="text" id="sodienthoai" class="form-control" placeholder="Ví dụ: 0905123456" required>
            </div>

            <div class="form-group">
                <label>Mật Khẩu (*):</label>
                <input type="password" id="matkhau" class="form-control" placeholder="Nhập mật khẩu bảo mật..." required>
            </div>

            <div class="form-group">
                <label>Tải Lên Logo Phòng Khám (Chọn file ảnh):</label>
                <input type="file" id="logoFile" class="form-control" accept="image/*">
                <small style="color: var(--text-secondary); font-size: 11px; margin-top: 4px; display: block;">Ảnh sẽ tự động upload lên Supabase Storage (Bucket: logo).</small>
            </div>

            <div class="form-group">
                <label>Địa Chỉ Phòng Khám (*):</label>
                <input type="text" id="diachi" class="form-control" placeholder="Ví dụ: 123 Nguyễn Văn Linh, Đà Nẵng" required>
            </div>

            <button type="submit" id="btnSubmit" class="btn-register">Đăng Ký Tài Khoản</button>
        </form>

        <div class="back-login">
            <a href="login-chupk.html">⬅️ Quay lại trang đăng nhập</a>
        </div>
    </div>

    <script>
        async function xuLyDangKyChuPK(event) {
            event.preventDefault();
            
            const tenphongkham = document.getElementById('tenphongkham').value.trim();
            const hovaten = document.getElementById('hovaten').value.trim();
            const sodienthoai = document.getElementById('sodienthoai').value.trim();
            const matkhauRaw = document.getElementById('matkhau').value.trim();
            const fileInput = document.getElementById('logoFile');
            const diachi = document.getElementById('diachi').value.trim();
            const btn = document.getElementById('btnSubmit');

            // Kiểm tra bổ sung chống bỏ trống địa chỉ
            if (!diachi) {
                alert('Vui lòng nhập Địa chỉ phòng khám!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang xử lý tạo tài khoản...';

            try {
                let { data: checkExist } = await db.from('chupk')
                    .select('sodienthoai')
                    .eq('sodienthoai', sodienthoai)
                    .maybeSingle();

                if (checkExist) {
                    alert('Số điện thoại này đã được đăng ký hệ thống trước đó!');
                    btn.disabled = false;
                    btn.textContent = 'Đăng Ký Tài Khoản';
                    return;
                }

                let logoUrl = '';

                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = 'logo_reg_' + Date.now() + '_' + Math.floor(Math.random() * 1000) + '.' + fileExt;
                    const filePath = `${fileName}`;

                    let { error: uploadError } = await db.storage.from('logo').upload(filePath, file);
                    if (uploadError) {
                        throw new Error('Lỗi upload logo: ' + uploadError.message);
                    }

                    let { data: publicURLData } = db.storage.from('logo').getPublicUrl(filePath);
                    logoUrl = publicURLData.publicUrl;
                }

                const autoMaPK = 'PK_' + Math.floor(100000 + Math.random() * 900000);

                const ngayHienTai = new Date();
                const ngayHetHanMacDinh = new Date();
                ngayHetHanMacDinh.setDate(ngayHienTai.getDate() + 30);

                const hashedPassword = CryptoJS.MD5(matkhauRaw).toString();

                const payload = {
                    maphongkham: autoMaPK,
                    tenphongkham: tenphongkham,
                    hovaten: hovaten,
                    sodienthoai: sodienthoai,
                    matkhau: hashedPassword,
                    logo: logoUrl,
                    diachi: diachi,
                    vaitro: 'Chủ phòng khám',
                    trangthai: 'Hoạt động',
                    ngaytao: ngayHienTai.toISOString(),
                    ngayhethan: ngayHetHanMacDinh.toISOString()
                };

                let { error } = await db.from('chupk').insert([payload]);

                if (error) throw error;

                alert('🎉 Đăng ký thành công! Bạn được tặng 30 ngày trải nghiệm miễn phí. Mã phòng khám của bạn là: ' + autoMaPK);
                window.location.href = 'login-chupk.html';

            } catch (err) {
                console.error('Lỗi đăng ký:', err);
                alert('Lỗi khi đăng ký: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Đăng Ký Tài Khoản';
            }
        }
    </script>
</body>
</html>
